            <p class="film-desc">История Napster — сервиса, который всего за полтора года превратил пиратство в обыденность и фактически уничтожил музыкальную индустрию: от эпохи дешевых компакт-дисков до судебных исков против подростков. Фильм, в котором участвуют Шон Фэннинг и ветераны индустрии (представляющие обе стороны конфликта), передает как азарт гиков, движимых идеей «музыка должна быть бесплатной», так и панику бизнеса, не сумевшего создать iTunes раньше, чем это сделали сами пользователи. Это кино о том, что любая медиаиндустрия существует лишь до тех пор, пока не появится технология, способная ее опередить.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">The story of Napster — the service that made piracy routine in eighteen months and burned the music industry down: from cheap CDs to lawsuits against teenagers. With Sean Fanning and industry veterans on both sides, the film captures the geek thrill of &#x27;music should be free&#x27; and the business panic of an industry that could not invent iTunes before its users did. A film about how any media industry lives exactly until the technology that outruns it arrives.</p>
            </details>
