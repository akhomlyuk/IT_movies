            <p class="film-alt">Tron</p>
            <div class="film-meta">
              <span class="film-meta-item">1982</span>
              <span class="film-meta-item">Приключения, Фантастика</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/17463/" target="_blank" rel="noopener noreferrer">Кинопоиск: 6.9</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt0084827/" target="_blank" rel="noopener noreferrer">IMDb: 6.7</a>

            <p class="film-desc">Программист Кевин Флинн, чей код присвоил бывший начальник, пытается взломать систему «Мастер-контроль» через терминал, но лазерный луч оцифровывает его и переносит внутрь компьютера. Здесь программы выглядят как люди и не знают своих «пользователей», а «Мастер-контроль» правит как тиран, уничтожая всё, что проявляет независимость. Флинн объединяется с программой защиты по имени Трон и участвует в гонках на светоциклах на арене. Это был первый фильм, представивший цифровую вселенную как полноценное пространство: «сеть», неоновое свечение, сияющие диски — именно здесь был создан весь визуальный язык «компьютерного мира».</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Programmer Kevin Flynn, whose code was stolen by a former boss, tries to hack the Master Control through a terminal — and a laser beam digitizes him into the computer. Here programs look like people, do not know their &#x27;users&#x27;, and the Master Control rules like a tyrant, deleting everything independent. Flynn joins Tron, a security program, and rides light cycles in arena races. The first film to show the digital universe as a place: the grid, the neon, the glowing discs — the whole visual language of &#x27;the computer world&#x27; was invented here.</p>
            </details>
          </div>
