            <h1 class="film-title">Терминатор: Битва за будущее</h1>
            <p class="film-alt">Terminator: The Sarah Connor Chronicles</p>
            <div class="film-meta">
              <span class="film-meta-item">2008</span>
              <span class="film-meta-item">Боевик, Фантастика</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/260995/" target="_blank" rel="noopener noreferrer">Кинопоиск: 6.9</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt0851851/" target="_blank" rel="noopener noreferrer">IMDb: 7.6 ★</a>
        </div>
            <p class="film-desc">Судный день не отменён, а отложен: Кэмерон, модель T-1001, выброшенная из будущего, которого больше нет, появилась на пятнадцать лет раньше — и у Сары Коннор, скрывающейся с сыном в 2007 году, появился шанс, которого у её поколения не было. Это история о сопротивлении, в чьих рядах оказался пришелец из будущего — над которым у них нет власти и чью собственную историю они не могут себе присвоить, — а также о том, что происходит с человеком, когда он узнаёт своё будущее, которое уже невозможно отменить.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Judgment Day is not avoided in this version of Terminator, only deferred: Cameron, a T-1001 thrown out of a future that no longer exists, arrived fifteen years early, and Sarah Connor, hiding with her son in 2007, has the chance her generation never had. Two seasons about a resistance line that has a visitor from the future but neither control over it nor any claim on its own history, and about what knowing your own future does to a person when it can no longer be called off.</p>
            </details>
          </div>
