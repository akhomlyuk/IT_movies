            <p class="film-desc">В четырнадцать лет Аарон Шварц участвовал в создании формата RSS, а затем работал над проектами Creative Commons и Reddit, а также боролся за открытый доступ к знаниям. Массовое скачивание им статей из базы JSTOR через сеть MIT обернулось обвинениями, многолетним судебным преследованием и смертью в возрасте 26 лет. Этот документальный фильм, основанный на интервью с семьей, друзьями и коллегами, рассказывает о человеке, который задал вопрос, на который до сих пор не найдено лучшего ответа: кому принадлежат знания?</p>
            <p class="film-desc film-desc-alt">At fourteen, Aaron Swartz helped create RSS, then worked on Creative Commons, Reddit and the fight for open access to knowledge. His mass download of JSTOR articles through the MIT network turned into charges, years of prosecution and his death at 26. Built from interviews with family, friends and colleagues, the documentary is about a person who asked a question no one has improved on: who owns knowledge?</p>
