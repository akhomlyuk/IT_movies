            <p class="film-desc">Кембриджскому математику Алану Тьюрингу, который не умеет ладить с людьми и притворяться, поручают взломать код «Энигмы» — шифровальной машины, настройки которой немецкий флот меняет ежедневно. Его решением становится создание устройства, способного перебирать варианты гораздо быстрее человека, — прообраза современного компьютера. Взлом шифра позволил сократить войну на несколько лет, однако личная тайна Тьюринга обернулась для него приговором со стороны государства, которое он спас. Это фильм о человеке, который первым задался вопросом «могут ли машины мыслить» — за столетие до появления ChatGPT.</p>
            <p class="film-desc film-desc-alt">Cambridge mathematician Alan Turing, unable to get along with people or pretend, is tasked with cracking Enigma — a cipher machine the German navy reconfigures daily. His answer is to build a machine that tries variants faster than humans: a prototype of the modern computer. Beating the cipher shortened the war by years, but Turing&#x27;s personal secret turned into a verdict from the very state he saved. A film about the man who first asked &#x27;can machines think&#x27; — a century before ChatGPT.</p>
