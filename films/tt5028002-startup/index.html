  <script>window.FILM_PAGE = {"item": {"type": "series", "titleEn": "StartUp", "titleRu": "Стартап", "desc": {"ru": "Драма о независимой цифровой валюте, которую три незнакомца — финансист, гангстер и программист — запускают вне банков и вне правил, чтобы деньги перестали принадлежать структурам, разрушившим их жизни. Чем дальше идёт их криптокомпания, тем ближе подбираются ФБР, венчурные деньги и те, кто считает электронную свободу угрозой режиму. Мрачный триллер о деньгах нового поколения и о цене, которую платят за веру в них.", "en": "A drama about an independent digital currency launched by three strangers — a financier, a gangster and a developer — outside any bank and any rule, so money stops belonging to the structures that destroyed their lives. The further their crypto company goes, the closer come the FBI, venture money and those who consider electronic freedom a threat to the state. A gritty thriller about a new generation of money and the price of believing in it."}, "genres": ["crime", "thriller"], "year": 2016, "imdbId": "tt5028002", "imdbRating": 7.8, "kpId": 972878, "kpRating": 7.6, "poster": "static/posters/startup_series_poster.webp"}, "related": [{"type": "movie", "titleEn": "Swordfish", "titleRu": "Пароль «Рыба-меч»", "desc": {"ru": "Бизнесмен и террорист Гэбриэл Шир вербует Стэнли Джобсона — хакера, только что вышедшего из тюрьмы, — для выполнения одной задачи: за 60 секунд, под дулом пистолета и на фоне отвлекающего шоу, перевести 9,5 миллиарда долларов из средств правительства США. Знаменитая сцена взлома, стильные перестрелки и постоянный вопрос о том, кто же на самом деле кого использует. Это голливудская фантазия о хакерах, где нет ни капли правдоподобия, — и всё же сюжетная линия о ловушке, устроенной ради «последнего дела», выглядит убедительно.", "en": "Terrorist businessman Gabriel Shear recruits Stanley Jobson, a hacker just out of prison, for one task: in 60 seconds, under gunpoint and amid a distracting show, transfer 9.5 billion dollars of US government money. A famous hacking scene, stylish gunfights and a running question of who is really using whom. A Hollywood fantasy about hacking where nothing is plausible — and yet the story of the 'one last job' trap is convincing."}, "genres": ["crime", "thriller"], "year": 2001, "imdbId": "tt0244244", "imdbRating": 6.5, "kpId": 849, "kpRating": 7.2, "poster": "static/posters/swordfish_film_poster.webp"}, {"type": "movie", "titleEn": "21", "titleRu": "Двадцать одно", "desc": {"ru": "Бен Кэмпбелл, лучший студент-математик в MIT, отчаянно нуждается в деньгах на оплату обучения в Гарварде. Профессор Микки Роза приглашает его в команду, которая обыгрывает казино Лас-Вегаса с помощью подсчета карт: у каждого игрока своя роль, а успех строится на холодном расчете, памяти и железной дисциплине. Чем крупнее выигрыши, тем сильнее Бен погружается в игру — и тем ближе к нему подбирается служба безопасности казино, прекрасно осведомленная о методах карточных игроков. Это история о том, как математика может победить случайность, и о цене такой победы.", "en": "Ben Campbell, the best math student at MIT, desperately needs money for Harvard tuition. Professor Micky Rosa recruits him into a team that beats Las Vegas casinos with card counting: every player has a role, and the winnings rest on cold arithmetic, memory and iron discipline. The bigger the payouts, the deeper Ben sinks into the game — and the closer casino security, which knows everything about counters, gets to him. A story about how math can beat chance, and what that victory costs."}, "genres": ["crime", "drama"], "year": 2008, "imdbId": "tt0478087", "imdbRating": 6.8, "kpId": 195847, "kpRating": 7.7, "poster": "static/posters/21_film_poster.webp"}, {"type": "movie", "titleEn": "Minority Report", "titleRu": "Особое мнение", "desc": {"ru": "Вашингтон, 2054 год: система «Особое мнение» (PreCrime), основанная на пророчествах трех «оракулов», предотвращает убийства еще до их совершения. Джон Эндертон, лучший сотрудник этого подразделения, сам становится подозреваемым: оракулы предсказывают, что он убьет человека, которого никогда не встречал. Бежать бессмысленно: его глаза сканируют в каждом магазине, реклама обращается к нему по имени, а механические пауки прочесывают здания. Фильм Стивена Спилберга по мотивам произведения Филипа К. Дика — история о предсказании будущего, неприкосновенности частной жизни и свободе воли.", "en": "Washington, 2054: the PreCrime system, built on prophecies of three 'oracles', stops murders before they happen. John Anderton, the unit's best officer, becomes a suspect himself: the oracles predict he will kill a man he has never met. Running is pointless — his eyes are scanned in every store, ads address him by name, and mechanical spiders comb the buildings. Spielberg's Philip K. Dick adaptation about prediction, privacy and free will."}, "genres": ["crime", "drama"], "year": 2002, "imdbId": "tt0181689", "imdbRating": 7.6, "kpId": 496, "kpRating": 7.7, "fav": true, "poster": "static/posters/minorityreport_film_poster.webp"}, {"type": "movie", "titleEn": "Hacker", "titleRu": "Хакер", "desc": {"ru": "Алекс, иммигрант из Косово, живущий в Нью-Йорке у дяди, — настоящий компьютерный гений. После семейной трагедии ему срочно нужны деньги, и его путь на кривую дорожку начинается с малого: фишинга, взлома систем и погружения в даркнет. Мелкие аферы перерастают в серьезный бизнес, а анонимность в сети становится зависимостью, от которой невозможно отказаться. Это криминальная драма о двух сторонах цифровой эпохи — безграничных возможностях и безнаказанности, — и о том, как она ломает человека, уверенного, что его никогда не найдут.", "en": "Alex, an immigrant from Kosovo living with his uncle in New York, is brilliant with computers. After a family tragedy he needs money, and the way down starts small: phishing, bypassing systems, the darknet. Petty schemes grow into a business, and online anonymity becomes an addiction he cannot quit. A crime drama about the double edge of the digital era — infinite possibility and impunity — and how it breaks a person who believed no one would ever find him."}, "genres": ["crime", "drama"], "year": 2016, "imdbId": "tt3173594", "imdbRating": 6.1, "kpId": 797601, "kpRating": 6.7, "poster": "static/posters/hacker_film_poster.webp"}, {"type": "movie", "titleEn": "Antitrust", "titleRu": "Опасная правда", "desc": {"ru": "Майло Хоффман, выпускник Стэнфорда, мечтающий изменить мир с помощью программирования, получает предложение от NURV — мегакорпорации, основанной легендарным Гэри Уинстоном. Неограниченные ресурсы, творческая свобода и культ личности босса — мечта любого программиста. Но всё меняется, когда Майло замечает, что коллеги начинают исчезать, а в работе обнаруживается чужой, украденный код. Это триллер о слепом поклонении основателю, корпоративном шпионаже и о том, какую цену приходится платить, когда ради бонуса при найме и опционов на акции отказываешься от собственных принципов.", "en": "Milo Hoffman, a Stanford graduate dreaming of changing the world with code, gets an offer from NURV, the mega-corp of legendary founder Gary Winston. Top resources, creative freedom, a cult of personality around the boss — a programmer's dream. Until Milo notices colleagues disappearing and someone else's code turning up stolen. A thriller about founder worship, corporate espionage and the price of dropping your principles for a signing bonus and options."}, "genres": ["thriller", "drama"], "year": 2001, "imdbId": "tt0218817", "imdbRating": 6.1, "kpId": 592, "kpRating": 6.7, "poster": "static/posters/antitrust_film_poster.webp"}], "posterW": 400, "posterH": 600};</script>
