            <h1 class="film-title">Дивный новый мир</h1>
            <p class="film-alt">Brave New World</p>
            <div class="film-meta">
              <span class="film-meta-item">2020</span>
              <span class="film-meta-item">Драма, Фантастика</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/1263485/" target="_blank" rel="noopener noreferrer">Кинопоиск: 7.2 ★</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt9814116/" target="_blank" rel="noopener noreferrer">IMDb: 7.0 ★</a>
        </div>
            <p class="film-desc">Экранизация антиутопии Хаксли: в «Новом мире» нет ни боли, ни старения, ни жестких правил в отношениях — людей выращивают в колбах, а при малейшей тревоге выдают «сому». Бернард и Линина отправляются в «Резервацию», где люди по-прежнему живут по старинке — с болью, браком и историей, — и сталкиваются с суровой реальностью, которая оказывается им не по зубам. Сериал получился мягче книги, но суть осталась прежней: счастье по рецепту — это тоже способ контроля. Задолго до появления «успокаивающих лент новостей» Хаксли точно описал, как это работает.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">An adaptation of Huxley&#x27;s dystopia: the New World has no pain, no aging, no sex with rules — castes are made in bottles, and &#x27;soma&#x27; is handed out for any anxiety. Bernard and Lenina visit the Reservation, where people still live the old way — with pain, marriage and history — and break against that reality. The series is softer than the book, but the core holds: happiness on prescription is also a form of control. Long before &#x27;soothing feeds&#x27;, Huxley described exactly how that works.</p>
            </details>
          </div>
