          <div class="film-info">
            <h1 class="film-title">The KGB, the Computer and Me</h1>
            <div class="film-meta">
              <span class="film-meta-item">1990</span>
              <span class="film-meta-item">Документальный</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/372662/" target="_blank" rel="noopener noreferrer">Кинопоиск: —</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt0308449/" target="_blank" rel="noopener noreferrer">IMDb: 7.9 ★</a>
        </div>
            <p class="film-desc">Клиффорд Столл, астроном, ставший системным администратором лаборатории в Беркли, обнаруживает бухгалтерскую нестыковку в 75 центов и в ходе расследования выходит на хакера, продающего данные КГБ. Столл сам рассказывает эту историю — дело «Яйцо кукушки», ставшее одной из первых задокументированных киберопераций. Это живая лекция о том, как проводятся расследования на основе анализа логов — за десятилетия до появления термина «реагирование на инциденты».</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Clifford Stoll, an astronomer turned lab system administrator at Berkeley, spots a 75-cent accounting error and, untangling it, finds a hacker selling data to the KGB. Stoll narrates the film himself, retelling the &#x27;Cuckoo&#x27;s Egg&#x27; case — one of the first documented cyber operations. A living lecture on how investigations work through logs — decades before the term &#x27;incident response&#x27;.</p>
            </details>
          </div>
