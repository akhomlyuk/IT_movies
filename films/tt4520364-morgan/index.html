D who humiliates them online. The trail leads to an abandoned house in the desert, where something inexplicable happens — and then one of them wakes up in a biohazard suit among people in protective gear. The further it goes, the clearer it becomes that 'hacking' here is an existential category, not a network one. A stylish sci-fi noir about watchers, simulation and the price of curiosity."}, "genres": ["thriller", "scifi"], "year": 2014, "imdbId": "tt2910814", "imdbRating": 6.0, "kpId": 762854, "kpRating": 5.3}, {"type": "movie", "titleEn": "The Thirteenth Floor", "titleRu": "Тринадцатый этаж", "desc": {"ru": "Лос-Анджелес, 1999 год: инженер Хэннон Фуллер создает симуляцию Лос-Анджелеса 1937 года, воссоздавая каждого прохожего, и оставляет записку своему коллеге Дугласу Холлу, которую тот так и не дочитывает. Обнаружив его мертвым, Холл входит в симуляцию и постепенно понимает: вопрос не в том, кто убил Фуллера, а в том, где заканчивается смоделированное и начинается «реальное». Философская научная фантастика, основанная на романе Дэниела Галуйе.", "en": "Los Angeles, 1999: engineer Hannon Fuller builds a simulation of 1937 Los Angeles down to the last passerby and leaves a note for colleague Douglas Hall that he never gets to read. Finding him dead, Hall enters the simulation and gradually understands: the question is not who killed Fuller but where the modeled ends and the 'real' begins. Philosophical sci-fi based on Daniel Galouye's novel."}, "genres": ["thriller", "scifi"], "year": 1999, "imdbId": "tt0139809", "imdbRating": 7.0, "kpId": 1086, "kpRating": 7.6, "fav": true, "poster": "static/posters/13floor_film_poster.webp"}, {"type": "movie", "titleEn": "Anon", "titleRu": "Анон", "desc": {"ru": "Будущее, в котором упразднено понятие частной жизни: каждый миг существования фиксируется «глазами», полиция восстанавливает события по воспоминаниям свидетелей, а доказательства собираются задним числом. Детектив Сэл Фриленд расследует серию убийств, которые никто не видит, — преступления совершает та, кто умеет стирать себя из чужих записей. Это антиутопия, снятая в жанре полицейского процедурала и задающая неудобный вопрос: если всё вокруг записывается, что же остается от человека — и возможна ли вообще вина, если нет памяти? Эндрю Никкол, режиссер «Гаттаки», здесь в своей стихии.", "en": "A future where privacy is abolished: every moment of life is recorded through the eyes, police replay events from witnesses' memories, and evidence is gathered retroactively. Detective Sal Frieland investigates a series of murders no one can see, committed by someone who knows how to delete herself from other people's records. A dystopia shot as a procedural, asking an uncomfortable question: if everything is recorded, what is left of a person — and is guilt even possible without memory? Andrew Niccol, director of Gattaca, in his element."}, "genres": ["scifi", "thriller"], "year": 2018, "imdbId": "tt5397194", "imdbRating": 6.1, "kpId": 979121, "kpRating": 6.4, "poster": "static/posters/anon_film_poster.webp"}, {"type": "movie", "titleEn": "Blade Runner", "titleRu": "Бегущий по лезвию", "desc": {"ru": "Лос-Анджелес, 2019 год: бесконечный дождь, неоновые огни и корпорации, торгующие жизнями. Рик Декард, бывший «бегущий по лезвию», вынужден вернуться к работе, чтобы уничтожить группу сбежавших с внеземной колонии репликантов модели Nexus-6. Проблема в том, что он охотится не на машины: репликанты Nexus-6 помнят своих матерей, боятся смерти и способны любить сильнее, чем окружающие их люди. Эта экранизация произведения Филипа К. Дика определила визуальный стиль киберпанка на десятилетия вперед и по сей день остается лучшим фильмом о том, что значит быть человеком.", "en": "Los Angeles, 2019: endless rain, neon, corporations trading in lives. Rick Deckard, a retired blade runner, is pulled back in to eliminate a group of escaped Nexus-6 replicants from an off-world colony. The problem is he is not hunting a machine: Nexus-6 remember their mothers, fear death and love more than the people around them. A Philip K. Dick adaptation that defined cyberpunk's visual language for decades — and is still the best film about what being human means."}, "genres": ["scifi", "thriller"], "year": 1982, "imdbId": "tt0083658", "imdbRating": 8.2, "kpId": 403, "kpRating": 7.7, "fav": true, "poster": "static/posters/bladerunner_film_poster.webp"}], "posterW": null, "posterH": null};</script>
