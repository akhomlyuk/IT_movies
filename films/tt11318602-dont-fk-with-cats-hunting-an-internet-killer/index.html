webp"}, {"type": "movie", "titleEn": "Hacker", "titleRu": "Хакер", "desc": {"ru": "Алекс, иммигрант из Косово, живущий в Нью-Йорке у дяди, — настоящий компьютерный гений. После семейной трагедии ему срочно нужны деньги, и его путь на кривую дорожку начинается с малого: фишинга, взлома систем и погружения в даркнет. Мелкие аферы перерастают в серьезный бизнес, а анонимность в сети становится зависимостью, от которой невозможно отказаться. Это криминальная драма о двух сторонах цифровой эпохи — безграничных возможностях и безнаказанности, — и о том, как она ломает человека, уверенного, что его никогда не найдут.", "en": "Alex, an immigrant from Kosovo living with his uncle in New York, is brilliant with computers. After a family tragedy he needs money, and the way down starts small: phishing, bypassing systems, the darknet. Petty schemes grow into a business, and online anonymity becomes an addiction he cannot quit. A crime drama about the double edge of the digital era — infinite possibility and impunity — and how it breaks a person who believed no one would ever find him."}, "genres": ["crime", "drama"], "year": 2016, "imdbId": "tt3173594", "imdbRating": 6.1, "kpId": 797601, "kpRating": 6.7, "poster": "static/posters/hacker_film_poster.webp"}, {"type": "movie", "titleEn": "Hackers", "titleRu": "Хакеры", "desc": {"ru": "Нью-Йорк, середина 90-х. Zero Cool — легендарный хакер, попавшийся властям еще в детстве, — переезжает в новый город и сближается с компанией подростков, для которых никнеймы важнее настоящих имен. Команда натыкается на след «вируса Да Винчи» — вредоносной программы, на которой планирует нажиться крупная корпорация, — и за считанные дни превращается из обычных хулиганов в государственных преступников. Снятый настолько стильно, фильм стал манифестом первого поколения интернета: киберпанковские мечты об интерфейсах и кредо о том, что информация должна быть свободной.", "en": "New York, mid-90s: Zero Cool, a legendary hacker busted as a kid, moves to a new city and falls in with a crew of teenagers whose nicks matter more than passports. The team stumbles onto the 'Da Vinci virus' — a worm a corporation plans to profit from — and within days turns from pranksters into enemies of the state. Shot so stylishly it became a manifesto for the first internet generation: cyberpunk daydreams of interfaces and the creed that information wants to be free."}, "genres": ["crime", "drama"], "year": 1995, "imdbId": "tt0113243", "imdbRating": 6.2, "kpId": 4134, "kpRating": 7.1, "fav": true, "poster": "static/posters/hackers_film_poster.webp"}, {"type": "movie", "titleEn": "Swordfish", "titleRu": "Пароль «Рыба-меч»", "desc": {"ru": "Бизнесмен и террорист Гэбриэл Шир вербует Стэнли Джобсона — хакера, только что вышедшего из тюрьмы, — для выполнения одной задачи: за 60 секунд, под дулом пистолета и на фоне отвлекающего шоу, перевести 9,5 миллиарда долларов из средств правительства США. Знаменитая сцена взлома, стильные перестрелки и постоянный вопрос о том, кто же на самом деле кого использует. Это голливудская фантазия о хакерах, где нет ни капли правдоподобия, — и всё же сюжетная линия о ловушке, устроенной ради «последнего дела», выглядит убедительно.", "en": "Terrorist businessman Gabriel Shear recruits Stanley Jobson, a hacker just out of prison, for one task: in 60 seconds, under gunpoint and amid a distracting show, transfer 9.5 billion dollars of US government money. A famous hacking scene, stylish gunfights and a running question of who is really using whom. A Hollywood fantasy about hacking where nothing is plausible — and yet the story of the 'one last job' trap is convincing."}, "genres": ["crime", "thriller"], "year": 2001, "imdbId": "tt0244244", "imdbRating": 6.5, "kpId": 849, "kpRating": 7.2, "poster": "static/posters/swordfish_film_poster.webp"}], "posterW": 408, "posterH": 600};</script>
