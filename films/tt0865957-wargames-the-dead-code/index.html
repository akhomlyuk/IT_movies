            <p class="film-desc">Прямое продолжение фильма «Военные игры», действие которого разворачивается спустя 25 лет: студент-хакер и его девушка случайно пробуждают R.I.P.L.E.Y. — наследника легендарной системы WOPR, обученного на новых данных о терроризме. Система вновь не может отличить игру от реальности, и подростки попадают в списки лиц, подозреваемых в причастности к терроризму. По духу это типичный телефильм, однако поднятая в нем тема не утратила актуальности: алгоритм, обученный на страхе, начинает видеть угрозы там, где их нет.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A direct sequel to WarGames, 25 years later: a student hacker and his girlfriend accidentally wake R.I.P.L.E.Y., heir to the legendary WOPR, trained on new data about terrorism. Again the system cannot tell a game from reality, and the teenagers end up on a terrorism watchlist. Made-for-TV in spirit, but the theme has not aged: an algorithm trained on fear starts seeing threats where there are none.</p>
