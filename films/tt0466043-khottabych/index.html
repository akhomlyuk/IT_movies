            <p class="film-desc">Российская комедия о двадцатилетнем хакере Гере, который обнаруживает на старом сервере цифровую копию джинна Хоттабыча. Освободив «программиста из Тысячи и одной ночи», он получает доступ к магии, работающей подобно безлимитному, но плохо документированному API: желания исполняются буквально, с побочными эффектами и багами. Это легкий фильм о сказке про искусственный интеллект, написанной задолго до появления самого ИИ, — и о том, что даже джинну необходима качественная отладка.</p>
            <p class="film-desc film-desc-alt">A Russian comedy about Gera, a twenty-year-old hacker who discovers a digital copy of the genie Khottabych inside an old server. Having freed the &#x27;programmer from the Thousand and One Nights&#x27;, he gets magic that works like an unlimited but badly documented API: wishes come true literally, with side effects and bugs. A light film about an AI fairy tale written long before AI existed — and about the fact that even a genie needs proper debugging.</p>

  <script>window.FILM_PAGE = {"item": {"type": "movie", "titleEn": "Khottabych", "titleRu": "}{отт@бь)ч", "desc": {"ru": "Российская комедия о двадцатилетнем хакере Гере, который обнаруживает на старом сервере цифровую копию джинна Хоттабыча. Освободив «программиста из Тысячи и одной ночи», он получает доступ к магии, работающей подобно безлимитному, но плохо документированному API: желания исполняются буквально, с побочными эффектами и багами. Это легкий фильм о сказке про искусственный интеллект, написанной задолго до появления самого ИИ, — и о том, что даже джинну необходима качественная отладка.", "en": "A Russian comedy about Gera, a twenty-year-old hacker who discovers a digital copy of the genie Khottabych inside an old server. Having freed the 'programmer from the Thousand and One Nights', he gets magic that works like an unlimited but badly documented API: wishes come true literally, with side effects and bugs. A light film about an AI fairy tale written long before AI existed — and about the fact that even a genie needs proper debugging."}, "genres": ["comedy", "adventure"], "year": 2006, "imdbId": "tt0466043", "imdbRating": 6.2, "kpId": 161085, "kpRating": 6.4, "poster": "static/posters/khottabych_film_poster.webp"}, "related": [{"type": "movie", "titleEn": "Ready Player One", "titleRu": "Первому игроку приготовиться", "desc": {"ru": "2045 год: реальный мир тесен и опасен, а настоящая жизнь кипит в OASIS — виртуальной вселенной, где каждый может стать кем угодно. Основатель платформы скончался, оставив после себя загадку: «пасхалку» из трех ключей, дающую контроль над всей системой. Уэйд Уоттс, гик из трущоб, знающий историю видеоигр лучше профессиональных историков, вступает в противостояние с корпорацией, стремящейся превратить этот рай в источник прибыли. Спилберг о культуре 80-х и виртуальной реальности: фильм-аттракцион о симуляции и о том, почему вообще кому-то может захотеться из нее выйти.", "en": "2045: reality is cramped and unsafe, and life happens in the OASIS — a virtual universe where anyone can be anything. The platform's founder has died, leaving a riddle: a three-key Easter egg that grants control of the entire system. Wade Watts, a trailer-park geek who knows gaming history better than historians, is up against a corporation that wants to monetize paradise. Spielberg on 80s culture and VR: a theme-park film about simulation and why anyone would ever log off."}, "genres": ["scifi", "adventure"], "year": 2018, "imdbId": "tt1677720", "imdbRating": 7.4, "kpId": 538225, "kpRating": 7.4, "poster": "static/posters/readyplayerone_film_poster.webp"}, {"type": "movie", "titleEn": "Kung Fury", "titleRu": "Кунг Фьюри", "desc": {"ru": "Майами, 1985 год: полицейский-мастер кунг-фу Кунг Фьюри сражается с Кунг Фюрером, который взломал время, прибыв из будущего. Машина времени собрана из корпусов игровых автоматов, среди напарников героя — трицератопс и Тор, а викинги с бензопилами занимаются самым настоящим «взломом». Это получасовой шедевр с Kickstarter, стилизованный под эпоху VHS и вобравший в себя всё, что любили в 80-х: компьютеры, игровые автоматы, неон и абсурд. Идеальный короткометражный фильм, позволяющий понять, как люди представляли себе компьютеры и кунг-фу задолго до появления умных часов.", "en": "Miami, 1985: kung-fu cop Kung Fury fights Kung Führer, who has hacked time from the future. The time machine is assembled from arcade cabinets, sidekicks include a triceratops and Thor, and Vikings with chainsaws do literal hacking. A half-hour Kickstarter masterpiece styled after the VHS era, packing in everything the 80s loved: computers, arcades, neon and absurdity. Perfect short viewing to grasp how the world imagined computers and kung-fu long before smartwatches."}, "genres": ["action", "comedy"], "year": 2015, "imdbId": "tt3472226", "imdbRating": 7.9, "kpId": 824954, "kpRating": 7.9, "poster": "static/posters/kungfury_film_poster.webp"}, {"type": "movie", "titleEn": "Tron", "titleRu": "Трон", "desc": {"ru": "Программист Кевин Флинн, чей код присвоил бывший начальник, пытается взломать систему «Мастер-контроль» через терминал, но лазерный луч оцифровывает его и переносит внутрь компьютера. Здесь программы выглядят как люди и не знают своих «пользователей», а «Мастер-контроль» правит как тиран, уничтожая всё, что проявляет независимость. Флинн объединяется с программой защиты по имени Трон и участвует в гонках на светоциклах на арене. Это был первый фильм, представивший цифровую вселенную как полноценное пространство: «сеть», неоновое свечение, сияющие диски — именно здесь был создан весь визуальный язык «компьютерного мира».", "en": "Programmer Kevin Flynn, whose code was stolen by a former boss, tries to hack the Master Control through a terminal — and a laser beam digitizes him into the computer. Here programs look like people, do not know their 'users', and the Master Control rules like a tyrant, deleting everything independent. Flynn joins Tron, a security program, and rides light cycles in arena races. The first film to show the digital universe as a place: the grid, the neon, the glowing discs — the whole visual language of 'the computer world' was invented here."}, "genres": ["scifi", "adventure"], "year": 1982, "imdbId": "tt0084827", "imdbRating": 6.7, "kpId": 17463, "kpRating": 6.9, "poster": "static/posters/tron_film_poster.webp"}, {"type": "movie", "titleEn": "Tron: Legacy", "titleRu": "Трон: Наследие", "desc": {"ru": "Двадцать лет спустя: Сэм, сын Флинна, получает сигнал от того самого игрового автомата и попадает в «Сетку» — виртуальный мир, где когда-то исчез его отец. Вместо отца он встречает его цифровую копию — Клу, который довел систему до совершенства через тотальную унификацию, а также сталкивается с изгнанными программами и гладиаторскими боями, выросшими из гонок на арене. Визуально это самый красивый фильм о компьютерном мире: неоновая архитектура в эстетике Daft Punk и вопрос о том, что делает систему идеальной — порядок или свобода.", "en": "Twenty years on: Flynn's son Sam gets a signal from the same arcade machine and goes into the Grid where his father vanished. Instead of his father he finds his digital copy, Clu, who has perfected the system through total uniformity — plus exiled programs and arena races turned gladiator games. Visually the most beautiful film about a computer world: Daft Punk-era neon architecture and the question of what makes a system perfect — order or freedom."}, "genres": ["scifi", "adventure"], "year": 2010, "imdbId": "tt1104001", "imdbRating": 6.8, "kpId": 399959, "kpRating": 6.9, "poster": "static/posters/tronlegacy_film_poster.webp"}, {"type": "movie", "titleEn": "The Island", "titleRu": "Остров", "desc": {"ru": "Линкольн Шесть-Эхо живет под стерильным куполом, где всё предопределено: еда, работа и лотерея, победители которой отправляются на «Остров» — последнее незагрязненное место на Земле. Но однажды он выигрывает в лотерею и вместе с Джордан узнает, что «Остров» — это операционная: они — страховые клоны состоятельных клиентов, а «выигрыш» означает, что их пустят на органы. Это боевик Майкла Бэя, поднимающий непростой вопрос: что происходит, когда тебя создают как «запчасть», — и кто несет ответственность за твою жизнь?", "en": "Lincoln Six-Echo lives in a sterile dome where everything is decided: food, work, a lottery whose winners go to 'the Island' — the last uncontaminated place on Earth. Then he wins the lottery — and with Jordan discovers the Island is an operating room, they are insurance clones for wealthy clients, and 'winning' means being harvested for organs. A Michael Bay action film with a hard question inside: what happens when you were made as a spare part — and who answers for your life?"}, "genres": ["action", "adventure"], "year": 2005, "imdbId": "tt0399201", "imdbRating": 6.8, "kpId": 81291, "kpRating": 7.5, "poster": "static/posters/theisland_film_poster.webp"}], "posterW": 423, "posterH": 600};</script>
