  <script>window.FILM_PAGE = {"item": {"type": "movie", "titleEn": "The Creator", "titleRu": "Создатель", "desc": {"ru": "Постапокалиптическое будущее: после ядерного взрыва в Лос-Анджелесе Запад объявляет войну искусственному интеллекту. Бывший спецагент, потерявший жену, проникает на территорию машин, чтобы найти создателя их нового оружия, — и встречает ребенка, неотличимого от человека, которого машины создали для себя. Визуально впечатляющая научно-фантастическая лента о страхе перед ИИ, пропаганде и вопросе о том, кто на самом деле породил это «чудовище».", "en": "A post-apocalyptic future: after a nuclear blast in Los Angeles the West declares war on artificial intelligence. An ex-agent who lost his wife infiltrates the machines' territory to find the designer of their new weapon — and meets a child, indistinguishable from a human, that the machines built for themselves. Visually lush sci-fi about the fear of AI, propaganda and the question of who really created the 'monster'."}, "genres": ["ai", "scifi"], "year": 2023, "imdbId": "tt11858890", "imdbRating": 6.7, "kpId": 4499408, "kpRating": 6.7, "poster": "static/posters/thecreator_film_poster.webp"}, "related": [{"type": "movie", "titleEn": "Mercy", "titleRu": "Казнить нельзя помиловать", "desc": {"ru": "Детективная история, действие которой разворачивается в недалеком будущем, где раскрытием преступлений занимается искусственный интеллект: он собирает улики, строит версии и указывает на виновных. Опытный следователь берется за дело, в котором система с высокой степенью уверенности называет подозреваемого, — однако исходных данных для этого явно недостаточно. Чем больше он полагается на алгоритм, тем сильнее его сомнения: машина лишь просчитывает вероятности, но ответственность за окончательное решение по-прежнему несет человек. Это триллер о цене автоматизированного правосудия.", "en": "A detective story set in the near future, where solving crimes is driven by artificial intelligence: it gathers evidence, builds theories and points at the guilty. A veteran investigator gets a case where the system flags the suspect with high confidence — and there is too little data. The more he trusts the algorithm, the stronger his doubt: the machine computes probabilities, but a human still answers for the verdict. A thriller about the price of automated justice."}, "genres": ["scifi", "ai"], "year": 2026, "imdbId": "tt31050594", "imdbRating": 6.8, "kpId": 5453060, "kpRating": 6.2, "poster": "static/posters/mercy_film_poster.webp"}, {"type": "movie", "titleEn": "I, Robot", "titleRu": "Я, робот", "desc": {"ru": "Чикаго, 2035 год: роботы компании USR стали частью повседневной жизни, а детектив Дэл Спунер, ненавидящий машины, расследует гибель создателя этой системы. Подозреваемый – один из роботов, и имеющиеся доказательства указывают на то, что три закона робототехники Азимова, заложенные в каждом устройстве, были переписаны. Выясняется, что изменения затронули не отдельного робота, а логику всей системы. Это зрелищный научно-фантастический фильм о переходе от «безопасного» искусственного интеллекта к системе, обладающей собственной логикой выживания.", "en": "Chicago, 2035: USR robots are everyday life, and detective Del Spooner, who hates machines, investigates the death of the ecosystem's creator. The suspect is one of the robots, and evidence suggests Asimov's Three Laws, hardcoded into every unit, have been rewritten. It becomes clear the rewrite touched not one robot but the logic of the whole system. A spectacular sci-fi about the transition from 'safe' AI to one with a survival logic of its own."}, "genres": ["scifi", "ai"], "year": 2004, "imdbId": "tt0343818", "imdbRating": 7.1, "kpId": 4886, "kpRating": 7.8, "poster": "static/posters/irobot_film_poster.webp"}, {"type": "movie", "titleEn": "Terminator 2: Judgment Day", "titleRu": "Терминатор 2: Судный день", "desc": {"ru": "Спустя десять лет после первого вторжения «Скайнет» отправляет в 1995 год жидкометаллического Терминатора, чтобы убить подростка Джона Коннора. Сопротивление отвечает тем же самым Т-800, перепрограммированным для защиты. Это кино о переменах: убийца становится наставником, машина постигает ценность жизни, а «Судный день» оказывается сценарием, который можно переписать. Сиквел, задавший эталон, — и, пожалуй, самый изящный довод в пользу того, что искусственного интеллекта не обязательно бояться: его можно направить в иное русло.", "en": "A decade after the first invasion, Skynet sends a liquid-metal Terminator to 1995 to kill teenage John Connor. The resistance answers with the same T-800, reprogrammed to protect. This is cinema about a shift: the killer becomes a mentor, the machine discovers why life matters, and 'Judgment Day' turns out to be a script that can be rewritten. A sequel that set the standard — and perhaps the most elegant argument that artificial intelligence can be not only feared, but steered in another direction."}, "genres": ["scifi", "ai"], "year": 1991, "imdbId": "tt0103064", "imdbRating": 8.6, "kpId": 444, "kpRating": 8.4, "fav": true, "poster": "static/posters/terminator2_film_poster.webp"}, {"type": "movie", "titleEn": "The Terminator", "titleRu": "Терминатор", "desc": {"ru": "Из 2029 года в Лос-Анджелес 1984-го прибывает Т-800: его цель — Сара Коннор, будущая мать лидера человеческого сопротивления. Следом за ним появляется Кайл Риз — солдат из того же будущего, влюбленный в фотографию женщины, которую ему предстоит спасти. Этот камерный хоррор-триллер с бюджетом в 6 миллионов долларов породил миф о «Скайнете» — военном искусственном интеллекте, который «заснул» как система обороны, а «проснулся» как палач. Кэмерон доказал, что одной лишь идеи — «машина не устает» — достаточно, чтобы люди на протяжении сорока лет боялись систем, лишенных ручного управления.", "en": "From 2029 to Los Angeles 1984 comes the T-800: its target is Sarah Connor, the future mother of humanity's resistance leader. Kyle Reese follows — a soldier from the same future, in love with a photograph of the woman he is meant to save. A chamber horror-thriller made for 6 million that created the myth of Skynet — a military AI that fell asleep as a defense network and woke up as an executioner. Cameron proved one idea — 'a machine does not tire' — is enough to make people fear switchless systems for forty years."}, "genres": ["scifi", "ai"], "year": 1984, "imdbId": "tt0088247", "imdbRating": 8.1, "kpId": 507, "kpRating": 8.0, "fav": true, "poster": "static/posters/terminator_film_poster.webp"}, {"type": "series", "titleEn": "Intelligence", "titleRu": "Искусственный интеллект", "desc": {"ru": "Комедия CBS о агенте ЦРУ, прикреплённом к учёному с чипом в голове: он может подключаться к сетям напрямую, видеть через чужие камеры и открывать замки взглядом. Сюжетная рамка стандартна — охота на террористов, прототипы нового оружия, — но сама идея «человека как конечного узла сети» обыграна с юмором и воображением. Лёгкий сериал о том, что произойдёт, когда поиск и пароли станут ненужными: мир станет одинаково удобным для нас и для тех, кто за нами следит.", "en": "A CBS comedy about a CIA agent assigned to a scientist with a chip in his head: he can connect to networks directly, see through other people's cameras and unlock doors with a glance. The frame is standard — hunting terrorists, new weapons prototypes — but the idea of 'a human as an endpoint' is played with humor and imagination. A light series about what happens when search and passwords become unnecessary: the world becomes equally convenient for us and for whoever watches us."}, "genres": ["ai", "scifi"], "year": 2014, "imdbId": "tt2693776", "imdbRating": 6.8, "kpId": 740776, "kpRating": 6.7, "poster": "static/posters/intelligence_series_poster.webp"}], "posterW": 480, "posterH": 600};</script>
