            <p class="film-desc">Документальный фильм о «пиратской экономике» в эпоху BitTorrent и The Pirate Bay. В нем интервью с философами и юристами сочетаются со смелыми утверждениями: «копирование — это то, чем культура занималась всегда», «права собственности на данные не работают». Первая часть была создана после рейда на The Pirate Bay, а вторая посвящена архитектуре, которую невозможно закрыть. Фильм обязателен к просмотру для всех, кто хочет разобраться в спорах об авторском праве, выйдя за рамки дилеммы «скачивать или нет».</p>
            <p class="film-desc film-desc-alt">A documentary about the pirate economy in the age of BitTorrent and The Pirate Bay. It mixes interviews with philosophers and lawyers with provocative claims: &#x27;copying is what culture has always done&#x27;, &#x27;property rights on data do not work&#x27;. Part one was made after the raid on The Pirate Bay, part two is about an architecture that cannot be shut down. Required viewing for anyone who wants to understand copyright debates beyond &#x27;downloading yes or no&#x27;.</p>
