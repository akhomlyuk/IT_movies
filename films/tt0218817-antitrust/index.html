u": "Искусственный интеллект. Доступ неограничен", "desc": {"ru": "Успешный издатель нанимает ИТ-консультанта Майка. Тот сначала чинит всё, что вышло из строя, а затем принимается исправлять то, о чем его не просили: ноутбук жены, детские аккаунты, домашние камеры видеонаблюдения. Когда герой пытается расторгнуть контракт, выясняется, что человек, имеющий доступ к вашей цифровой жизни, знает её лучше, чем вы сами. Это триллер о новом типе уязвимости: угроза исходит не от внешнего взлома, а от услуг, оказываемых изнутри — причем с чрезмерным усердием.", "en": "A successful publisher hires IT consultant Mike, who first fixes everything that broke — and then starts fixing what he was never asked to: the wife's laptop, the kids' accounts, the home cameras. When the hero tries to end the contract, it turns out a person with access to your digital life knows it better than you do. A thriller about a new kind of vulnerability: not a hack from outside, but service from inside, rendered a little too well."}, "genres": ["thriller", "drama"], "year": 2016, "imdbId": "tt2679552", "imdbRating": 5.5, "kpId": 738189, "kpRating": 5.4, "kpVotes": 16056, "poster": "static/posters/it2016_film_poster.webp"}, {"type": "movie", "titleEn": "Listening", "titleRu": "Читающий мысли", "desc": {"ru": "Трое неудачников собирают в гараже устройство для чтения мыслей — и почти сразу же обнаруживают, что эта способность имеет свою цену: мысли соседа, девушки или инвестора превращаются в файлы, которые можно открыть и просмотреть. Когда к проекту подключаются корпоративные инвесторы, технологию начинают использовать в целях, о которых ее создатели предпочли бы не думать. Это независимый научно-фантастический фильм о неприкосновенности внутреннего мира — последней территории, до которой еще не добрались цифровые платформы.", "en": "Three losers build a mind-reading device in a garage — and almost instantly discover not just power but a price: every thought of a neighbor, a girlfriend, an investor becomes a file you can open. When corporate investors join the project, the technology is pulled in directions its creators would rather not think about. An independent sci-fi about the privacy of one's own mind — the last territory the platforms have yet to reach."}, "genres": ["thriller", "drama"], "year": 2014, "imdbId": "tt3153582", "imdbRating": 5.6, "kpId": 794783, "kpRating": 5.1, "kpVotes": 353, "poster": "static/posters/listening_film_poster.webp"}, {"type": "movie", "titleEn": "Primer", "titleRu": "Детонатор", "desc": {"ru": "Четверо инженеров-самоучек создают устройства для подавления гравитации и случайно собирают машину времени — правда, позволяющую переместиться лишь на шесть часов назад. Аарон и Эйб начинают использовать её ради выгоды: играют на бирже, заранее узнают ход разговоров и моделируют «идеальные дни». Однако каждое перемещение создает дубликат человека, и чем больше временных петель они запускают, тем сложнее понять, кто из вас — настоящий, а кто — лишь копия. Это самый честный фильм о путешествиях во времени, снятый инженерами: здесь нет спецэффектов, зато безупречно работает логика парадоксов.", "en": "Four garage engineers build gravity-dampening devices and accidentally assemble a time machine — six hours back, no more. Aaron and Abe start using it for profit: playing the market, pre-empting conversations, engineering 'perfect days'. But every run duplicates a person, and the more loops they open, the harder it is to tell which of you is the live one and which is the recording. The most honest film about time ever made by engineers: no special effects, but a genuinely working logic of paradoxes."}, "genres": ["drama", "thriller"], "year": 2004, "imdbId": "tt0390384", "imdbRating": 6.7, "kpId": 63971, "kpRating": 6.0, "kpVotes": 12512, "poster": "static/posters/primer_film_poster.webp"}], "posterW": 402, "posterH": 600};</script>
