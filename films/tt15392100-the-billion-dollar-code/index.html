            <p class="meta-row">Сериал · 2021 · Биография, Драма</p>
            <p class="film-desc">Берлин 90-х: два идеалиста строят Terravision — систему, которая визуализирует Землю по спутниковым данным за секунды, за годы до Google Earth. Когда Google выпускает свой продукт, начинается суд на сотни миллионов долларов — и вопрос, кто здесь изобретатель, а кто реализовал раньше. Мини-сериал о немецкой мечте стартапа, патентном праве и о том, что «технология принадлежит тому, у кого больше юристов и серверов».</p>
            <p class="film-desc film-desc-alt">Berlin in the 90s: two idealists build Terravision — a system that renders the Earth from satellite data in seconds, years before Google Earth. When Google ships its product, a hundred-million-dollar lawsuit begins — and the question of who really invented it and who simply shipped first. A miniseries about the German startup dream, patent law, and the rule that technology belongs to whoever has more lawyers and servers.</p>
