            <p class="film-desc">Художественная реконструкция реальной истории охоты на Кевина Митника — самого известного американского хакера конца 90-х, обладавшего уникальным даром: он умел убеждать людей добровольно выдавать свои пароли. Цутому Шимомура, японский исследователь, в чьи системы проник Митник, начинает собственную охоту на взломщика; в этом противостоянии двое противников становятся словно зеркальным отражением друг друга. Это фильм о закате эпохи, когда хакерство было культурой и ремеслом, а не индустрией, и о первом масштабном киберпротивостоянии государства и хакера-одиночки.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A dramatization of the real manhunt for Kevin Mitnick, America&#x27;s most famous hacker of the late 90s, who could do what the agencies could not: talk people into handing over their passwords. Tsutomu Shimomura, the Japanese researcher whose systems Mitnick broke into, launches his own hunt, and the two become mirrors of each other. A film about the twilight of an era when hacking was a culture and a craft rather than an industry — and about the first big cyber showdown between the state and a lone intruder.</p>
            </details>
