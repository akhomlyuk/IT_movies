ль: Хаус", "desc": {"ru": "Испанский хоррор о молодом хакере, для которого взлом систем — способ самоутвердиться. Очередная авантюра приводит его в странный дом, где виртуальная игра перестает быть игрой: опасность становится реальной, а правила начинает диктовать кто-то другой. Фильм обыгрывает иллюзию, знакомую каждому представителю «интернет-поколения» — убежденность в том, что по ту сторону экрана ничто не является «настоящим», — и задается вопросом: где именно заканчивается игра и начинается жизнь?", "en": "A Spanish horror about a young hacker for whom breaking into systems is a way to prove himself. One more stunt leads him to a strange house where the virtual game stops being a game: the danger turns physical and someone else is setting the rules. The film plays with the illusion familiar to every online generation — that behind the screen nothing is 'real' — and asks where exactly the game ends and life begins."}, "genres": ["scifi", "horror"], "year": 2018, "imdbId": "tt9055630", "imdbRating": 5.5, "kpId": 1212316, "kpRating": 6.1}, {"type": "movie", "titleEn": "The Creator", "titleRu": "Создатель", "desc": {"ru": "Постапокалиптическое будущее: после ядерного взрыва в Лос-Анджелесе Запад объявляет войну искусственному интеллекту. Бывший спецагент, потерявший жену, проникает на территорию машин, чтобы найти создателя их нового оружия, — и встречает ребенка, неотличимого от человека, которого машины создали для себя. Визуально впечатляющая научно-фантастическая лента о страхе перед ИИ, пропаганде и вопросе о том, кто на самом деле породил это «чудовище».", "en": "A post-apocalyptic future: after a nuclear blast in Los Angeles the West declares war on artificial intelligence. An ex-agent who lost his wife infiltrates the machines' territory to find the designer of their new weapon — and meets a child, indistinguishable from a human, that the machines built for themselves. Visually lush sci-fi about the fear of AI, propaganda and the question of who really created the 'monster'."}, "genres": ["ai", "scifi"], "year": 2023, "imdbId": "tt11858890", "imdbRating": 6.7, "kpId": 4499408, "kpRating": 6.7}], "posterW": null, "posterH": null};</script>
