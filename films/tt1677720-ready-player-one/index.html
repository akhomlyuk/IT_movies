            <p class="film-desc">2045 год: реальный мир тесен и опасен, а настоящая жизнь кипит в OASIS — виртуальной вселенной, где каждый может стать кем угодно. Основатель платформы скончался, оставив после себя загадку: «пасхалку» из трех ключей, дающую контроль над всей системой. Уэйд Уоттс, гик из трущоб, знающий историю видеоигр лучше профессиональных историков, вступает в противостояние с корпорацией, стремящейся превратить этот рай в источник прибыли. Спилберг о культуре 80-х и виртуальной реальности: фильм-аттракцион о симуляции и о том, почему вообще кому-то может захотеться из нее выйти.</p>
            <p class="film-desc film-desc-alt">2045: reality is cramped and unsafe, and life happens in the OASIS — a virtual universe where anyone can be anything. The platform&#x27;s founder has died, leaving a riddle: a three-key Easter egg that grants control of the entire system. Wade Watts, a trailer-park geek who knows gaming history better than historians, is up against a corporation that wants to monetize paradise. Spielberg on 80s culture and VR: a theme-park film about simulation and why anyone would ever log off.</p>
