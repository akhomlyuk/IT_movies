ugs. A light film about an AI fairy tale written long before AI existed — and about the fact that even a genie needs proper debugging."}, "genres": ["comedy", "adventure"], "year": 2006, "imdbId": "tt0466043", "imdbRating": 6.2, "kpId": 161085, "kpRating": 6.4, "poster": "static/posters/khottabych_film_poster.webp"}, {"type": "movie", "titleEn": "Kung Fury", "titleRu": "Кунг Фьюри", "desc": {"ru": "Майами, 1985 год: полицейский-мастер кунг-фу Кунг Фьюри сражается с Кунг Фюрером, который взломал время, прибыв из будущего. Машина времени собрана из корпусов игровых автоматов, среди напарников героя — трицератопс и Тор, а викинги с бензопилами занимаются самым настоящим «взломом». Это получасовой шедевр с Kickstarter, стилизованный под эпоху VHS и вобравший в себя всё, что любили в 80-х: компьютеры, игровые автоматы, неон и абсурд. Идеальный короткометражный фильм, позволяющий понять, как люди представляли себе компьютеры и кунг-фу задолго до появления умных часов.", "en": "Miami, 1985: kung-fu cop Kung Fury fights Kung Führer, who has hacked time from the future. The time machine is assembled from arcade cabinets, sidekicks include a triceratops and Thor, and Vikings with chainsaws do literal hacking. A half-hour Kickstarter masterpiece styled after the VHS era, packing in everything the 80s loved: computers, arcades, neon and absurdity. Perfect short viewing to grasp how the world imagined computers and kung-fu long before smartwatches."}, "genres": ["action", "comedy"], "year": 2015, "imdbId": "tt3472226", "imdbRating": 7.9, "kpId": 824954, "kpRating": 7.9}, {"type": "series", "titleEn": "Mythic Quest", "titleRu": "Мистический квест", "desc": {"ru": "Ситком о студии, разрабатывающей крупнейшую MMORPG: эксцентричный создатель-геймплея, продюсер, который реально всё держит, тестировщики в подвале и монетизация, которая ломает геймплей. Редко кто снимал «геймдев» изнутри: релизы, обновления, конфликт творчества и метрик, вечное «мы поправим в следующем патче». Отдельно хороша серия-притча о карантине — снятая удалённо и получившая награды.", "en": "A sitcom about a studio building the biggest MMORPG: an eccentric creator, a producer who actually holds everything together, testers in the basement, and monetization that breaks gameplay. Rarely has game dev been filmed from inside: releases, patches, the conflict of creativity and metrics, and the eternal 'we will fix it in the next update'. The quarantine episode — shot remotely and award-winning — is a special highlight."}, "genres": ["comedy"], "year": 2020, "imdbId": "tt8879940", "imdbRating": 7.6, "kpId": 1188292, "kpRating": 7.2}, {"type": "series", "titleEn": "Koroche, plan takoy", "titleRu": "Короче, план такой", "desc": {"ru": "Российский комедийный сериал о стартапе, занимающемся «подписочными сервисами», и его основателях, которые изобретают продукт, гонятся за инвесторами и постоянно «пересматривают план». Сценарий написан людьми, которые знают эту «кухню» изнутри: презентации, метрики, отеческий тон инвесторов, бесконечные переработки и коллективное самообман. Юмор здесь острый, а ситуации — до боли узнаваемые. Короткие серии идеально подходят для вечера после рабочего дня в IT.", "en": "A Russian comedy series about a 'subscription services' startup and its founders inventing a product, chasing investors and constantly 'revising the plan'. Written by people who have seen this world: pitching, metrics, investor paternalism, endless overtime and collective self-deception. The humor is edgy, the recognition is total. Short episodes, perfect for an evening after a day in IT."}, "genres": ["comedy"], "year": 2023, "imdbId": "tt26656021", "imdbRating": 7.3, "kpId": 5134511, "kpRating": 7.9}], "posterW": null, "posterH": null};</script>
