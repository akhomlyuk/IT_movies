            <p class="film-desc">Британский ситком о подвальном IT-отделе: Мосс и Рой — технические гении, беспомощные вне серверной, а их начальница Джен в компьютерах не разбирается вовсе, зато приносит в отдел офисный поп-лоск. Культовая сатира на корпоративные будни с идеальным балансом абсурда: от «вы уже пробовали выключить и включить?» до эскалации уровня «Рейнхольм Индастрис». Одна из самых цитируемых комедий о жизни в айти.</p>
            <p class="film-desc film-desc-alt">A British sitcom about a basement IT department: Moss and Roy are technical geniuses, helpless outside the server room, while their manager Jen knows nothing about computers — but brings office pop-gloss to the division. A cult satire of corporate routine with a perfect balance of absurdity: from &#x27;have you tried turning it off and on again&#x27; to Reynholm Industries levels of escalation. One of the most quoted comedies about working in IT.</p>
