            <p class="film-desc">Адвокату Роберту Дину случайно попадает в руки диск с записью убийства конгрессмена — и в одночасье его жизнь превращается в подобие лабораторного эксперимента: счета заморожены, жена ушла, квартира «зачищена», а системы слежения АНБ отслеживают каждый его шаг в режиме реального времени. Единственный, кто говорит на языке врага, — это параноик и бывший спецагент, ведущий свою игру на той же территории. Это триллер, который в 1998 году казался плодом паранойи, а сегодня читается как руководство по устройству государства тотальной слежки.</p>
            <p class="film-desc film-desc-alt">Lawyer Robert Dean is accidentally slipped a disc with footage of a congressman&#x27;s murder — and overnight his life becomes a lab experiment: accounts frozen, wife gone, apartment sanitized, while NSA surveillance systems track his every move in real time. The only one who speaks the enemy&#x27;s language is a paranoid ex-agent playing the same game on his home turf. A thriller that looked like paranoia in 1998 and today reads like a manual for the surveillance state.</p>
