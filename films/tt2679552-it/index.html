            <h1 class="film-title">Искусственный интеллект. Доступ неограничен</h1>
            <p class="film-alt">I.T.</p>
            <div class="film-meta">
              <span class="film-meta-item">2016</span>
              <span class="film-meta-item">Драма, Триллер</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/738189/" target="_blank" rel="noopener noreferrer">Кинопоиск: 5.4</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt2679552/" target="_blank" rel="noopener noreferrer">IMDb: 5.5</a>
        </div>
            <p class="film-desc">Успешный издатель нанимает ИТ-консультанта Майка. Тот сначала чинит всё, что вышло из строя, а затем принимается исправлять то, о чем его не просили: ноутбук жены, детские аккаунты, домашние камеры видеонаблюдения. Когда герой пытается расторгнуть контракт, выясняется, что человек, имеющий доступ к вашей цифровой жизни, знает её лучше, чем вы сами. Это триллер о новом типе уязвимости: угроза исходит не от внешнего взлома, а от услуг, оказываемых изнутри — причем с чрезмерным усердием.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A successful publisher hires IT consultant Mike, who first fixes everything that broke — and then starts fixing what he was never asked to: the wife&#x27;s laptop, the kids&#x27; accounts, the home cameras. When the hero tries to end the contract, it turns out a person with access to your digital life knows it better than you do. A thriller about a new kind of vulnerability: not a hack from outside, but service from inside, rendered a little too well.</p>
            </details>
          </div>
