            <p class="film-desc">Портрет Павла Дурова: из создателя «ВКонтакте», который отказался передавать ФСБ данные украинских групп, — в основателя Telegram и «гражданина мира» без постоянного адреса. Документалка собирает свидетельства коллег и бывших партнёров и показывает цену избранного пути: потерянная компания, конфликты, паранойя безопасности. Это ни оправдание, ни разоблачение — попытка понять, как идеология приватности становится чертой характера.</p>
            <p class="film-desc film-desc-alt">A portrait of Pavel Durov: from the creator of VK, who refused to hand user data on Ukrainian groups to the security services, to the founder of Telegram and a &#x27;world citizen&#x27; with no fixed address. The documentary assembles testimony from colleagues and former partners and shows the price of the chosen path: a lost company, conflicts, security paranoia. Neither an apology nor an exposé — an attempt to understand how an ideology of privacy becomes a character.</p>
