            <p class="film-desc">Портрет Павла Дурова: из создателя «ВКонтакте», который отказался передавать ФСБ данные украинских групп, — в основателя Telegram и «гражданина мира» без постоянного адреса. Документалка собирает свидетельства коллег и бывших партнёров и показывает цену избранного пути: потерянная компания, конфликты, паранойя безопасности. Это ни оправдание, ни разоблачение — попытка понять, как идеология приватности становится чертой характера.</p>

  <script>window.FILM_PAGE = {"item": {"type": "documentary", "titleEn": "Durov", "titleRu": "Дуров", "desc": {"ru": "Портрет Павла Дурова: из создателя «ВКонтакте», который отказался передавать ФСБ данные украинских групп, — в основателя Telegram и «гражданина мира» без постоянного адреса. Документалка собирает свидетельства коллег и бывших партнёров и показывает цену избранного пути: потерянная компания, конфликты, паранойя безопасности. Это ни оправдание, ни разоблачение — попытка понять, как идеология приватности становится чертой характера.", "en": "A portrait of Pavel Durov: from the creator of VK, who refused to hand user data on Ukrainian groups to the security services, to the founder of Telegram and a 'world citizen' with no fixed address. The documentary assembles testimony from colleagues and former partners and shows the price of the chosen path: a lost company, conflicts, security paranoia. Neither an apology nor an exposé — an attempt to understand how an ideology of privacy becomes a character."}, "genres": ["biography"], "year": 2021, "imdbId": "tt14404802", "imdbRating": 6.4, "kpId": 4418516, "kpRating": 6.3, "kpVotes": 3387, "poster": "static/posters/durov_doc_poster.webp"}, "related": [{"type": "movie", "titleEn": "The Social Network", "titleRu": "Социальная сеть", "desc": {"ru": "Осень 2003 года: девятнадцатилетний Марк Цукерберг создает сайт для оценки внешности сокурсниц — спустя полгода проект получает название Facebook и стремительно захватывает студенческие кампусы по всей стране. Финчер рассказывает историю не столько о технологиях, сколько о людях: о разрушенной дружбе, искренней вере в свой продукт и о том, что в стартапах, как и в тронных залах, победителей оценивают не только по качеству программного кода. Сценарий Соркина, в котором переговоры о доле в компании напоминают дуэли, обязателен к ознакомлению для всех, кто говорит: «У меня есть идея для стартапа».", "en": "Fall 2003: nineteen-year-old Mark Zuckerberg writes a site for rating classmates — within six months it is called Facebook and is wrecking campuses across the country. Fincher tells a story not about technology but about people: a friendship broken, genuine belief in the product, and the fact that in startups, as in throne rooms, winners are judged by more than code. Sorkin's screenplay, where equity negotiations sound like duels, is required viewing for anyone saying 'I have a startup idea'."}, "genres": ["drama", "biography"], "year": 2010, "imdbId": "tt1285016", "imdbRating": 7.8, "kpId": 427198, "kpRating": 7.7, "kpVotes": 395838, "fav": true, "poster": "static/posters/socialnetwork_film_poster.webp"}, {"type": "movie", "titleEn": "Underground: The Julian Assange Story", "titleRu": "История Джулиана Ассанжа", "desc": {"ru": "Мельбурн, конец 80-х: подросток Джулиан Ассанж — сын родителей, порвавших с театральной средой, — исследует компьютерные сети в составе хакерской группы International Subversives задолго до того, как интернет стал массовым явлением. Это история взросления, в которой юношеский азарт перерастает в идеологию: любопытство сменяется одержимостью идеей прозрачности, а та, в свою очередь, формирует личность человека, изменившего правила игры для целых государств. Телефильм снят по мотивам книги Сьюлетт Дрейфус задолго до того, как разразился самый громкий скандал вокруг WikiLeaks.", "en": "Melbourne, late 80s: teenager Julian Assange, son of theater-scene runaways, explores networks with the International Subversives hacking group long before networks went public. A coming-of-age story that turns from teenage thrill into ideology — how curiosity grew into an obsession with transparency, and obsession into the man who changed the rules for nation-states. A TV film based on Suelette Dreyfus's book, made long before WikiLeaks's biggest scandal."}, "genres": ["drama", "biography"], "year": 2012, "imdbId": "tt2357453", "imdbRating": 6.9, "kpId": 677421, "kpRating": 6.9, "kpVotes": 526, "poster": "static/posters/undergroundthejulianassangestory_film_poster.webp"}, {"type": "documentary", "titleEn": "The Inventor: Out for Blood in Silicon Valley", "titleRu": "Изобретатель: Жажда крови в Силиконовой долине", "desc": {"ru": "Элизабет Холмс обещала революцию: всего одна капля крови вместо десятков анализов и компания Theranos стоимостью девять миллиардов долларов. Алекс Гибни реконструирует историю краха, опираясь на интервью, записи совещаний и свидетельства сотрудников: он показывает, как вера в миссию заглушала сомнения, как обложки журналов подменяли собой клинические испытания и как пациенты становились жертвами обмана. Это лучший документальный фильм о мифологии стартапов — обязательный к просмотру для всех, кто верит громким обещаниям, звучащим со сцены.", "en": "Elizabeth Holmes promised a revolution: one drop of blood instead of dozens of tests, a company called Theranos worth nine billion dollars. Alex Gibney assembles the fall through interviews, boardroom tapes and employee testimony: how belief in the mission suppressed doubt, how magazine covers replaced clinical trials, how patients became the victims. The best documentary about startup mythology — required viewing for anyone who believes loud promises on stage."}, "genres": ["documentary", "biography"], "year": 2019, "imdbId": "tt8488126", "imdbRating": 7.2, "kpId": 1160654, "kpRating": 7.2, "kpVotes": 8349, "poster": "static/posters/theinventor_doc_poster.webp"}, {"type": "documentary", "titleEn": "Citizenfour", "titleRu": "Citizenfour: Правда Сноудена", "desc": {"ru": "В июне 2013 года в номере гонконгского отеля Лора Пойтрас снимает первые встречи с анонимным источником, выступающим под псевдонимом «Citizenfour» (Гражданин четыре), — Эдвардом Сноуденом, обладателем архивов, раскрывающих масштабы тотальной слежки АНБ. Мы наблюдаем за происходящим в режиме реального времени: принятие решения предать информацию огласке, звонок адвокату, появление первых заголовков в прессе и осознание того, что пути назад уже нет. Фильм, удостоенный премии «Оскар» за лучший документальный фильм, — редкий пример того, как камера оказывается не просто рядом с событиями, а в самом центре их развития.", "en": "In June 2013, in a Hong Kong hotel room, Laura Poitras films the first meetings with an anonymous source signed 'Citizenfour': Edward Snowden, carrying archives about the NSA's total surveillance. We watch it happen in real time: the decision to go public, the call to a lawyer, the first headlines, and the growing understanding that there is no way back. The Oscar winner for Best Documentary — and a rare case of a camera being not next to the story but inside its unfolding."}, "genres": ["biography"], "year": 2014, "imdbId": "tt4044364", "imdbRating": 8.0, "kpId": 843103, "kpRating": 7.3, "kpVotes": 11101, "fav": true, "poster": "static/posters/citizenfour_doc_poster.webp"}, {"type": "series", "titleEn": "The Billion Dollar Code", "titleRu": "Код на миллиард долларов", "desc": {"ru": "Берлин 90-х: два идеалиста строят Terravision — систему, которая визуализирует Землю по спутниковым данным за секунды, за годы до Google Earth. Когда Google выпускает свой продукт, начинается суд на сотни миллионов долларов — и вопрос, кто здесь изобретатель, а кто реализовал раньше. Мини-сериал о немецкой мечте стартапа, патентном праве и о том, что «технология принадлежит тому, у кого больше юристов и серверов».", "en": "Berlin in the 90s: two idealists build Terravision — a system that renders the Earth from satellite data in seconds, years before Google Earth. When Google ships its product, a hundred-million-dollar lawsuit begins — and the question of who really invented it and who simply shipped first. A miniseries about the German startup dream, patent law, and the rule that technology belongs to whoever has more lawyers and servers."}, "genres": ["drama", "biography"], "year": 2021, "imdbId": "tt15392100", "imdbRating": 7.9, "kpId": 4630370, "kpRating": 7.6, "kpVotes": 2818, "poster": "static/posters/thebilliondollarcode_series_poster.webp"}], "posterW": 423, "posterH": 600};</script>
