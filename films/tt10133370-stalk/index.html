            <p class="film-desc">Французский триллер о 18-летнем Лукасе, который поступает в лучший инженерный вуз мира, но постоянно подвергается унижениям со стороны популярных студентов. Решив отомстить, герой — называющий себя в сети Люкс — взламывает телефоны и компьютеры окружающих, включая девушку, в которую он влюблен, — Альму. Он быстро превращается в того, кем всегда мечтал стать, и тут же попадает в ловушку, которую сам же для себя и создал.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A French thriller about 18-year-old Lucas, who gets into the best engineering school in the world but is constantly humiliated by the popular students. Deciding on revenge, the hero — Luxe, as he calls himself online — hacks the phones and computers of the people around him, including Alma, the girl he loves. He quickly becomes the person he always dreamed of being, and steps straight into a trap of his own making.</p>
            </details>
          </div>
