            <p class="film-desc">Финский документальный фильм о Линусе Торвальдсе и истории Linux, созданный к десятилетию ядра. Интервью с Торвальдсом, Ричардом Столлманом, Эриком Рэймондом и представителями руководства HP и IBM позволяют проследить весь путь: от сообщения в списке рассылки до серверов, благодаря которым Linux обосновался в дата-центрах по всему миру. Это простой и хорошо структурированный рассказ для тех, кто хочет понять философию открытого программного обеспечения через призму его самого известного продукта.</p>
            <p class="film-desc film-desc-alt">A Finnish documentary about Linus Torvalds and the history of Linux, made for the kernel&#x27;s tenth anniversary. Interviews with Torvalds, Richard Stallman, Eric Raymond and HP/IBM managers trace the whole path: from a mailing-list post to the servers that put Linux into data centers worldwide. A simple, well-structured story for those who want to understand open source philosophy through its best-known product.</p>
