        <div class="ratings">

            <p class="film-desc">Двухсерийный документальный фильм Алекса Гибни о том, как осуществлялись российские операции влияния во время выборов в США 2016 года: от «фабрик троллей» до утечек через WikiLeaks. Гибни рассматривает эту историю не просто как «хакерскую атаку», а как механизм: как дезинформация находит уязвимости в самом обществе и почему проверка фактов не служит от нее лекарством. Спокойный и детальный разбор одной из самых обсуждаемых кампаний по оказанию влияния — без паники и без отрицания фактов.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Alex Gibney&#x27;s two-part documentary on how Russian influence operations worked during the 2016 US elections: from troll farms to leaks via WikiLeaks. Gibney frames the story not as &#x27;hacking&#x27; but as a mechanism: how disinformation finds vulnerabilities in society itself and why fact-checking does not cure it. A calm, detailed anatomy of one of the most discussed influence campaigns — without panic and without denial.</p>
            </details>
          </div>
