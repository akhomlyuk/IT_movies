webp"}, {"type": "documentary", "titleEn": "Deep Web", "titleRu": "Глубокая паутина", "desc": {"ru": "Документальный фильм о судебном процессе над Россом Ульбрихтом, основателем Silk Road — даркнет-маркетплейса, где за биткоины торговали всем: от марихуаны до оружия. Картина поднимает непростые вопросы: что означает «свободный рынок» в эпоху криптовалют, насколько справедлив суд, когда государству нужен показательный процесс, и где заканчивается идеология свободы и начинается коммерция. История показана глазами стороны защиты и прокурора, а закадровый текст читает Киану Ривз.", "en": "A documentary about the trial of Ross Ulbricht, founder of Silk Road — the bitcoin darknet market where everything from weed to weapons was traded. It raises uncomfortable questions: what a 'free market' means in the age of crypto, how fair a trial is when the state wants a showcase, and where the ideology of freedom ends and trading begins. Told through the lens of the defense and the figure of the prosecutor; narrated by Keanu Reeves."}, "genres": ["documentary"], "year": 2015, "imdbId": "tt3312868", "imdbRating": 6.9, "kpId": 808328, "kpRating": 6.9}, {"type": "documentary", "titleEn": "DSKNECTD", "titleRu": "Технологии, которые нас меняют", "desc": {"ru": "Эксперимент: несколько семей соглашаются полностью отказаться от интернета на две недели. Первые дни приносят раздражительность, затем следуют неожиданные разговоры за ужином и переосмысление того, что в телефоне было полезным инструментом, а что — способом спрятаться от реальности. Параллельно авторы фильма беседуют с нейробиологами и психологами о механизмах зависимости от лайков и уведомлений. Это простое и честное кино о грани между тем, чтобы оставаться на связи, и жизнью внутри чужой ленты новостей.", "en": "An experiment: several families agree to go fully offline for two weeks. The first days bring irritability, then unexpected dinner conversations, then a reassessment of what in the phone was a tool and what was a hiding place. Alongside, the film talks to neuroscientists and psychologists about the mechanics of dependence on likes and notifications. A simple, honest film about the border between 'being connected' and 'living inside someone else's feed'."}, "genres": ["documentary"], "year": 2013, "imdbId": "tt2417174", "imdbRating": 6.8, "kpId": 756003, "kpRating": 6.7}], "posterW": null, "posterH": null};</script>
