            <h1 class="film-title">Тайные правила современной жизни: Алгоритмы</h1>
            <p class="film-alt-title">The Secret Rules of Modern Living: Algorithms</p>
            <p class="film-desc">Профессор Дэвид Шпигельхалтер объясняет, что такое алгоритм и почему он определяет гораздо больше, чем нам кажется: от приложений для знакомств и маршрутов курьерской доставки до списков ожидания на пересадку органов. Примеры варьируются от простейших задач сортировки до машинного обучения и иллюстрируются на историях реальных людей и ситуациях из повседневной жизни. Это один из самых доступных способов всего за час разобраться в базовых принципах работы цифрового мира — и всё это без единой формулы на доске.</p>
            <p class="film-desc film-desc-alt">Professor David Spiegelhalter explains what an algorithm is and why it decides more than we think: from matchmaking apps to the route your delivery drives and the transplant waiting list. Examples run from simple sorting tasks to machine learning, shown on real people and everyday situations. One of the most accessible ways to grasp the basic mechanics of the digital world in an hour, without a single formula on a board.</p>
