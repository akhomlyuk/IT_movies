            <p class="film-desc">В 2002 году компания Google начала оцифровку миллионов книг из крупнейших библиотек мира — не спрашивая на то разрешения. Проект «мирового мозга», о котором мечтал Герберт Уэллс, столкнулся с противодействием писателей и издателей в суде: кому принадлежит культурное наследие и допустима ли оцифровка без согласия правообладателей? Этот документальный фильм запечатлел момент, когда к идеалу всеобщего доступа впервые была применена корпоративная логика, — и поднятые тогда вопросы звучат и сегодня в любых дискуссиях об обучении искусственного интеллекта на чужих текстах.</p>
            <p class="film-desc film-desc-alt">In 2002 Google began digitizing millions of books from the world&#x27;s great libraries — without asking. The &#x27;world brain&#x27; project H.G. Wells dreamed of ran into writers and publishers in court: who owns the heritage, and can you digitize without consent? The documentary captures the moment corporate logic was first applied to the ideal of universal access — and the questions raised then echo today in every debate about training AI on other people&#x27;s texts.</p>

орация создает Ареса — совершенного искусственного солдата, перенесенного из цифрового мира в реальный. Задача проста: провести стресс-тестирование ИИ. Но чем дольше Арес существует среди людей, тем чаще он задается вопросами, не предусмотренными его исходным кодом: что такое предназначение, боль и свобода воли? Впечатляющий фильм о первом искусственном разуме, вышедшем за пределы симуляции, — и об этике тех, кто сделал это возможным.", "en": "A sequel to Tron: a corporation builds Ares, a perfect artificial soldier pulled out of the digital world into the real one. The task is simple: stress-test the AI. But the longer Ares exists among people, the more he asks questions his source code never contained: what are purpose, pain and free will? A striking film about the first artificial mind stepping out of the simulation — and the ethics of those who made it possible."}, "genres": ["scifi", "drama"], "year": 2025, "imdbId": "tt6604188", "imdbRating": 6.1, "kpId": 634944, "kpRating": 6.2}, {"type": "movie", "titleEn": "Minority Report", "titleRu": "Особое мнение", "desc": {"ru": "Вашингтон, 2054 год: система «Особое мнение» (PreCrime), основанная на пророчествах трех «оракулов», предотвращает убийства еще до их совершения. Джон Эндертон, лучший сотрудник этого подразделения, сам становится подозреваемым: оракулы предсказывают, что он убьет человека, которого никогда не встречал. Бежать бессмысленно: его глаза сканируют в каждом магазине, реклама обращается к нему по имени, а механические пауки прочесывают здания. Фильм Стивена Спилберга по мотивам произведения Филипа К. Дика — история о предсказании будущего, неприкосновенности частной жизни и свободе воли.", "en": "Washington, 2054: the PreCrime system, built on prophecies of three 'oracles', stops murders before they happen. John Anderton, the unit's best officer, becomes a suspect himself: the oracles predict he will kill a man he has never met. Running is pointless — his eyes are scanned in every store, ads address
