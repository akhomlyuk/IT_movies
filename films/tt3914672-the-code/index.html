            <p class="film-desc">Австралийский конспирологический триллер о братьях Бэнкс: молодой интернет-журналист Нед и его брат Джесс, хакер на испытательном сроке, восстанавливают из цифровой пыли видео, которому полагалось исчезнуть навсегда. Дальше — цепочка: авария в пустыне, загадочная корпорация, замешанное правительство и правда, которую власти готовы защищать любым способом. Реалистичная история о том, как код, шифр и человеческое упрямство раскапывают то, что должно было остаться секретом.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">An Australian conspiracy thriller about the Banks brothers: young internet journalist Ned and his brother Jesse, a hacker on probation, pull out of digital dust a video that was supposed to disappear forever. Then a chain: a desert accident, a mysterious corporation, a government involved, and a truth the authorities are ready to protect by any means. A grounded story about how code, cipher and human stubbornness dig up what was meant to stay secret.</p>
            </details>
