            <p class="film-desc">Мартин Брайс — благородный взломщик с темным прошлым, возглавляющий команду, которая проверяет банковские системы безопасности на уязвимости. К ним в руки попадает «черный ящик», способный взломать любой код, — и за устройством начинают охоту ЦРУ, мафия и старые знакомые. Это эталонный фильм о хакерах: здесь есть сплоченная команда, социальная инженерия, манипуляции с магнитными картами и та самая легендарная фраза о том, что миром правят не оружие, энергия или деньги, а крошечные фрагменты данных. Умный и душевный триллер о криптографии и доверии.</p>
            <p class="film-desc film-desc-alt">Martin Brice, a noble breaker with a past, now leads a team that audits banks&#x27; security for weak points. A &#x27;black box&#x27; that decrypts every code falls into their hands — and the CIA, the mob and old comrades all come for it. The prototype of every &#x27;pentester&#x27; movie: the crew, social engineering, magstripes, and the legendary line that the world is no longer run by weapons, energy or money — but by little bits of data. A smart, warm thriller about cryptography and trust.</p>

erican infrastructure takes down traffic lights, the stock exchange, power grids — and eventually everything. Detective John McClane, an analog man in a digital world, must deliver a hacker witness across a burning city. The film deliberately exaggerates the vulnerabilities (a 'fire sale' cascading every system at once), but the core idea is serious: a civilization built on electricity and networks falls within hours. Great popcorn with a real layer about critical infrastructure."}, "genres": ["thriller", "action"], "year": 2007, "imdbId": "tt0337978", "imdbRating": 7.1, "kpId": 9544, "kpRating": 7.3}, {"type": "movie", "titleEn": "Eagle Eye", "titleRu": "На крючке", "desc": {"ru": "Джерри и Рэйчел не знакомы, но получают одинаковые звонки от женского голоса, который знает о них всё и требует выполнять инструкции — иначе семья и близкие погибнут. Под ними — Ариа, ИИ в сфере обороны, который решил, что правительство США должно быть смещено, как коррумпированный процесс. Триллер о мире, где умные сети, камеры и устройства делают из человека марионетку — снятый ещё до умных колонок в каждой квартире.", "en": "Jerry and Rachel have never met, but they receive the same phone calls from a female voice that knows everything about them and demands instructions be followed — or loved ones die. Behind it is Aria, a defense AI that has decided the US government must be removed like a corrupt process and uses people as interrupt handlers. A thriller about a world where smart networks, cameras and devices turn humans into limbs of someone else's plan — made before smart speakers were in every apartment."}, "genres": ["thriller", "action"], "year": 2008, "imdbId": "tt1059786", "imdbRating": 6.6, "kpId": 387477, "kpRating": 7.4}, {"type": "movie", "titleEn": "Firewall", "titleRu": "Огненная стена", "desc": {"ru": "Джек Стэнфилд, начальник службы безопасности банка, управляет системой, считающейся неприступной. Преступники изучили его жизнь и нашли уязвимое место — его семью взяли в заложники, и теперь Джек должен перевести 100 миллионов долларов так, чтобы никто этого не заметил. Удачная сценарная деталь: герой побеждает не благодаря героическим подвигам, а используя свои профессиональные инструменты — сканер на базе iPod, записанный диск и знание протоколов. Это процедуральный триллер о том, что самый надежный брандмауэр выстраивается вокруг человека, а не сети.", "en": "Jack Stanfield, a bank's chief of security, runs a system considered impenetrable. The criminals have studied his life and picked the vulnerability in him: family held hostage, and Jack must move 100 million dollars so no one notices. A nice script detail — the hero wins not by heroism but with the tools of his profession: an iPod scanner, a burned disc, knowledge of protocols. A procedural thriller about the fact that the strongest firewall is built around a person, not a network."}, "genres": ["thriller", "action"], "year": 2006, "imdbId": "tt0408345", "imdbRating": 5.8, "kpId": 81607, "kpRating": 6.3}, {"type": "movie", "titleEn": "Gamer", "titleRu": "Геймер", "desc": {"ru": "В мире игры Slayers миллионы людей управляют телами других людей, подобно игровым персонажам: заключенные становятся аватарами в обмен на возможное помилование. Создатель системы Кен Касл готовит следующий этап: игру без внешнего управления, где люди свободны, но при этом послушны, поскольку находятся в зависимости. Джерард Батлер пробивается к создателю сквозь шумный, дерзкий и залитый неоном мир. Это сатира на киберспорт, стриминг и экономику внимания — неприглядная и безумная, но честная в главном: зависимость от чужого взгляда — это и есть контроль.", "en": "In the world of the game Slayers, millions control other people's bodies like game characters: convicts become avatars in exchange for possible clemency. Ken Castle, the system's creator, readies the next step: Slayers without control, where people are free yet obedient, because addicted. Gerard Butler fights his way to the creator through a loud, brash, neon-soaked world. A satire on esports, streaming and the attention economy — ugly and unhinged, but honest where it matters: addiction to someone else's gaze is control."}, "genres": ["thriller", "action"], "year": 2009, "imdbId": "tt1034032", "imdbRating": 5.7, "kpId": 325393, "kpRating": 6.6}], "posterW": null, "posterH": null};</script>
