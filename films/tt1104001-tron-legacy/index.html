            <h1 class="film-title">Трон: Наследие</h1>
            <p class="film-alt">Tron: Legacy</p>
            <div class="film-meta">
              <span class="film-meta-item">2010</span>
              <span class="film-meta-item">Приключения, Фантастика</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/399959/" target="_blank" rel="noopener noreferrer">Кинопоиск: 6.9</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt1104001/" target="_blank" rel="noopener noreferrer">IMDb: 6.8</a>
        </div>
            <p class="film-desc">Двадцать лет спустя: Сэм, сын Флинна, получает сигнал от того самого игрового автомата и попадает в «Сетку» — виртуальный мир, где когда-то исчез его отец. Вместо отца он встречает его цифровую копию — Клу, который довел систему до совершенства через тотальную унификацию, а также сталкивается с изгнанными программами и гладиаторскими боями, выросшими из гонок на арене. Визуально это самый красивый фильм о компьютерном мире: неоновая архитектура в эстетике Daft Punk и вопрос о том, что делает систему идеальной — порядок или свобода.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Twenty years on: Flynn&#x27;s son Sam gets a signal from the same arcade machine and goes into the Grid where his father vanished. Instead of his father he finds his digital copy, Clu, who has perfected the system through total uniformity — plus exiled programs and arena races turned gladiator games. Visually the most beautiful film about a computer world: Daft Punk-era neon architecture and the question of what makes a system perfect — order or freedom.</p>
            </details>
          </div>
