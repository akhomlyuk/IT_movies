            <p class="film-desc">Канадский веб-сериал о «Сцене» (the Scene) — закрытом мире пиратских релиз-групп, где статус определяется рейтингом, а преждевременная утечка контента равносильна войне. Сюжет строится вокруг конфликта двух группировок и лидера, который хочет выйти из игры, не расплатившись с долгами. Несмотря на скромный бюджет, сериал обладает уникальной достоверностью: он ближе всего к истине о системе, которую правообладатели называют «пиратством», а сами участники — работой.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A Canadian web series about &#x27;the Scene&#x27; — the closed world of piracy release groups, where rating defines status and an early leak equals war. The plot follows a conflict between two groups and one leader who wants out without repaying his debts. Low budget, but unique texture: closer than anything else to the truth about the system copyright holders call &#x27;piracy&#x27; and its participants call work.</p>
            </details>
