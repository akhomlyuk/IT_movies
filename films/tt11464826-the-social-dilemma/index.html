            <p class="meta-row">Документальный · 2020 · Документальный</p>
            <p class="film-desc">Бывшие дизайнеры и руководители из Google, Facebook и Twitter раскрывают механизмы, удерживающие нас в ленте: системы рекомендаций, бесконечную прокрутку, персонализацию и бизнес-модель, превращающую внимание в товар. Игровые вставки с персонажем, олицетворяющим «алгоритм в деловом костюме», вызывают вопросы, но главная мысль фильма точна: проблема не в том, что технологии плохи, а в том, что их цели не совпадают с нашими. Это фильм, после которого хочется заглянуть в настройки конфиденциальности.</p>
            <p class="film-desc film-desc-alt">Former designers and executives from Google, Facebook and Twitter explain the mechanisms that keep us in the feed: recommendations, infinite scroll, personalization, and the business model of attention as a commodity. The dramatized inserts with an &#x27;algorithm in a suit&#x27; are debatable, but the core point is precise: the problem is not that the technology is bad, but that its goals do not align with ours. The film that makes you want to open your privacy settings.</p>
