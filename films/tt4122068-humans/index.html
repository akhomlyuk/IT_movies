            <p class="film-desc">В мире, где синты — человекоподобные слуги — стали обычными бытовыми приборами, одна семья приобретает такого робота и обнаруживает, что их экземпляр отличается от остальных. Сериал превращает тему домашнего искусственного интеллекта в серьезные вопросы: может ли машина чувствовать боль, что мы должны существам, созданным нам служить, и кто здесь неандерталец, а кто — сапиенс? Это ремейк шведского сериала «Настоящие люди», снятый с британской сдержанностью и проникнутый подлинным гуманизмом.</p>
            <p class="film-desc film-desc-alt">In a world where synths — humanoid servants — are household appliances, a family buys one and finds their model is not quite like the others. The series turns &#x27;domestic&#x27; AI into real questions: can a machine feel pain, what do we owe beings we built to serve us, and who here is the Neanderthal and who the sapiens. A remake of the Swedish Real Humans, made with British restraint and genuinely humane.</p>

t can be rewritten. A sequel that set the standard — and perhaps the most elegant argument that artificial intelligence can be not only feared, but steered in another direction."}, "genres": ["scifi", "ai"], "year": 1991, "imdbId": "tt0103064", "imdbRating": 8.6, "kpId": 444, "kpRating": 8.4, "kpVotes": 789007, "fav": true, "poster": "static/posters/terminator2_film_poster.webp"}, {"type": "movie", "titleEn": "The Terminator", "titleRu": "Терминатор", "desc": {"ru": "Из 2029 года в Лос-Анджелес 1984-го прибывает Т-800: его цель — Сара Коннор, будущая мать лидера человеческого сопротивления. Следом за ним появляется Кайл Риз — солдат из того же будущего, влюбленный в фотографию женщины, которую ему предстоит спасти. Этот камерный хоррор-триллер с бюджетом в 6 миллионов долларов породил миф о «Скайнете» — военном искусственном интеллекте, который «заснул» как система обороны, а «проснулся» как палач. Кэмерон доказал, что одной лишь идеи — «машина не устает» — достаточно, чтобы люди на протяжении сорока лет боялись систем, лишенных ручного управления.", "en": "From 2029 to Los Angeles 1984 comes the T-800: its target is Sarah Connor, the future mother of humanity's resistance leader. Kyle Reese follows — a soldier from the same future, in love with a photograph of the woman he is meant to save. A chamber horror-thriller made for 6 million that created the myth of Skynet — a military AI that fell asleep as a defense network and woke up as an executioner. Cameron proved one idea — 'a machine does not tire' — is enough to make people fear switchless systems for forty years."}, "genres": ["scifi", "ai"], "year": 1984, "imdbId": "tt0088247", "imdbRating": 8.1, "kpId": 507, "kpRating": 8.0, "kpVotes": 385893, "fav": true, "poster": "static/posters/terminator_film_poster.webp"}], "posterW": 405, "posterH": 600};</script>
