            <p class="film-desc">Алекс, иммигрант из Косово, живущий в Нью-Йорке у дяди, — настоящий компьютерный гений. После семейной трагедии ему срочно нужны деньги, и его путь на кривую дорожку начинается с малого: фишинга, взлома систем и погружения в даркнет. Мелкие аферы перерастают в серьезный бизнес, а анонимность в сети становится зависимостью, от которой невозможно отказаться. Это криминальная драма о двух сторонах цифровой эпохи — безграничных возможностях и безнаказанности, — и о том, как она ломает человека, уверенного, что его никогда не найдут.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Alex, an immigrant from Kosovo living with his uncle in New York, is brilliant with computers. After a family tragedy he needs money, and the way down starts small: phishing, bypassing systems, the darknet. Petty schemes grow into a business, and online anonymity becomes an addiction he cannot quit. A crime drama about the double edge of the digital era — infinite possibility and impunity — and how it breaks a person who believed no one would ever find him.</p>
            </details>
