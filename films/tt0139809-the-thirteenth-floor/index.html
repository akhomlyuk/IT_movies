            <p class="film-desc">Лос-Анджелес, 1999 год: инженер Хэннон Фуллер создает симуляцию Лос-Анджелеса 1937 года, воссоздавая каждого прохожего, и оставляет записку своему коллеге Дугласу Холлу, которую тот так и не дочитывает. Обнаружив его мертвым, Холл входит в симуляцию и постепенно понимает: вопрос не в том, кто убил Фуллера, а в том, где заканчивается смоделированное и начинается «реальное». Философская научная фантастика, основанная на романе Дэниела Галуйе.</p>
            <p class="film-desc film-desc-alt">Los Angeles, 1999: engineer Hannon Fuller builds a simulation of 1937 Los Angeles down to the last passerby and leaves a note for colleague Douglas Hall that he never gets to read. Finding him dead, Hall enters the simulation and gradually understands: the question is not who killed Fuller but where the modeled ends and the &#x27;real&#x27; begins. Philosophical sci-fi based on Daniel Galouye&#x27;s novel.</p>
