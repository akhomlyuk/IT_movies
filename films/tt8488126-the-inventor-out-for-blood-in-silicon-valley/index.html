l."}, "genres": ["drama", "biography"], "year": 2012, "imdbId": "tt2357453", "imdbRating": 6.9, "kpId": 677421, "kpRating": 6.7, "poster": "static/posters/undergroundthejulianassangestory_film_poster.webp"}, {"type": "documentary", "titleEn": "The AI Doc: Or How I Became an Apocaloptimist", "titleRu": "Док об ИИ: Или как я стал апокалиптимистом", "desc": {"ru": "Режиссер Дэниел Роэр готовится стать отцом и решает разобраться, в каком мире предстоит расти его ребенку. В ходе серии откровенных бесед с ключевыми фигурами индустрии искусственного интеллекта он исследует эту сферу: от всеобщего воодушевления и революционных перемен в медицине до опасений по поводу утраты контроля и потери рабочих мест. Формат «личного путешествия» позволяет фильму избежать нравоучительного тона и дает возможность поразмышлять вслух — с той же смесью тревоги и надежды, которую испытывает любой родитель ребенка эпохи цифровых технологий.", "en": "Director Daniel Roher is about to become a father and decides to understand the world his child will grow up in. Through a series of candid conversations with leading voices of the AI industry, he maps the field: from enthusiasm and medical revolution to fears about control and job loss. The 'personal journey' format lets the film avoid lecturing and think out loud — with the same mix of anxiety and hope any parent of the digital generation feels."}, "genres": ["documentary"], "year": 2026, "imdbId": "tt39150120", "imdbRating": 6.8, "kpId": 11813093, "kpRating": null, "poster": "static/posters/theaidoc_doc_poster.webp"}, {"type": "documentary", "titleEn": "Citizenfour", "titleRu": "Citizenfour: Правда Сноудена", "desc": {"ru": "В июне 2013 года в номере гонконгского отеля Лора Пойтрас снимает первые встречи с анонимным источником, выступающим под псевдонимом «Citizenfour» (Гражданин четыре), — Эдвардом Сноуденом, обладателем архивов, раскрывающих масштабы тотальной слежки АНБ. Мы наблюдаем за происходящим в режиме реального времени: принятие решения предать информацию огласке, звонок адвокату, появление первых заголовков в прессе и осознание того, что пути назад уже нет. Фильм, удостоенный премии «Оскар» за лучший документальный фильм, — редкий пример того, как камера оказывается не просто рядом с событиями, а в самом центре их развития.", "en": "In June 2013, in a Hong Kong hotel room, Laura Poitras films the first meetings with an anonymous source signed 'Citizenfour': Edward Snowden, carrying archives about the NSA's total surveillance. We watch it happen in real time: the decision to go public, the call to a lawyer, the first headlines, and the growing understanding that there is no way back. The Oscar winner for Best Documentary — and a rare case of a camera being not next to the story but inside its unfolding."}, "genres": ["biography"], "year": 2014, "imdbId": "tt4044364", "imdbRating": 8.0, "kpId": 843103, "kpRating": 7.3, "fav": true, "poster": "static/posters/citizenfour_doc_poster.webp"}], "posterW": 405, "posterH": 600};</script>
