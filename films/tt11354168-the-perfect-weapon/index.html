            <h1 class="film-title">Идеальное оружие</h1>
            <p class="film-alt">The Perfect Weapon</p>
            <div class="film-meta">
              <span class="film-meta-item">2020</span>
              <span class="film-meta-item">Документальный</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/1331542/" target="_blank" rel="noopener noreferrer">Кинопоиск: 6.5</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt11354168/" target="_blank" rel="noopener noreferrer">IMDb: 7.2 ★</a>
        </div>
            <p class="film-desc">Фильм, основанный на книге журналиста New York Times Дэвида Сэнгера, рассказывает о том, как кибератаки превратились в привычный инструмент государственной политики — от Stuxnet до нападений на энергосети, банки и избирательные системы. Интервью с сотрудниками спецслужб, жертвами атак и хакерами позволяют проследить эту эволюцию: от сложных операций, проводимых государственными ведомствами, до деятельности группировок, использующих программы-вымогатели и работающих по модели «подписки». Это серьезный фильм о том, что кибервойна — это уже не будущее, а невидимая повседневная реальность.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Based on New York Times reporter David Sanger&#x27;s book: how cyber attacks became a routine instrument of states — from Stuxnet to attacks on power grids, banks and elections. Interviews with intelligence officers, attack victims and hackers trace the evolution: from complex agency operations to ransomware gangs running &#x27;subscription&#x27; models. A sober film about the fact that cyber war is no longer the future — it is an invisible everyday backdrop.</p>
            </details>
          </div>
