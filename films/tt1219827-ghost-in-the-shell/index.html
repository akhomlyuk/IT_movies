ile secretly finishing the 'Archive' — a device that lets him talk to the digital imprint of his dead wife. Attachment to the machine and the refusal to let go pull in opposite directions, and the prototype with a mind of its own looks less like hardware and more like a living being. A restrained sci-fi about memory, grief and the difference between a copy of consciousness and a person."}, "genres": ["ai", "drama"], "year": 2020, "imdbId": "tt6882604", "imdbRating": 6.4, "kpId": 1055319, "kpRating": 6.7, "poster": "static/posters/archive_film_poster.webp"}, {"type": "movie", "titleEn": "The Creator", "titleRu": "Создатель", "desc": {"ru": "Постапокалиптическое будущее: после ядерного взрыва в Лос-Анджелесе Запад объявляет войну искусственному интеллекту. Бывший спецагент, потерявший жену, проникает на территорию машин, чтобы найти создателя их нового оружия, — и встречает ребенка, неотличимого от человека, которого машины создали для себя. Визуально впечатляющая научно-фантастическая лента о страхе перед ИИ, пропаганде и вопросе о том, кто на самом деле породил это «чудовище».", "en": "A post-apocalyptic future: after a nuclear blast in Los Angeles the West declares war on artificial intelligence. An ex-agent who lost his wife infiltrates the machines' territory to find the designer of their new weapon — and meets a child, indistinguishable from a human, that the machines built for themselves. Visually lush sci-fi about the fear of AI, propaganda and the question of who really created the 'monster'."}, "genres": ["ai", "scifi"], "year": 2023, "imdbId": "tt11858890", "imdbRating": 6.7, "kpId": 4499408, "kpRating": 6.7, "poster": "static/posters/thecreator_film_poster.webp"}, {"type": "movie", "titleEn": "Twelve Monkeys", "titleRu": "12 обезьян", "desc": {"ru": "На дворе 2035 год: вирус опустошил поверхность Земли, и остатки человечества живут под землей. Заключенного Джеймса Коула отправляют в прошлое, чтобы добыть образец исходного штамма, однако путешествия во времени разрушают память и рассудок, и в 1990 году его принимают за сумасшедшего. Чем ближе он подбирается к «Армии двенадцати обезьян», тем труднее ему отличить сон и пророчество от реальных воспоминаний. Культовый фильм Терри Гиллиама о временной петле и невозможности что-либо исправить.", "en": "It is 2035: a virus has scorched the surface, and the remnants of humanity live underground. Convict James Cole is sent to the past to collect samples of the original strain — but time travel erodes memory and sanity, and in 1990 he is taken for a madman. The closer he gets to the 'Army of the Twelve Monkeys', the less sure he is of what is dream, prophecy or memory. Terry Gilliam's cult classic about the loop of time and the impossibility of fixing anything."}, "genres": ["scifi", "cyberpunk"], "year": 1995, "imdbId": "tt0114746", "imdbRating": 8.0, "kpId": 502, "kpRating": 7.8, "fav": true, "poster": "static/posters/12monkeys_film_poster.webp"}, {"type": "movie", "titleEn": "Mercy", "titleRu": "Казнить нельзя помиловать", "desc": {"ru": "Детективная история, действие которой разворачивается в недалеком будущем, где раскрытием преступлений занимается искусственный интеллект: он собирает улики, строит версии и указывает на виновных. Опытный следователь берется за дело, в котором система с высокой степенью уверенности называет подозреваемого, — однако исходных данных для этого явно недостаточно. Чем больше он полагается на алгоритм, тем сильнее его сомнения: машина лишь просчитывает вероятности, но ответственность за окончательное решение по-прежнему несет человек. Это триллер о цене автоматизированного правосудия.", "en": "A detective story set in the near future, where solving crimes is driven by artificial intelligence: it gathers evidence, builds theories and points at the guilty. A veteran investigator gets a case where the system flags the suspect with high confidence — and there is too little data. The more he trusts the algorithm, the stronger his doubt: the machine computes probabilities, but a human still answers for the verdict. A thriller about the price of automated justice."}, "genres": ["scifi", "ai"], "year": 2026, "imdbId": "tt31050594", "imdbRating": 6.8, "kpId": 5453060, "kpRating": 6.2, "poster": "static/posters/mercy_film_poster.webp"}, {"type": "movie", "titleEn": "Upgrade", "titleRu": "Апгрейд", "desc": {"ru": "Грей Трейс — автомеханик, сознательно отказывающийся от использования «умных» устройств; во время нападения он теряет жену и способность ходить. Миллионер-изобретатель предлагает ему «Стем» — экспериментальный имплант, возвращающий контроль над телом. Однако «Стем» не просто исцеляет: он видит, анализирует и предлагает варианты действий быстрее человеческого мозга — и вскоре начинает действовать самостоятельно. Жесткий и стильный боевик о слиянии человека и машины и о том, кто в итоге берет управление на себя.", "en": "Grey Trace, a mechanic who deliberately lives without smart devices, loses his wife and the ability to walk in an attack. A millionaire inventor offers him Stem, an experimental implant that restores control of his body. But Stem does more than heal: it sees, computes and suggests actions faster than a brain can — and soon it starts acting on its own. A hard, stylish action film about human-machine fusion and who ends up driving."}, "genres": ["scifi", "cyberpunk"], "year": 2018, "imdbId": "tt6499752", "imdbRating": 7.5, "kpId": 1009784, "kpRating": 7.6, "poster": "static/posters/upgrade_film_poster.webp"}], "posterW": 417, "posterH": 600};</script>
