            <p class="film-desc">Потерянное интервью 1995 года: Джобс в момент, когда Apple на грани банкротства, а его самого выгнали из компании. За час он объясняет, почему продукты должны опережать запросы пользователей, что такое «полный цикл» железа и софта, почему большие компании теряют инновационность — и рассказывает легендарную метафору про камень, оттачивающий другой камень. Возможно, лучший первоисточник для понимания того, как думал Джобс — без мифологии биографов.</p>
            <p class="film-desc film-desc-alt">The lost 1995 interview: Jobs at the moment when Apple is near bankruptcy and he himself has been thrown out of the company. In an hour he explains why products must run ahead of what users ask for, what the &#x27;end-to-end&#x27; ownership of hardware and software means, why big companies lose innovation — and gives the legendary metaphor of a rock polishing another rock. Perhaps the best primary source on how Jobs thought — without the biographers&#x27; mythology.</p>
