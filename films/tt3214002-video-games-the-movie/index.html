            <p class="film-desc">Обзорный документальный фильм об истории и культуре видеоигр: от Pong и залов игровых автоматов 70-х до киберспорта и игр как вида искусства. Вместо единого сюжета — мозаика тем: геймдизайн, нарратив, игровая зависимость, дилемма «эскапизм или творчество», а также мнения разработчиков, актеров и фанатов. Идеальная отправная точка для тех, кто хочет получить системное представление об индустрии, — но слишком общий материал для тех, кто уже глубоко в ней разбирается.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">An overview documentary on the history and culture of video games: from Pong and 70s arcades to esports and games as an art form. Instead of one storyline — a mosaic of themes: game design, narrative, addiction, &#x27;escapism vs creativity&#x27;, voices of developers, actors and fans. Ideal as a &#x27;zero point&#x27; for those who want a systematic view of the industry — too broad for those already inside it.</p>
