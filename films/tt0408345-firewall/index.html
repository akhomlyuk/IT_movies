            <p class="film-desc">Джек Стэнфилд, начальник службы безопасности банка, управляет системой, считающейся неприступной. Преступники изучили его жизнь и нашли уязвимое место — его семью взяли в заложники, и теперь Джек должен перевести 100 миллионов долларов так, чтобы никто этого не заметил. Удачная сценарная деталь: герой побеждает не благодаря героическим подвигам, а используя свои профессиональные инструменты — сканер на базе iPod, записанный диск и знание протоколов. Это процедуральный триллер о том, что самый надежный брандмауэр выстраивается вокруг человека, а не сети.</p>
            <p class="film-desc film-desc-alt">Jack Stanfield, a bank&#x27;s chief of security, runs a system considered impenetrable. The criminals have studied his life and picked the vulnerability in him: family held hostage, and Jack must move 100 million dollars so no one notices. A nice script detail — the hero wins not by heroism but with the tools of his profession: an iPod scanner, a burned disc, knowledge of protocols. A procedural thriller about the fact that the strongest firewall is built around a person, not a network.</p>
