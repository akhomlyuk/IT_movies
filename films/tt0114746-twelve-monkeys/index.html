            <p class="film-alt">Twelve Monkeys</p>
            <div class="film-meta">

            <p class="film-desc">На дворе 2035 год: вирус опустошил поверхность Земли, и остатки человечества живут под землей. Заключенного Джеймса Коула отправляют в прошлое, чтобы добыть образец исходного штамма, однако путешествия во времени разрушают память и рассудок, и в 1990 году его принимают за сумасшедшего. Чем ближе он подбирается к «Армии двенадцати обезьян», тем труднее ему отличить сон и пророчество от реальных воспоминаний. Культовый фильм Терри Гиллиама о временной петле и невозможности что-либо исправить.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">It is 2035: a virus has scorched the surface, and the remnants of humanity live underground. Convict James Cole is sent to the past to collect samples of the original strain — but time travel erodes memory and sanity, and in 1990 he is taken for a madman. The closer he gets to the &#x27;Army of the Twelve Monkeys&#x27;, the less sure he is of what is dream, prophecy or memory. Terry Gilliam&#x27;s cult classic about the loop of time and the impossibility of fixing anything.</p>
            </details>
          </div>
