            <h1 class="film-title">Особое мнение</h1>
            <p class="film-alt">Minority Report</p>
            <div class="film-meta">
              <span class="film-meta-item">2002</span>
              <span class="film-meta-item">Боевик, Фантастика</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/496/" target="_blank" rel="noopener noreferrer">Кинопоиск: 7.7 ★</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt0181689/" target="_blank" rel="noopener noreferrer">IMDb: 7.6 ★</a>
        </div>
            <p class="film-desc">Вашингтон, 2054 год: система «Особое мнение» (PreCrime), основанная на пророчествах трех «оракулов», предотвращает убийства еще до их совершения. Джон Эндертон, лучший сотрудник этого подразделения, сам становится подозреваемым: оракулы предсказывают, что он убьет человека, которого никогда не встречал. Бежать бессмысленно: его глаза сканируют в каждом магазине, реклама обращается к нему по имени, а механические пауки прочесывают здания. Фильм Стивена Спилберга по мотивам произведения Филипа К. Дика — история о предсказании будущего, неприкосновенности частной жизни и свободе воли.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Washington, 2054: the PreCrime system, built on prophecies of three &#x27;oracles&#x27;, stops murders before they happen. John Anderton, the unit&#x27;s best officer, becomes a suspect himself: the oracles predict he will kill a man he has never met. Running is pointless — his eyes are scanned in every store, ads address him by name, and mechanical spiders comb the buildings. Spielberg&#x27;s Philip K. Dick adaptation about prediction, privacy and free will.</p>
            </details>
          </div>
