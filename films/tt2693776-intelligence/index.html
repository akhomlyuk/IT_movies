            <p class="film-desc">Комедия CBS о агенте ЦРУ, прикреплённом к учёному с чипом в голове: он может подключаться к сетям напрямую, видеть через чужие камеры и открывать замки взглядом. Сюжетная рамка стандартна — охота на террористов, прототипы нового оружия, — но сама идея «человека как конечного узла сети» обыграна с юмором и воображением. Лёгкий сериал о том, что произойдёт, когда поиск и пароли станут ненужными: мир станет одинаково удобным для нас и для тех, кто за нами следит.</p>
            <p class="film-desc film-desc-alt">A CBS comedy about a CIA agent assigned to a scientist with a chip in his head: he can connect to networks directly, see through other people&#x27;s cameras and unlock doors with a glance. The frame is standard — hunting terrorists, new weapons prototypes — but the idea of &#x27;a human as an endpoint&#x27; is played with humor and imagination. A light series about what happens when search and passwords become unnecessary: the world becomes equally convenient for us and for whoever watches us.</p>
