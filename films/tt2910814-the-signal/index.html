            <p class="film-desc">Трое студентов MIT отправляются в путешествие через всю страну, чтобы найти хакера-тролля по прозвищу NOMAD, который унижает их в сети. След приводит их в заброшенный дом посреди пустыни, где происходит нечто необъяснимое, — а затем один из них приходит в себя в костюме биологической защиты в окружении людей в аналогичном снаряжении. По мере развития сюжета становится всё очевиднее, что «хакинг» здесь — это не сетевой термин, а экзистенциальная категория. Стильный научно-фантастический нуар о наблюдателях, симуляции и цене любопытства.</p>
            <p class="film-desc film-desc-alt">Three MIT students drive across the country to hunt down a hacker troll named NOMAD who humiliates them online. The trail leads to an abandoned house in the desert, where something inexplicable happens — and then one of them wakes up in a biohazard suit among people in protective gear. The further it goes, the clearer it becomes that &#x27;hacking&#x27; here is an existential category, not a network one. A stylish sci-fi noir about watchers, simulation and the price of curiosity.</p>

  <script>window.FILM_PAGE = {"item": {"type": "movie", "titleEn": "The Signal", "titleRu": "Сигнал", "desc": {"ru": "Трое студентов MIT отправляются в путешествие через всю страну, чтобы найти хакера-тролля по прозвищу NOMAD, который унижает их в сети. След приводит их в заброшенный дом посреди пустыни, где происходит нечто необъяснимое, — а затем один из них приходит в себя в костюме биологической защиты в окружении людей в аналогичном снаряжении. По мере развития сюжета становится всё очевиднее, что «хакинг» здесь — это не сетевой термин, а экзистенциальная категория. Стильный научно-фантастический нуар о наблюдателях, симуляции и цене любопытства.", "en": "Three MIT students drive across the country to hunt down a hacker troll named NOMAD who humiliates them online. The trail leads to an abandoned house in the desert, where something inexplicable happens — and then one of them wakes up in a biohazard suit among people in protective gear. The further it goes, the clearer it becomes that 'hacking' here is an existential category, not a network one. A stylish sci-fi noir about watchers, simulation and the price of curiosity."}, "genres": ["thriller", "scifi"], "year": 2014, "imdbId": "tt2910814", "imdbRating": 6.0, "kpId": 762854, "kpRating": 5.3, "poster": "static/posters/thesignal_film_poster.webp"}, "related": [{"type": "movie", "titleEn": "The Thirteenth Floor", "titleRu": "Тринадцатый этаж", "desc": {"ru": "Лос-Анджелес, 1999 год: инженер Хэннон Фуллер создает симуляцию Лос-Анджелеса 1937 года, воссоздавая каждого прохожего, и оставляет записку своему коллеге Дугласу Холлу, которую тот так и не дочитывает. Обнаружив его мертвым, Холл входит в симуляцию и постепенно понимает: вопрос не в том, кто убил Фуллера, а в том, где заканчивается смоделированное и начинается «реальное». Философская научная фантастика, основанная на романе Дэниела Галуйе.", "en": "Los Angeles, 1999: engineer Hannon Fuller builds a simulation of 1937 Los Angeles down to the last passerby and leaves a note for colleague Douglas Hall that he never gets to read. Finding him dead, Hall enters the simulation and gradually understands: the question is not who killed Fuller but where the modeled ends and the 'real' begins. Philosophical sci-fi based on Daniel Galouye's novel."}, "genres": ["thriller", "scifi"], "year": 1999, "imdbId": "tt0139809", "imdbRating": 7.0, "kpId": 1086, "kpRating": 7.6, "fav": true, "poster": "static/posters/13floor_film_poster.webp"}, {"type": "movie", "titleEn": "Anon", "titleRu": "Анон", "desc": {"ru": "Будущее, в котором упразднено понятие частной жизни: каждый миг существования фиксируется «глазами», полиция восстанавливает события по воспоминаниям свидетелей, а доказательства собираются задним числом. Детектив Сэл Фриленд расследует серию убийств, которые никто не видит, — преступления совершает та, кто умеет стирать себя из чужих записей. Это антиутопия, снятая в жанре полицейского процедурала и задающая неудобный вопрос: если всё вокруг записывается, что же остается от человека — и возможна ли вообще вина, если нет памяти? Эндрю Никкол, режиссер «Гаттаки», здесь в своей стихии.", "en": "A future where privacy is abolished: every moment of life is recorded through the eyes, police replay events from witnesses' memories, and evidence is gathered retroactively. Detective Sal Frieland investigates a series of murders no one can see, committed by someone who knows how to delete herself from other people's records. A dystopia shot as a procedural, asking an uncomfortable question: if everything is recorded, what is left of a person — and is guilt even possible without memory? Andrew Niccol, director of Gattaca, in his element."}, "genres": ["scifi", "thriller"], "year": 2018, "imdbId": "tt5397194", "imdbRating": 6.1, "kpId": 979121, "kpRating": 6.4, "poster": "static/posters/anon_film_poster.webp"}, {"type": "movie", "titleEn": "Blade Runner", "titleRu": "Бегущий по лезвию", "desc": {"ru": "Лос-Анджелес, 2019 год: бесконечный дождь, неоновые огни и корпорации, торгующие жизнями. Рик Декард, бывший «бегущий по лезвию», вынужден вернуться к работе, чтобы уничтожить группу сбежавших с внеземной колонии репликантов модели Nexus-6. Проблема в том, что он охотится не на машины: репликанты Nexus-6 помнят своих матерей, боятся смерти и способны любить сильнее, чем окружающие их люди. Эта экранизация произведения Филипа К. Дика определила визуальный стиль киберпанка на десятилетия вперед и по сей день остается лучшим фильмом о том, что значит быть человеком.", "en": "Los Angeles, 2019: endless rain, neon, corporations trading in lives. Rick Deckard, a retired blade runner, is pulled back in to eliminate a group of escaped Nexus-6 replicants from an off-world colony. The problem is he is not hunting a machine: Nexus-6 remember their mothers, fear death and love more than the people around them. A Philip K. Dick adaptation that defined cyberpunk's visual language for decades — and is still the best film about what being human means."}, "genres": ["scifi", "thriller"], "year": 1982, "imdbId": "tt0083658", "imdbRating": 8.2, "kpId": 403, "kpRating": 7.7, "fav": true, "poster": "static/posters/bladerunner_film_poster.webp"}, {"type": "movie", "titleEn": "eXistenZ", "titleRu": "Экзистенция", "desc": {"ru": "Аллегра Геллер, величайший геймдизайнер будущего, представляет eXistenZ: биопорты, вживленные в позвоночник, и миры, питающиеся нервной системой игрока. Покушение, совершенное прямо во время демонстрации, превращает презентацию в бегство, а бегство — в игру, где никто не знает, чей сценарий сейчас разыгрывается. Кроненберг заменяет провода плотью и задается вопросом: если реальность держится на уверенности «я здесь», то что происходит, когда две такие уверенности оказываются вложенными друг в друга? Научная фантастика о виртуальности на уровне плоти, а не очков виртуальной реальности.", "en": "Allegra Geller, the greatest game designer of the future, demos eXistenZ: bio-ports spliced into spines and worlds that feed on the player's nervous system. An attempt on her life mid-demo turns the presentation into an escape, and the escape into a game where no one knows whose script is running. Cronenberg swaps wires for flesh and asks: if reality rests on the certainty of 'I am here', what happens when two such certainties are nested inside each other? Sci-fi about virtuality at the level of flesh, not goggles."}, "genres": ["scifi", "thriller"], "year": 1999, "imdbId": "tt0120907", "imdbRating": 6.8, "kpId": 7569, "kpRating": 7.0, "poster": "static/posters/existenz_film_poster.webp"}, {"type": "movie", "titleEn": "Morgan", "titleRu": "Морган", "desc": {"ru": "В секретной корпоративной лаборатории уже пять лет выращивают Морган — существо, созданное методами синтетической биологии и развивающееся быстрее человека. После некоего инцидента туда направляют специалиста по оценке рисков Ли Уэзерс; у нее есть всего неделя, чтобы решить: кто перед ней — продукт или угроза? Проблема в том, что Морган — это пятилетний ребенок в теле взрослого, уже способный произнести: «Меня создали как оружие». Это атмосферный триллер о столкновении целесообразности и этики — и о том, как выглядит «отзыв продукции» в сфере биологии.", "en": "In an underground corporate lab, Morgan has been grown for five years — a being made by synthetic biology, developing faster than a human. After an incident, risk consultant Lee Weathers is sent in with one week to assess: product or threat? The problem is Morgan is a five-year-old in an adult body, already capable of saying: 'I was made as a weapon.' An atmospheric thriller about expediency set against ethics — and about how a 'product recall' looks in biology."}, "genres": ["scifi", "thriller"], "year": 2016, "imdbId": "tt4520364", "imdbRating": 5.9, "kpId": 906340, "kpRating": 5.8, "poster": "static/posters/morgan_film_poster.webp"}], "posterW": 405, "posterH": 600};</script>
