            <p class="film-desc">Доктор Лоуренс Анджело испытывает экспериментальные препараты и системы виртуальной реальности на садовнике по имени Джоб, страдающем умственной отсталостью, — и этот добродушный великан превращается в сверхразум. Проблема в том, что интеллект развивается быстрее, чем нравственность, и виртуальный мир становится для Джоба единственной реальностью. Фильм 1992 года продемонстрировал больше VR-шлемов, чем существовало в действительности, и стал своеобразной вехой в дискуссии об улучшении человеческих возможностей. Картина была заявлена ​​как «вдохновленная произведениями Стивена Кинга», однако сам писатель через суд добился того, чтобы его имя убрали из титров.</p>
            <p class="film-desc film-desc-alt">Dr. Lawrence Angelo tests experimental drugs and VR rigs on Jobe, a gardener with an intellectual disability — and the simple giant turns into a superintelligence. The problem is that intellect grows faster than morality, and the virtual world becomes the only real one for Jobe. In 1992 the film showed more VR headsets than existed in nature and became a strange milestone in the conversation about human enhancement. &#x27;Inspired by Stephen King&#x27; — King actually sued to have his name removed.</p>

  <script>window.FILM_PAGE = {"item": {"type": "movie", "titleEn": "The Lawnmower Man", "titleRu": "Газонокосильщик", "desc": {"ru": "Доктор Лоуренс Анджело испытывает экспериментальные препараты и системы виртуальной реальности на садовнике по имени Джоб, страдающем умственной отсталостью, — и этот добродушный великан превращается в сверхразум. Проблема в том, что интеллект развивается быстрее, чем нравственность, и виртуальный мир становится для Джоба единственной реальностью. Фильм 1992 года продемонстрировал больше VR-шлемов, чем существовало в действительности, и стал своеобразной вехой в дискуссии об улучшении человеческих возможностей. Картина была заявлена ​​как «вдохновленная произведениями Стивена Кинга», однако сам писатель через суд добился того, чтобы его имя убрали из титров.", "en": "Dr. Lawrence Angelo tests experimental drugs and VR rigs on Jobe, a gardener with an intellectual disability — and the simple giant turns into a superintelligence. The problem is that intellect grows faster than morality, and the virtual world becomes the only real one for Jobe. In 1992 the film showed more VR headsets than existed in nature and became a strange milestone in the conversation about human enhancement. 'Inspired by Stephen King' — King actually sued to have his name removed."}, "genres": ["scifi", "action"], "year": 1992, "imdbId": "tt0104692", "imdbRating": 5.5, "kpId": 7449, "kpRating": 6.6, "poster": "static/posters/thelawnmowerman_film_poster.webp"}, "related": [{"type": "movie", "titleEn": "Johnny Mnemonic", "titleRu": "Джонни Мнемоник", "desc": {"ru": "2021 год: половина человечества страдает от синдрома ослабления нервной системы, а данные перевозят курьеры с мозговыми имплантатами. В мозг Джонни загружен груз, представляющий огромную ценность для якудза; у него есть всего сутки, чтобы выгрузить 320 гигабайт, прежде чем его мозг сгорит. Экранизация рассказа Уильяма Гибсона, написанного еще до того, как киберпанк оформился в жанр: здесь есть дельфины-хакеры, сетевые пророки и интернет, представляющий собой органический океан. Фильм выглядит несколько неуклюжим и нарочито театральным, но при этом верно передает дух первоисточника.", "en": "2021: half of humanity suffers from Nerve Attenuation Syndrome, and data is carried by couriers with brain implants. Johnny has uploaded cargo too valuable for the Yakuza — and has one day to drain 320 gigabytes before they burn his brain out. A film take on William Gibson's story, written before cyberpunk became a genre: hacker dolphins, network prophets and an internet that is an organic ocean. Clunky, campy — and true to the spirit."}, "genres": ["scifi", "action"], "year": 1995, "imdbId": "tt0113481", "imdbRating": 5.6, "kpId": 3800, "kpRating": 6.8, "poster": "static/posters/johnnymnemonic_film_poster.webp"}, {"type": "movie", "titleEn": "The Matrix", "titleRu": "Матрица", "desc": {"ru": "Программист Томас Андерсон, а по ночам хакер Нео, чувствует, что мир ошибается — и это действительно так: реальность — это симуляция, созданная машинами для сбора энергии со спящих людей. Выбор красной таблетки означает принятие правды, физической боли и ответственности без гарантий. Братья Вачовски объединили киберпанк Гибсона, дзен-буддизм, Бодрийяра и трюки с тросами в жанр, который навсегда изменил Голливуд. «Жизнь в Матрице» перестала быть метафорой и стала частью лексики: красная таблетка, Агент Смит, синяя таблетка, побег из тюрьмы.", "en": "Programmer Thomas Anderson, by night the hacker Neo, senses the world is wrong — and he is: reality is a simulation built by machines to harvest energy from sleeping humans. Choosing the red pill means accepting truth, physical pain and responsibility without guarantees. The Wachowskis fused Gibson's cyberpunk, Zen Buddhism, Baudrillard and wire-fu into a genre that changed Hollywood for good. 'Living in the Matrix' stopped being a metaphor and became vocabulary: red pill, Agent Smith, bluepill, jailbreak."}, "genres": ["scifi", "action"], "year": 1999, "imdbId": "tt0133093", "imdbRating": 8.7, "kpId": 301, "kpRating": 8.5, "fav": true, "poster": "static/posters/matrix_film_poster.webp"}, {"type": "movie", "titleEn": "The Matrix Reloaded", "titleRu": "Матрица: Перезагрузка", "desc": {"ru": "У Зиона осталось 72 часа: к нему пробиваются буры машин, а Нео получает больше вопросов, чем ответов — «Почему я?», «Почему ИИ вообще оставляет людям выбор?» — и с каждой беседой с Пифией или Архитектором он всё меньше напоминает мессию и всё больше — элемент чужого цикла. Сиквел расширяет мифологию: здесь появляются Меровинген, изгнанные хакерские программы и сущности, отказывающиеся подчиняться удалению, а сам сюжет читается как отчет об ошибке в версии 6.0. Меньше революции, больше системного анализа — плюс самая дорогая работа фрилансера в киноиндустрии на шоссе.", "en": "Zion has 72 hours left: machines are drilling toward it, and Neo gets more questions than answers — Why me? Why does the AI leave humans a choice at all? — and with every talk to the Oracle and the Architect he looks less like a messiah and more like an element of someone else's cycle. The sequel widens the mythology: the Merovingian, exiled hacker programs, entities refusing deletion, and the plot itself reading like a bug report against version 6.0. Less revolution, more systems analysis — plus cinema's most expensive freelance gig on a highway."}, "genres": ["scifi", "action"], "year": 2003, "imdbId": "tt0234215", "imdbRating": 7.2, "kpId": 299, "kpRating": 7.7, "poster": "static/posters/thematrixreloaded_film_poster.webp"}, {"type": "movie", "titleEn": "H0us3", "titleRu": "Пароль: Хаус", "desc": {"ru": "Испанский хоррор о молодом хакере, для которого взлом систем — способ самоутвердиться. Очередная авантюра приводит его в странный дом, где виртуальная игра перестает быть игрой: опасность становится реальной, а правила начинает диктовать кто-то другой. Фильм обыгрывает иллюзию, знакомую каждому представителю «интернет-поколения» — убежденность в том, что по ту сторону экрана ничто не является «настоящим», — и задается вопросом: где именно заканчивается игра и начинается жизнь?", "en": "A Spanish horror about a young hacker for whom breaking into systems is a way to prove himself. One more stunt leads him to a strange house where the virtual game stops being a game: the danger turns physical and someone else is setting the rules. The film plays with the illusion familiar to every online generation — that behind the screen nothing is 'real' — and asks where exactly the game ends and life begins."}, "genres": ["scifi", "horror"], "year": 2018, "imdbId": "tt9055630", "imdbRating": 5.5, "kpId": 1212316, "kpRating": 6.1, "poster": "static/posters/h0u53_film_poster.webp"}, {"type": "movie", "titleEn": "The Creator", "titleRu": "Создатель", "desc": {"ru": "Постапокалиптическое будущее: после ядерного взрыва в Лос-Анджелесе Запад объявляет войну искусственному интеллекту. Бывший спецагент, потерявший жену, проникает на территорию машин, чтобы найти создателя их нового оружия, — и встречает ребенка, неотличимого от человека, которого машины создали для себя. Визуально впечатляющая научно-фантастическая лента о страхе перед ИИ, пропаганде и вопросе о том, кто на самом деле породил это «чудовище».", "en": "A post-apocalyptic future: after a nuclear blast in Los Angeles the West declares war on artificial intelligence. An ex-agent who lost his wife infiltrates the machines' territory to find the designer of their new weapon — and meets a child, indistinguishable from a human, that the machines built for themselves. Visually lush sci-fi about the fear of AI, propaganda and the question of who really created the 'monster'."}, "genres": ["ai", "scifi"], "year": 2023, "imdbId": "tt11858890", "imdbRating": 6.7, "kpId": 4499408, "kpRating": 6.7, "poster": "static/posters/thecreator_film_poster.webp"}], "posterW": 395, "posterH": 600};</script>
