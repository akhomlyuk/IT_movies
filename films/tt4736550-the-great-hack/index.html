        <div class="ratings">

        </div>
            <p class="film-desc">История Cambridge Analytica изнутри: рассказ Бриттани Кайзер, работавшей в компании, а затем сотрудничавшей со следствием, и журналиста, расследующего методы психографического профилирования избирателей. Фильм показывает, как таргетированная реклама превращается в инструмент политической войны и почему удаление приложения не отменяет факт сбора данных. Лучший фильм для первого знакомства с тем, что на самом деле представляют собой скандалы, связанные с утечкой данных.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">The Cambridge Analytica story from the inside: Brittany Kaiser, who worked at the company and later cooperated with investigators, and a journalist digging into psychographic profiling of voters. The film shows how &#x27;ad targeting&#x27; becomes an instrument of political warfare — and why deleting the app does not undo the data already collected. The best intro film to what data scandals actually are.</p>
            </details>
          </div>
