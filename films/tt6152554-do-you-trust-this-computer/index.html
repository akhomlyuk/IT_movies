            <p class="film-desc">Документальный фильм Криса Пейна — режиссера картины «Кто убил электромобиль?» — посвящен тому, что происходит, когда искусственный интеллект выходит за пределы лабораторий и становится частью инфраструктуры: от дронов и дипфейков до алгоритмических решений, влияющих на человеческие жизни. В ленте представлены интервью с Илоном Маском, экспертами Google и создателями DeepMind; здесь же звучит одна из самых известных фраз Маска, сравнивающая ИИ с «вызовом демона». Цель фильма — не напугать зрителя, а побудить его задуматься о том, кому он на самом деле доверяет свои данные и принятие решений.</p>
            <p class="film-desc film-desc-alt">Chris Paine&#x27;s documentary — from the director of Who Killed the Electric Car? — about what happens when AI leaves the lab and becomes infrastructure: from drones to deepfakes to algorithmic decisions about human lives. Interviews with Elon Musk, Google experts and DeepMind creators; one of Musk&#x27;s best-known lines calling AI &#x27;summoning the demon&#x27;. The film&#x27;s goal is not to scare but to force you to articulate whom you actually trust with your data and decisions.</p>

  <script>window.FILM_PAGE = {"item": {"type": "documentary", "titleEn": "Do You Trust This Computer?", "titleRu": "Вы доверяете этому компьютеру?", "desc": {"ru": "Документальный фильм Криса Пейна — режиссера картины «Кто убил электромобиль?» — посвящен тому, что происходит, когда искусственный интеллект выходит за пределы лабораторий и становится частью инфраструктуры: от дронов и дипфейков до алгоритмических решений, влияющих на человеческие жизни. В ленте представлены интервью с Илоном Маском, экспертами Google и создателями DeepMind; здесь же звучит одна из самых известных фраз Маска, сравнивающая ИИ с «вызовом демона». Цель фильма — не напугать зрителя, а побудить его задуматься о том, кому он на самом деле доверяет свои данные и принятие решений.", "en": "Chris Paine's documentary — from the director of Who Killed the Electric Car? — about what happens when AI leaves the lab and becomes infrastructure: from drones to deepfakes to algorithmic decisions about human lives. Interviews with Elon Musk, Google experts and DeepMind creators; one of Musk's best-known lines calling AI 'summoning the demon'. The film's goal is not to scare but to force you to articulate whom you actually trust with your data and decisions."}, "genres": ["documentary"], "year": 2018, "imdbId": "tt6152554", "imdbRating": 7.3, "kpId": 1078501, "kpRating": 7.1, "poster": "static/posters/doyoutrust_doc_poster.webp"}, "related": [{"type": "documentary", "titleEn": "The AI Doc: Or How I Became an Apocaloptimist", "titleRu": "Док об ИИ: Или как я стал апокалиптимистом", "desc": {"ru": "Режиссер Дэниел Роэр готовится стать отцом и решает разобраться, в каком мире предстоит расти его ребенку. В ходе серии откровенных бесед с ключевыми фигурами индустрии искусственного интеллекта он исследует эту сферу: от всеобщего воодушевления и революционных перемен в медицине до опасений по поводу утраты контроля и потери рабочих мест. Формат «личного путешествия» позволяет фильму избежать нравоучительного тона и дает возможность поразмышлять вслух — с той же смесью тревоги и надежды, которую испытывает любой родитель ребенка эпохи цифровых технологий.", "en": "Director Daniel Roher is about to become a father and decides to understand the world his child will grow up in. Through a series of candid conversations with leading voices of the AI industry, he maps the field: from enthusiasm and medical revolution to fears about control and job loss. The 'personal journey' format lets the film avoid lecturing and think out loud — with the same mix of anxiety and hope any parent of the digital generation feels."}, "genres": ["documentary"], "year": 2026, "imdbId": "tt39150120", "imdbRating": 6.8, "kpId": 11813093, "kpRating": null, "poster": "static/posters/theaidoc_doc_poster.webp"}, {"type": "documentary", "titleEn": "The Inventor: Out for Blood in Silicon Valley", "titleRu": "Изобретатель: Жажда крови в Силиконовой долине", "desc": {"ru": "Элизабет Холмс обещала революцию: всего одна капля крови вместо десятков анализов и компания Theranos стоимостью девять миллиардов долларов. Алекс Гибни реконструирует историю краха, опираясь на интервью, записи совещаний и свидетельства сотрудников: он показывает, как вера в миссию заглушала сомнения, как обложки журналов подменяли собой клинические испытания и как пациенты становились жертвами обмана. Это лучший документальный фильм о мифологии стартапов — обязательный к просмотру для всех, кто верит громким обещаниям, звучащим со сцены.", "en": "Elizabeth Holmes promised a revolution: one drop of blood instead of dozens of tests, a company called Theranos worth nine billion dollars. Alex Gibney assembles the fall through interviews, boardroom tapes and employee testimony: how belief in the mission suppressed doubt, how magazine covers replaced clinical trials, how patients became the victims. The best documentary about startup mythology — required viewing for anyone who believes loud promises on stage."}, "genres": ["documentary", "biography"], "year": 2019, "imdbId": "tt8488126", "imdbRating": 7.2, "kpId": 1160654, "kpRating": 7.2, "poster": "static/posters/theinventor_doc_poster.webp"}, {"type": "documentary", "titleEn": "Deep Web", "titleRu": "Глубокая паутина", "desc": {"ru": "Документальный фильм о судебном процессе над Россом Ульбрихтом, основателем Silk Road — даркнет-маркетплейса, где за биткоины торговали всем: от марихуаны до оружия. Картина поднимает непростые вопросы: что означает «свободный рынок» в эпоху криптовалют, насколько справедлив суд, когда государству нужен показательный процесс, и где заканчивается идеология свободы и начинается коммерция. История показана глазами стороны защиты и прокурора, а закадровый текст читает Киану Ривз.", "en": "A documentary about the trial of Ross Ulbricht, founder of Silk Road — the bitcoin darknet market where everything from weed to weapons was traded. It raises uncomfortable questions: what a 'free market' means in the age of crypto, how fair a trial is when the state wants a showcase, and where the ideology of freedom ends and trading begins. Told through the lens of the defense and the figure of the prosecutor; narrated by Keanu Reeves."}, "genres": ["documentary"], "year": 2015, "imdbId": "tt3312868", "imdbRating": 6.9, "kpId": 808328, "kpRating": 6.9, "poster": "static/posters/deepweb_doc_poster.webp"}, {"type": "documentary", "titleEn": "DSKNECTD", "titleRu": "Технологии, которые нас меняют", "desc": {"ru": "Эксперимент: несколько семей соглашаются полностью отказаться от интернета на две недели. Первые дни приносят раздражительность, затем следуют неожиданные разговоры за ужином и переосмысление того, что в телефоне было полезным инструментом, а что — способом спрятаться от реальности. Параллельно авторы фильма беседуют с нейробиологами и психологами о механизмах зависимости от лайков и уведомлений. Это простое и честное кино о грани между тем, чтобы оставаться на связи, и жизнью внутри чужой ленты новостей.", "en": "An experiment: several families agree to go fully offline for two weeks. The first days bring irritability, then unexpected dinner conversations, then a reassessment of what in the phone was a tool and what was a hiding place. Alongside, the film talks to neuroscientists and psychologists about the mechanics of dependence on likes and notifications. A simple, honest film about the border between 'being connected' and 'living inside someone else's feed'."}, "genres": ["documentary"], "year": 2013, "imdbId": "tt2417174", "imdbRating": 6.8, "kpId": 756003, "kpRating": 6.7, "poster": "static/posters/dsknectd_doc_poster.webp"}, {"type": "documentary", "titleEn": "Downloaded", "titleRu": "Скачано", "desc": {"ru": "История Napster — сервиса, который всего за полтора года превратил пиратство в обыденность и фактически уничтожил музыкальную индустрию: от эпохи дешевых компакт-дисков до судебных исков против подростков. Фильм, в котором участвуют Шон Фэннинг и ветераны индустрии (представляющие обе стороны конфликта), передает как азарт гиков, движимых идеей «музыка должна быть бесплатной», так и панику бизнеса, не сумевшего создать iTunes раньше, чем это сделали сами пользователи. Это кино о том, что любая медиаиндустрия существует лишь до тех пор, пока не появится технология, способная ее опередить.", "en": "The story of Napster — the service that made piracy routine in eighteen months and burned the music industry down: from cheap CDs to lawsuits against teenagers. With Sean Fanning and industry veterans on both sides, the film captures the geek thrill of 'music should be free' and the business panic of an industry that could not invent iTunes before its users did. A film about how any media industry lives exactly until the technology that outruns it arrives."}, "genres": ["documentary"], "year": 2013, "imdbId": "tt2033981", "imdbRating": 6.8, "kpId": 615688, "kpRating": null, "poster": "static/posters/downloaded_doc_poster.webp"}], "posterW": 404, "posterH": 600};</script>
