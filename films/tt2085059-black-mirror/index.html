            <p class="film-alt">Black Mirror</p>
            <div class="film-meta">
              <span class="film-meta-item">2011</span>
              <span class="film-meta-item">Драма, Фантастика</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/655800/" target="_blank" rel="noopener noreferrer">Кинопоиск: 8.5 ★</a>

        </div>
            <p class="film-desc">Антология Чарли Брукера о технологиях, доведённых на один шаг дальше: рейтинг социальных оценок как кредитная история, память, которую можно переигрывать, цифровое бессмертие после смерти, насекомые-дроны и виртуальная реальность как тюрьма. Каждый эпизод самостоятелен, и почти каждый предсказал что-то, что потом стало новостью. Кино-прививка от технооптимизма — обязательная для всех, кто работает с технологиями и верит, что «нас это не коснётся».</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Charlie Brooker&#x27;s anthology of technology taken one step further: social ratings as credit scores, memories that can be replayed, digital immortality after death, insect drones, virtual reality as a prison. Every episode stands alone, and almost every one predicted something that later became news. A shot of vaccine against techno-optimism — required for anyone who works with technology and believes &#x27;it will not touch us&#x27;.</p>
            </details>
          </div>
