            <p class="film-desc">Невилл Чамберс, критик и поклонник актрисы Джилл Годдард, выигрывает свидание с ней, но затем получает звонок от хакера по имени Корд. Тот сообщает, что Джилл похищена, и предоставляет Невиллу доступ к полноценной системе слежения, охватывающей камеры, телефоны, файлы и различные сервисы. Весь фильм зритель наблюдает за происходящим на экране компьютера и вместе с героем оказывается в ловушке, где каждое нажатие клавиши фиксируется системой. Это технотриллер в формате «десктоп-муви», напоминающий о том, что переход по «подозрительной ссылке» — это всегда участие в чужой игре.</p>
            <p class="film-desc film-desc-alt">Neville Chambers, a critic and fan of actress Jill Goddard, wins a date with her — then gets a call from the hacker Chord, who claims Jill has been kidnapped and gives Neville access to a whole surveillance operating system: cameras, phones, files, services. You watch his screen for the entire film — and, together with the hero, get pulled into a trap where every click is logged. A tech thriller in the desktop format about the fact that a &#x27;suspicious link&#x27; is always a role in someone else&#x27;s play.</p>

  <script>window.FILM_PAGE = {"item": {"type": "movie", "titleEn": "Open Windows", "titleRu": "Открытые окна", "desc": {"ru": "Невилл Чамберс, критик и поклонник актрисы Джилл Годдард, выигрывает свидание с ней, но затем получает звонок от хакера по имени Корд. Тот сообщает, что Джилл похищена, и предоставляет Невиллу доступ к полноценной системе слежения, охватывающей камеры, телефоны, файлы и различные сервисы. Весь фильм зритель наблюдает за происходящим на экране компьютера и вместе с героем оказывается в ловушке, где каждое нажатие клавиши фиксируется системой. Это технотриллер в формате «десктоп-муви», напоминающий о том, что переход по «подозрительной ссылке» — это всегда участие в чужой игре.", "en": "Neville Chambers, a critic and fan of actress Jill Goddard, wins a date with her — then gets a call from the hacker Chord, who claims Jill has been kidnapped and gives Neville access to a whole surveillance operating system: cameras, phones, files, services. You watch his screen for the entire film — and, together with the hero, get pulled into a trap where every click is logged. A tech thriller in the desktop format about the fact that a 'suspicious link' is always a role in someone else's play."}, "genres": ["scifi", "crime"], "year": 2014, "imdbId": "tt2409818", "imdbRating": 5.1, "kpId": 712716, "kpRating": 5.3, "poster": "static/posters/openwindows_film_poster.webp"}, "related": [{"type": "movie", "titleEn": "21", "titleRu": "Двадцать одно", "desc": {"ru": "Бен Кэмпбелл, лучший студент-математик в MIT, отчаянно нуждается в деньгах на оплату обучения в Гарварде. Профессор Микки Роза приглашает его в команду, которая обыгрывает казино Лас-Вегаса с помощью подсчета карт: у каждого игрока своя роль, а успех строится на холодном расчете, памяти и железной дисциплине. Чем крупнее выигрыши, тем сильнее Бен погружается в игру — и тем ближе к нему подбирается служба безопасности казино, прекрасно осведомленная о методах карточных игроков. Это история о том, как математика может победить случайность, и о цене такой победы.", "en": "Ben Campbell, the best math student at MIT, desperately needs money for Harvard tuition. Professor Micky Rosa recruits him into a team that beats Las Vegas casinos with card counting: every player has a role, and the winnings rest on cold arithmetic, memory and iron discipline. The bigger the payouts, the deeper Ben sinks into the game — and the closer casino security, which knows everything about counters, gets to him. A story about how math can beat chance, and what that victory costs."}, "genres": ["crime", "drama"], "year": 2008, "imdbId": "tt0478087", "imdbRating": 6.8, "kpId": 195847, "kpRating": 7.7, "poster": "static/posters/21_film_poster.webp"}, {"type": "movie", "titleEn": "H0us3", "titleRu": "Пароль: Хаус", "desc": {"ru": "Испанский хоррор о молодом хакере, для которого взлом систем — способ самоутвердиться. Очередная авантюра приводит его в странный дом, где виртуальная игра перестает быть игрой: опасность становится реальной, а правила начинает диктовать кто-то другой. Фильм обыгрывает иллюзию, знакомую каждому представителю «интернет-поколения» — убежденность в том, что по ту сторону экрана ничто не является «настоящим», — и задается вопросом: где именно заканчивается игра и начинается жизнь?", "en": "A Spanish horror about a young hacker for whom breaking into systems is a way to prove himself. One more stunt leads him to a strange house where the virtual game stops being a game: the danger turns physical and someone else is setting the rules. The film plays with the illusion familiar to every online generation — that behind the screen nothing is 'real' — and asks where exactly the game ends and life begins."}, "genres": ["scifi", "horror"], "year": 2018, "imdbId": "tt9055630", "imdbRating": 5.5, "kpId": 1212316, "kpRating": 6.1, "poster": "static/posters/h0u53_film_poster.webp"}, {"type": "movie", "titleEn": "The Creator", "titleRu": "Создатель", "desc": {"ru": "Постапокалиптическое будущее: после ядерного взрыва в Лос-Анджелесе Запад объявляет войну искусственному интеллекту. Бывший спецагент, потерявший жену, проникает на территорию машин, чтобы найти создателя их нового оружия, — и встречает ребенка, неотличимого от человека, которого машины создали для себя. Визуально впечатляющая научно-фантастическая лента о страхе перед ИИ, пропаганде и вопросе о том, кто на самом деле породил это «чудовище».", "en": "A post-apocalyptic future: after a nuclear blast in Los Angeles the West declares war on artificial intelligence. An ex-agent who lost his wife infiltrates the machines' territory to find the designer of their new weapon — and meets a child, indistinguishable from a human, that the machines built for themselves. Visually lush sci-fi about the fear of AI, propaganda and the question of who really created the 'monster'."}, "genres": ["ai", "scifi"], "year": 2023, "imdbId": "tt11858890", "imdbRating": 6.7, "kpId": 4499408, "kpRating": 6.7, "poster": "static/posters/thecreator_film_poster.webp"}, {"type": "movie", "titleEn": "Tron: Ares", "titleRu": "Трон: Арес", "desc": {"ru": "Сиквел «Трона»: корпорация создает Ареса — совершенного искусственного солдата, перенесенного из цифрового мира в реальный. Задача проста: провести стресс-тестирование ИИ. Но чем дольше Арес существует среди людей, тем чаще он задается вопросами, не предусмотренными его исходным кодом: что такое предназначение, боль и свобода воли? Впечатляющий фильм о первом искусственном разуме, вышедшем за пределы симуляции, — и об этике тех, кто сделал это возможным.", "en": "A sequel to Tron: a corporation builds Ares, a perfect artificial soldier pulled out of the digital world into the real one. The task is simple: stress-test the AI. But the longer Ares exists among people, the more he asks questions his source code never contained: what are purpose, pain and free will? A striking film about the first artificial mind stepping out of the simulation — and the ethics of those who made it possible."}, "genres": ["scifi", "drama"], "year": 2025, "imdbId": "tt6604188", "imdbRating": 6.1, "kpId": 634944, "kpRating": 6.2, "poster": "static/posters/tronares_film_poster.webp"}, {"type": "movie", "titleEn": "Twelve Monkeys", "titleRu": "12 обезьян", "desc": {"ru": "На дворе 2035 год: вирус опустошил поверхность Земли, и остатки человечества живут под землей. Заключенного Джеймса Коула отправляют в прошлое, чтобы добыть образец исходного штамма, однако путешествия во времени разрушают память и рассудок, и в 1990 году его принимают за сумасшедшего. Чем ближе он подбирается к «Армии двенадцати обезьян», тем труднее ему отличить сон и пророчество от реальных воспоминаний. Культовый фильм Терри Гиллиама о временной петле и невозможности что-либо исправить.", "en": "It is 2035: a virus has scorched the surface, and the remnants of humanity live underground. Convict James Cole is sent to the past to collect samples of the original strain — but time travel erodes memory and sanity, and in 1990 he is taken for a madman. The closer he gets to the 'Army of the Twelve Monkeys', the less sure he is of what is dream, prophecy or memory. Terry Gilliam's cult classic about the loop of time and the impossibility of fixing anything."}, "genres": ["scifi", "cyberpunk"], "year": 1995, "imdbId": "tt0114746", "imdbRating": 8.0, "kpId": 502, "kpRating": 7.8, "fav": true, "poster": "static/posters/12monkeys_film_poster.webp"}], "posterW": 407, "posterH": 600};</script>
