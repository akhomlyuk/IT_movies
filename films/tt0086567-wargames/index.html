            <p class="film-desc">Подросток Дэвид Лайтман в поисках новых игр подключается к неизвестному компьютеру и запускает сценарий «Глобальная термоядерная война», не подозревая, что имеет дело с военным суперкомпьютером WOPR, неспособным отличить симуляцию от реальности. Пока генералы лихорадочно ищут коды запуска, машина добросовестно проигрывает все варианты ядерного конфликта и приходит к выводу: «Странная игра. Единственный способ выиграть — не играть». Именно после выхода этого фильма Рейган подписал первую директиву по кибербезопасности — редчайший случай, когда кино буквально изменило государственную политику.</p>
            <p class="film-desc film-desc-alt">Teenager David Lightman, hunting for new games, dials into an unknown computer and starts &#x27;Global Thermonuclear War&#x27; — not knowing it is a military supercomputer, WOPR, which cannot tell a simulation from reality. While generals search for the launch codes, the machine honestly loses every nuclear scenario and concludes: &#x27;A strange game. The only winning move is not to play.&#x27; The film after which Reagan signed the first cybersecurity directive — a rare case of cinema literally changing policy.</p>

  <script>window.FILM_PAGE = {"item": {"type": "movie", "titleEn": "WarGames", "titleRu": "Военные игры", "desc": {"ru": "Подросток Дэвид Лайтман в поисках новых игр подключается к неизвестному компьютеру и запускает сценарий «Глобальная термоядерная война», не подозревая, что имеет дело с военным суперкомпьютером WOPR, неспособным отличить симуляцию от реальности. Пока генералы лихорадочно ищут коды запуска, машина добросовестно проигрывает все варианты ядерного конфликта и приходит к выводу: «Странная игра. Единственный способ выиграть — не играть». Именно после выхода этого фильма Рейган подписал первую директиву по кибербезопасности — редчайший случай, когда кино буквально изменило государственную политику.", "en": "Teenager David Lightman, hunting for new games, dials into an unknown computer and starts 'Global Thermonuclear War' — not knowing it is a military supercomputer, WOPR, which cannot tell a simulation from reality. While generals search for the launch codes, the machine honestly loses every nuclear scenario and concludes: 'A strange game. The only winning move is not to play.' The film after which Reagan signed the first cybersecurity directive — a rare case of cinema literally changing policy."}, "genres": ["thriller", "drama"], "year": 1983, "imdbId": "tt0086567", "imdbRating": 7.1, "kpId": 14840, "kpRating": 7.1, "poster": "static/posters/wargames_film_poster.webp"}, "related": [{"type": "movie", "titleEn": "Antitrust", "titleRu": "Опасная правда", "desc": {"ru": "Майло Хоффман, выпускник Стэнфорда, мечтающий изменить мир с помощью программирования, получает предложение от NURV — мегакорпорации, основанной легендарным Гэри Уинстоном. Неограниченные ресурсы, творческая свобода и культ личности босса — мечта любого программиста. Но всё меняется, когда Майло замечает, что коллеги начинают исчезать, а в работе обнаруживается чужой, украденный код. Это триллер о слепом поклонении основателю, корпоративном шпионаже и о том, какую цену приходится платить, когда ради бонуса при найме и опционов на акции отказываешься от собственных принципов.", "en": "Milo Hoffman, a Stanford graduate dreaming of changing the world with code, gets an offer from NURV, the mega-corp of legendary founder Gary Winston. Top resources, creative freedom, a cult of personality around the boss — a programmer's dream. Until Milo notices colleagues disappearing and someone else's code turning up stolen. A thriller about founder worship, corporate espionage and the price of dropping your principles for a signing bonus and options."}, "genres": ["thriller", "drama"], "year": 2001, "imdbId": "tt0218817", "imdbRating": 6.1, "kpId": 592, "kpRating": 6.7, "poster": "static/posters/antitrust_film_poster.webp"}, {"type": "movie", "titleEn": "Blackhat", "titleRu": "Кибер", "desc": {"ru": "Хакер Николас Хэтэуэй одновременно совершает две атаки: обнуляет фьючерсы на китайской бирже и провоцирует аварию на атомной электростанции. Не имея иного выхода, спецслужбы временно освобождают его, чтобы он помог выследить своего бывшего «коллегу». Майкл Манн уходит от клише о «хакере в капюшоне» и показывает, как кибервойна выглядит на самом деле: цепочки доверия, уязвимости аппаратного обеспечения, подставные фирмы и стоящие в тени государства. Стильный, неспешный и выверенный триллер.", "en": "Hacker Nicholas Hathaway stages two attacks at once: zeroing out futures on a Chinese exchange and triggering an accident at a nuclear plant. With no other options, the agencies temporarily release him to help hunt his former 'colleague'. Michael Mann shoots not the 'hooded hacker' cliché but what cyber warfare really looks like: chains of trust, hardware vulnerabilities, shell companies and states in the shadows. A stylish, slow-burning, precise thriller."}, "genres": ["drama", "thriller"], "year": 2015, "imdbId": "tt2717822", "imdbRating": 5.5, "kpId": 739892, "kpRating": 5.4, "poster": "static/posters/blackhat_film_poster.webp"}, {"type": "movie", "titleEn": "Enemy of the State", "titleRu": "Враг государства", "desc": {"ru": "Адвокату Роберту Дину случайно попадает в руки диск с записью убийства конгрессмена — и в одночасье его жизнь превращается в подобие лабораторного эксперимента: счета заморожены, жена ушла, квартира «зачищена», а системы слежения АНБ отслеживают каждый его шаг в режиме реального времени. Единственный, кто говорит на языке врага, — это параноик и бывший спецагент, ведущий свою игру на той же территории. Это триллер, который в 1998 году казался плодом паранойи, а сегодня читается как руководство по устройству государства тотальной слежки.", "en": "Lawyer Robert Dean is accidentally slipped a disc with footage of a congressman's murder — and overnight his life becomes a lab experiment: accounts frozen, wife gone, apartment sanitized, while NSA surveillance systems track his every move in real time. The only one who speaks the enemy's language is a paranoid ex-agent playing the same game on his home turf. A thriller that looked like paranoia in 1998 and today reads like a manual for the surveillance state."}, "genres": ["thriller", "drama"], "year": 1998, "imdbId": "tt0120660", "imdbRating": 7.3, "kpId": 3954, "kpRating": 7.8, "fav": true, "poster": "static/posters/enemyofthestate_film_poster.webp"}, {"type": "movie", "titleEn": "I.T.", "titleRu": "Искусственный интеллект. Доступ неограничен", "desc": {"ru": "Успешный издатель нанимает ИТ-консультанта Майка. Тот сначала чинит всё, что вышло из строя, а затем принимается исправлять то, о чем его не просили: ноутбук жены, детские аккаунты, домашние камеры видеонаблюдения. Когда герой пытается расторгнуть контракт, выясняется, что человек, имеющий доступ к вашей цифровой жизни, знает её лучше, чем вы сами. Это триллер о новом типе уязвимости: угроза исходит не от внешнего взлома, а от услуг, оказываемых изнутри — причем с чрезмерным усердием.", "en": "A successful publisher hires IT consultant Mike, who first fixes everything that broke — and then starts fixing what he was never asked to: the wife's laptop, the kids' accounts, the home cameras. When the hero tries to end the contract, it turns out a person with access to your digital life knows it better than you do. A thriller about a new kind of vulnerability: not a hack from outside, but service from inside, rendered a little too well."}, "genres": ["thriller", "drama"], "year": 2016, "imdbId": "tt2679552", "imdbRating": 5.5, "kpId": 738189, "kpRating": 5.4, "poster": "static/posters/it2016_film_poster.webp"}, {"type": "movie", "titleEn": "Listening", "titleRu": "Читающий мысли", "desc": {"ru": "Трое неудачников собирают в гараже устройство для чтения мыслей — и почти сразу же обнаруживают, что эта способность имеет свою цену: мысли соседа, девушки или инвестора превращаются в файлы, которые можно открыть и просмотреть. Когда к проекту подключаются корпоративные инвесторы, технологию начинают использовать в целях, о которых ее создатели предпочли бы не думать. Это независимый научно-фантастический фильм о неприкосновенности внутреннего мира — последней территории, до которой еще не добрались цифровые платформы.", "en": "Three losers build a mind-reading device in a garage — and almost instantly discover not just power but a price: every thought of a neighbor, a girlfriend, an investor becomes a file you can open. When corporate investors join the project, the technology is pulled in directions its creators would rather not think about. An independent sci-fi about the privacy of one's own mind — the last territory the platforms have yet to reach."}, "genres": ["thriller", "drama"], "year": 2014, "imdbId": "tt3153582", "imdbRating": 5.6, "kpId": 794783, "kpRating": 5.1, "poster": "static/posters/listening_film_poster.webp"}], "posterW": 392, "posterH": 600};</script>
