            <h1 class="film-title">Имя нам легион: История хактивизма</h1>
            <p class="film-alt">We Are Legion: The Story of the Hacktivists</p>
            <div class="film-meta">
              <span class="film-meta-item">2012</span>
              <span class="film-meta-item">Документальный</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/663064/" target="_blank" rel="noopener noreferrer">Кинопоиск: 7.3 ★</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt2177843/" target="_blank" rel="noopener noreferrer">IMDb: 7.2 ★</a>
        </div>
            <p class="film-desc">История Anonymous — от троллинга на 4chan до DDoS-атак на Церковь саентологии, платежные системы и правительственные сайты. Бывшие участники рассказывают, как из анонимного хаоса выросло движение без лидеров, где каждая акция рождается в ветках чатов, а заканчивается в новостных сводках. Фильм не оправдывает и не осуждает — он демонстрирует механику протеста, у которого впервые в истории нет ни лица, ни адреса.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">The story of Anonymous — from trolling on 4chan to DDoS actions against the Church of Scientology, payment systems and government sites. Former participants explain how a movement without leaders grew out of anonymous chaos, where every action is born in chat threads and dies in the news. The film neither excuses nor condemns — it shows the mechanics of protest that, for the first time in history, has no face and no address.</p>
            </details>
          </div>
