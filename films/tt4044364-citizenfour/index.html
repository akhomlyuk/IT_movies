            <h1 class="film-title">Citizenfour: Правда Сноудена</h1>
            <p class="film-alt">Citizenfour</p>
            <div class="film-meta">
              <span class="film-meta-item">2014</span>
              <span class="film-meta-item">Биография, Документальный</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/843103/" target="_blank" rel="noopener noreferrer">Кинопоиск: 7.3 ★</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt4044364/" target="_blank" rel="noopener noreferrer">IMDb: 8.0 ★</a>
        </div>
            <p class="film-desc">В июне 2013 года в номере гонконгского отеля Лора Пойтрас снимает первые встречи с анонимным источником, выступающим под псевдонимом «Citizenfour» (Гражданин четыре), — Эдвардом Сноуденом, обладателем архивов, раскрывающих масштабы тотальной слежки АНБ. Мы наблюдаем за происходящим в режиме реального времени: принятие решения предать информацию огласке, звонок адвокату, появление первых заголовков в прессе и осознание того, что пути назад уже нет. Фильм, удостоенный премии «Оскар» за лучший документальный фильм, — редкий пример того, как камера оказывается не просто рядом с событиями, а в самом центре их развития.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">In June 2013, in a Hong Kong hotel room, Laura Poitras films the first meetings with an anonymous source signed &#x27;Citizenfour&#x27;: Edward Snowden, carrying archives about the NSA&#x27;s total surveillance. We watch it happen in real time: the decision to go public, the call to a lawyer, the first headlines, and the growing understanding that there is no way back. The Oscar winner for Best Documentary — and a rare case of a camera being not next to the story but inside its unfolding.</p>
            </details>
          </div>
