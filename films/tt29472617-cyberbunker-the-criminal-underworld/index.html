            <p class="meta-row">Документальный · 2023 · История</p>
            <p class="film-desc">В бывшем бункере НАТО, построенном на случай ядерной войны, одна компания размещала серверы, обслуживавшие половину даркнета: ботнеты, торговые площадки, инструменты для обхода цензуры. Этот документальный фильм реконструирует историю многолетней осады, в которой были замешаны полиция, суды, соседи и клиенты, и показывает, как невозможно провести четкую грань между предоставлением хостинга и соучастием в преступлении. Это расследование материального воплощения цифровой преступности: у «облака» всегда есть адрес и входная дверь.</p>
            <p class="film-desc film-desc-alt">In a former NATO bunker built for nuclear war, a company hosted servers for half the darknet: botnets, markets, censorship bypasses. The documentary reconstructs a years-long siege: police, courts, neighbors, clients — and the impossibility of telling where &#x27;hosting services&#x27; end and complicity begins. An investigation into the physical footprint of digital crime: the cloud always has an address and a door.</p>
