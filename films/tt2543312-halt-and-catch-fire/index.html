            <p class="meta-row">Сериал · 2014 · Драма, История</p>
            <p class="film-desc">Техас, 1983 год: бывший менеджер по продажам IBM Джо Макмиллан и талантливый инженер Кэмерон Хау решают создать клон IBM PC, используя метод обратной инженерии, и выпустить его на рынок по более низкой цене. На протяжении четырех сезонов сериал проходит весь технологический путь: клоны ПК, онлайн-сервисы, первая социальная сеть, вирусные игры и выгорание всех, кто их разрабатывает. Это самый честный сериал об IT-индустрии: он рассказывает не о гениях, а о людях, которые платят за прогресс собственной жизнью. Обязателен к просмотру для всех, кто работает в этой сфере.</p>
            <p class="film-desc film-desc-alt">Texas, 1983: former IBM salesman Joe MacMillan and visionary engineer Cameron Howe decide to reverse-engineer the IBM PC and ship it cheaper. Across four seasons the series walks the whole tech path: PC clones, online services, the first social network, viral games and the burnout of everyone building them. The most honest series about the IT industry: not about geniuses but about people paying for progress with their own lives. Required viewing for anyone in the field.</p>
