комства с историей Кремниевой долины.", "en": "A made-for-TV chronicle of the personal computer's birth: from the garage of Jobs and Wozniak to Microsoft intercepting the graphical interface idea. Jobs here is a visionary and a tyrant, Gates a calculating negotiator, and the whole industry a race where the winner is not the one who invented but the one who sold first. One of the best historical films about IT: clear, lively, without hero worship. A perfect entry point into Silicon Valley history."}, "genres": ["history", "drama"], "year": 1999, "imdbId": "tt0168122", "imdbRating": 7.2, "kpId": 95636, "kpRating": 7.9, "poster": "static/posters/piratesofsiliconvalley_film_poster.webp"}, {"type": "movie", "titleEn": "21", "titleRu": "Двадцать одно", "desc": {"ru": "Бен Кэмпбелл, лучший студент-математик в MIT, отчаянно нуждается в деньгах на оплату обучения в Гарварде. Профессор Микки Роза приглашает его в команду, которая обыгрывает казино Лас-Вегаса с помощью подсчета карт: у каждого игрока своя роль, а успех строится на холодном расчете, памяти и железной дисциплине. Чем крупнее выигрыши, тем сильнее Бен погружается в игру — и тем ближе к нему подбирается служба безопасности казино, прекрасно осведомленная о методах карточных игроков. Это история о том, как математика может победить случайность, и о цене такой победы.", "en": "Ben Campbell, the best math student at MIT, desperately needs money for Harvard tuition. Professor Micky Rosa recruits him into a team that beats Las Vegas casinos with card counting: every player has a role, and the winnings rest on cold arithmetic, memory and iron discipline. The bigger the payouts, the deeper Ben sinks into the game — and the closer casino security, which knows everything about counters, gets to him. A story about how math can beat chance, and what that victory costs."}, "genres": ["crime", "drama"], "year": 2008, "imdbId": "tt0478087", "imdbRating": 6.8, "kpId": 195847, "kpRating": 7.7, "poster": "static/posters/21_film_poster.webp"}, {"type": "movie", "titleEn": "Archive", "titleRu": "Мой создатель", "desc": {"ru": "2063 год. Инженер Джордж работает в уединенной лаборатории над прототипом робота и одновременно втайне завершает создание «Архива» — устройства, позволяющего общаться с цифровой копией сознания его покойной жены. Его разрывают противоречивые чувства: привязанность к машине и нежелание отпустить прошлое, а сам прототип, обретающий собственный разум, всё меньше напоминает бездушный механизм и всё больше — живое существо. Сдержанная научно-фантастическая драма о памяти, утрате и различии между копией сознания и реальным человеком.", "en": "The year is 2063: engineer George works in an isolated lab on a robot prototype while secretly finishing the 'Archive' — a device that lets him talk to the digital imprint of his dead wife. Attachment to the machine and the refusal to let go pull in opposite directions, and the prototype with a mind of its own looks less like hardware and more like a living being. A restrained sci-fi about memory, grief and the difference between a copy of consciousness and a person."}, "genres": ["ai", "drama"], "year": 2020, "imdbId": "tt6882604", "imdbRating": 6.4, "kpId": 1055319, "kpRating": 6.7, "poster": "static/posters/archive_film_poster.webp"}, {"type": "movie", "titleEn": "Tron: Ares", "titleRu": "Трон: Арес", "desc": {"ru": "Сиквел «Трона»: корпорация создает Ареса — совершенного искусственного солдата, перенесенного из цифрового мира в реальный. Задача проста: провести стресс-тестирование ИИ. Но чем дольше Арес существует среди людей, тем чаще он задается вопросами, не предусмотренными его исходным кодом: что такое предназначение, боль и свобода воли? Впечатляющий фильм о первом искусственном разуме, вышедшем за пределы симуляции, — и об этике тех, кто сделал это возможным.", "en": "A sequel to Tron: a corporation builds Ares, a perfect artificial soldier pulled out of the digital world into the real one. The task is simple: stress-test the AI. But the longer Ares exists among people, the more he asks questions his source code never contained: what are purpose, pain and free will? A striking film about the first artificial mind stepping out of the simulation — and the ethics of those who made it possible."}, "genres": ["scifi", "drama"], "year": 2025, "imdbId": "tt6604188", "imdbRating": 6.1, "kpId": 634944, "kpRating": 6.2, "poster": "static/posters/tronares_film_poster.webp"}], "posterW": 409, "posterH": 600};</script>
