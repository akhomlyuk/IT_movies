            <h1 class="film-title">Социальная сеть</h1>
            <p class="film-alt">The Social Network</p>
            <div class="film-meta">
              <span class="film-meta-item">2010</span>
              <span class="film-meta-item">Биография, Драма</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/427198/" target="_blank" rel="noopener noreferrer">Кинопоиск: 7.7 ★</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt1285016/" target="_blank" rel="noopener noreferrer">IMDb: 7.8 ★</a>
        </div>
            <p class="film-desc">Осень 2003 года: девятнадцатилетний Марк Цукерберг создает сайт для оценки внешности сокурсниц — спустя полгода проект получает название Facebook и стремительно захватывает студенческие кампусы по всей стране. Финчер рассказывает историю не столько о технологиях, сколько о людях: о разрушенной дружбе, искренней вере в свой продукт и о том, что в стартапах, как и в тронных залах, победителей оценивают не только по качеству программного кода. Сценарий Соркина, в котором переговоры о доле в компании напоминают дуэли, обязателен к ознакомлению для всех, кто говорит: «У меня есть идея для стартапа».</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Fall 2003: nineteen-year-old Mark Zuckerberg writes a site for rating classmates — within six months it is called Facebook and is wrecking campuses across the country. Fincher tells a story not about technology but about people: a friendship broken, genuine belief in the product, and the fact that in startups, as in throne rooms, winners are judged by more than code. Sorkin&#x27;s screenplay, where equity negotiations sound like duels, is required viewing for anyone saying &#x27;I have a startup idea&#x27;.</p>
            </details>
          </div>
