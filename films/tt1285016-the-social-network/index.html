pposite directions, and the prototype with a mind of its own looks less like hardware and more like a living being. A restrained sci-fi about memory, grief and the difference between a copy of consciousness and a person."}, "genres": ["ai", "drama"], "year": 2020, "imdbId": "tt6882604", "imdbRating": 6.4, "kpId": 1055319, "kpRating": 6.7}], "posterW": 405, "posterH": 600};</script>
