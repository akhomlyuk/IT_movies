            <p class="film-desc">Калеб, программист крупнейшей в мире поисковой компании, выигрывает неделю в горной резиденции генерального директора Нейтана. Ему предстоит провести тест Тьюринга с Авой — андроидом, которого Нейтан создал втайне от всех. Каждый разговор здесь — это игра: она изучает его, он изучает её, а за ними обоими через камеры наблюдает третий участник. Ни в чем нельзя быть уверенным: ни в честности теста, ни в свободе испытуемой, ни даже в том, кто здесь человек. Камерный, холодный и невероятно умный фильм о творении, которое хочет остаться самим собой.</p>
            <p class="film-desc film-desc-alt">Caleb, a programmer at the world&#x27;s biggest search company, wins a week at the mountain estate of CEO Nathan — to run a Turing test with Ava, the android Nathan has built in secret. Every conversation is a game: she reads him, he reads her, and the third player watches both through cameras. Nothing can be guaranteed: not the honesty of the test, not the subject&#x27;s freedom, not who here is human. A chamber, cold and very smart film about a creation that would like to remain itself.</p>
