            <p class="film-desc">Нью-Йорк, середина 90-х. Zero Cool — легендарный хакер, попавшийся властям еще в детстве, — переезжает в новый город и сближается с компанией подростков, для которых никнеймы важнее настоящих имен. Команда натыкается на след «вируса Да Винчи» — вредоносной программы, на которой планирует нажиться крупная корпорация, — и за считанные дни превращается из обычных хулиганов в государственных преступников. Снятый настолько стильно, фильм стал манифестом первого поколения интернета: киберпанковские мечты об интерфейсах и кредо о том, что информация должна быть свободной.</p>
            <p class="film-desc film-desc-alt">New York, mid-90s: Zero Cool, a legendary hacker busted as a kid, moves to a new city and falls in with a crew of teenagers whose nicks matter more than passports. The team stumbles onto the &#x27;Da Vinci virus&#x27; — a worm a corporation plans to profit from — and within days turns from pranksters into enemies of the state. Shot so stylishly it became a manifesto for the first internet generation: cyberpunk daydreams of interfaces and the creed that information wants to be free.</p>

  <script>window.FILM_PAGE = {"item": {"type": "movie", "titleEn": "Hackers", "titleRu": "Хакеры", "desc": {"ru": "Нью-Йорк, середина 90-х. Zero Cool — легендарный хакер, попавшийся властям еще в детстве, — переезжает в новый город и сближается с компанией подростков, для которых никнеймы важнее настоящих имен. Команда натыкается на след «вируса Да Винчи» — вредоносной программы, на которой планирует нажиться крупная корпорация, — и за считанные дни превращается из обычных хулиганов в государственных преступников. Снятый настолько стильно, фильм стал манифестом первого поколения интернета: киберпанковские мечты об интерфейсах и кредо о том, что информация должна быть свободной.", "en": "New York, mid-90s: Zero Cool, a legendary hacker busted as a kid, moves to a new city and falls in with a crew of teenagers whose nicks matter more than passports. The team stumbles onto the 'Da Vinci virus' — a worm a corporation plans to profit from — and within days turns from pranksters into enemies of the state. Shot so stylishly it became a manifesto for the first internet generation: cyberpunk daydreams of interfaces and the creed that information wants to be free."}, "genres": ["crime", "drama"], "year": 1995, "imdbId": "tt0113243", "imdbRating": 6.2, "kpId": 4134, "kpRating": 7.1, "fav": true, "poster": "static/posters/hackers_film_poster.webp"}, "related": [{"type": "movie", "titleEn": "21", "titleRu": "Двадцать одно", "desc": {"ru": "Бен Кэмпбелл, лучший студент-математик в MIT, отчаянно нуждается в деньгах на оплату обучения в Гарварде. Профессор Микки Роза приглашает его в команду, которая обыгрывает казино Лас-Вегаса с помощью подсчета карт: у каждого игрока своя роль, а успех строится на холодном расчете, памяти и железной дисциплине. Чем крупнее выигрыши, тем сильнее Бен погружается в игру — и тем ближе к нему подбирается служба безопасности казино, прекрасно осведомленная о методах карточных игроков. Это история о том, как математика может победить случайность, и о цене такой победы.", "en": "Ben Campbell, the best math student at MIT, desperately needs money for Harvard tuition. Professor Micky Rosa recruits him into a team that beats Las Vegas casinos with card counting: every player has a role, and the winnings rest on cold arithmetic, memory and iron discipline. The bigger the payouts, the deeper Ben sinks into the game — and the closer casino security, which knows everything about counters, gets to him. A story about how math can beat chance, and what that victory costs."}, "genres": ["crime", "drama"], "year": 2008, "imdbId": "tt0478087", "imdbRating": 6.8, "kpId": 195847, "kpRating": 7.7}, {"type": "movie", "titleEn": "Minority Report", "titleRu": "Особое мнение", "desc": {"ru": "Вашингтон, 2054 год: система «Особое мнение» (PreCrime), основанная на пророчествах трех «оракулов», предотвращает убийства еще до их совершения. Джон Эндертон, лучший сотрудник этого подразделения, сам становится подозреваемым: оракулы предсказывают, что он убьет человека, которого никогда не встречал. Бежать бессмысленно: его глаза сканируют в каждом магазине, реклама обращается к нему по имени, а механические пауки прочесывают здания. Фильм Стивена Спилберга по мотивам произведения Филипа К. Дика — история о предсказании будущего, неприкосновенности частной жизни и свободе воли.", "en": "Washington, 2054: the PreCrime system, built on prophecies of three 'oracles', stops murders before they happen. John Anderton, the unit's best officer, becomes a suspect himself: the oracles predict he will kill a man he has never met. Running is pointless — his eyes are scanned in every store, ads address him by name, and mechanical spiders comb the buildings. Spielberg's Philip K. Dick adaptation about prediction, privacy and free will."}, "genres": ["crime", "drama"], "year": 2002, "imdbId": "tt0181689", "imdbRating": 7.6, "kpId": 496, "kpRating": 7.7, "fav": true, "poster": "static/posters/minorityreport_film_poster.webp"}, {"type": "movie", "titleEn": "Hacker", "titleRu": "Хакер", "desc": {"ru": "Алекс, иммигрант из Косово, живущий в Нью-Йорке у дяди, — настоящий компьютерный гений. После семейной трагедии ему срочно нужны деньги, и его путь на кривую дорожку начинается с малого: фишинга, взлома систем и погружения в даркнет. Мелкие аферы перерастают в серьезный бизнес, а анонимность в сети становится зависимостью, от которой невозможно отказаться. Это криминальная драма о двух сторонах цифровой эпохи — безграничных возможностях и безнаказанности, — и о том, как она ломает человека, уверенного, что его никогда не найдут.", "en": "Alex, an immigrant from Kosovo living with his uncle in New York, is brilliant with computers. After a family tragedy he needs money, and the way down starts small: phishing, bypassing systems, the darknet. Petty schemes grow into a business, and online anonymity becomes an addiction he cannot quit. A crime drama about the double edge of the digital era — infinite possibility and impunity — and how it breaks a person who believed no one would ever find him."}, "genres": ["crime", "drama"], "year": 2016, "imdbId": "tt3173594", "imdbRating": 6.1, "kpId": 797601, "kpRating": 6.7}, {"type": "movie", "titleEn": "Who Am I", "titleRu": "Кто я", "desc": {"ru": "Берлинский аутсайдер Бенджамин словно невидимка: у него нет ни друзей, ни карьеры, зато есть талант к социальной инженерии. Вместе с тремя такими же неприметными изгоями он создает группу CLAY; их дерзкие акции попадают в мировые новости — и привлекают внимание европейских спецслужб и российского киберпреступника. Следователь, ведущая на них охоту, потеряла семью из-за хакеров, а единственный свидетель, которому она доверяет, совершенно ничего о себе не помнит. Один из лучших фильмов о хакерах: честный рассказ о сообществе, о работе за клавиатурой и о том, что личность — это всего лишь набор данных.", "en": "Berlin outsider Benjamin is invisible: no friends, no career — but a gift for social engineering. With three equally unnoticeable misfits he forms CLAY, whose stunts make world news — and then land on the radar of European intelligence and a Russian cyber criminal. The investigator hunting them lost her family to hackers, and the only witness she believes remembers nothing about himself. One of the best hacker films: honest about the community, about typing on keyboards, and about identity being just data."}, "genres": ["crime", "drama"], "year": 2014, "imdbId": "tt3042408", "imdbRating": 7.4, "kpId": 779602, "kpRating": 7.4, "fav": true, "poster": "static/posters/whoami_film_poster.webp"}], "posterW": 400, "posterH": 600};</script>
