            <h1 class="film-title">Hackers Wanted</h1>
            <div class="film-meta">
              <span class="film-meta-item">2009</span>
              <span class="film-meta-item">Документальный</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/818552/" target="_blank" rel="noopener noreferrer">Кинопоиск: —</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt2292707/" target="_blank" rel="noopener noreferrer">IMDb: 6.5</a>
        </div>
            <p class="film-desc">Документальный фильм о молодых людях, выбравших путь хакера, и о том, что ждет их на этом поприще — от всеобщего признания до тюремного заключения. В центре повествования — история Эдриана Ламо: он взломал сеть The New York Times, добровольно сдался властям, а впоследствии сообщил о действиях Брэдли Мэннинга. Эта этическая неоднозначность делает историю по-настоящему захватывающей: где проходит грань между исследователем, информатором и предателем?</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A documentary about young people who choose the hacker path — and about the system waiting for them on it: everything from applause to prison terms. The central line follows Adrian Lamo, who hacked The New York Times, turned himself in to the authorities — and later reported Bradley Manning. The moral ambiguity makes the story genuinely interesting: where is the border between researcher, informant and traitor?</p>
            </details>
          </div>
