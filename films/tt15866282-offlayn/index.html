            <p class="film-desc">Российский сериал-предостережение: однажды интернет начинает исчезать — сначала сбоят сервисы, затем «гаснут» целые регионы, и привычная жизнь рушится прямо на глазах. Герои — курьер, программист, блогер и другие «цифровые» жители — учатся жить заново: находить людей в офлайне, обмениваться услугами без приложений и решать конфликты словами. Сериал, снятый несколько неумело, но честно, — это история о технологиях как о протезе, который мы перестали замечать.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A Russian cautionary series: one day the internet starts disappearing — first services glitch, then whole regions go dark, and familiar life falls apart on screen. The heroes — a courier, a programmer, a blogger and other &#x27;digital&#x27; residents — learn to live again: finding people offline, exchanging services without an app, resolving conflicts with words. Awkwardly made but honest — a series about technology as a prosthesis we forgot was a prosthesis.</p>
            </details>
