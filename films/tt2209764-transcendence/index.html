            <p class="film-desc">Уилл Кастер, ведущий исследователь в области искусственного интеллекта, получает смертельное ранение от рук представителей движения противников технологий. Его жена и коллега загружают сознание умирающего в квантовый компьютер — и «Уилл» сначала помогает, затем исцеляет, а после создает собственную сеть в пустынном городке с автономной инфраструктурой. Каждый шаг логичен и необратим: где заканчивается исцеление и начинается замещение человечества? Режиссерский дебют оператора Уолли Пфистера — красивая, неспешная притча о технологической сингулярности.</p>
            <p class="film-desc film-desc-alt">Will Caster, a leading AI researcher, is fatally wounded by an anti-technology movement. His wife and colleague upload the dying man&#x27;s mind into a quantum computer — and &#x27;Will&#x27; first helps, then heals, then builds his own network in a desert town with autonomous infrastructure. Every step is logical, every step irreversible: where does healing end and replacing humanity begin? Cinematographer Wally Pfister&#x27;s directorial debut: a beautiful, slow parable about the technological singularity.</p>
