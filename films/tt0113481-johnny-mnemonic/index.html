            <p class="film-desc">2021 год: половина человечества страдает от синдрома ослабления нервной системы, а данные перевозят курьеры с мозговыми имплантатами. В мозг Джонни загружен груз, представляющий огромную ценность для якудза; у него есть всего сутки, чтобы выгрузить 320 гигабайт, прежде чем его мозг сгорит. Экранизация рассказа Уильяма Гибсона, написанного еще до того, как киберпанк оформился в жанр: здесь есть дельфины-хакеры, сетевые пророки и интернет, представляющий собой органический океан. Фильм выглядит несколько неуклюжим и нарочито театральным, но при этом верно передает дух первоисточника.</p>
            <p class="film-desc film-desc-alt">2021: half of humanity suffers from Nerve Attenuation Syndrome, and data is carried by couriers with brain implants. Johnny has uploaded cargo too valuable for the Yakuza — and has one day to drain 320 gigabytes before they burn his brain out. A film take on William Gibson&#x27;s story, written before cyberpunk became a genre: hacker dolphins, network prophets and an internet that is an organic ocean. Clunky, campy — and true to the spirit.</p>
