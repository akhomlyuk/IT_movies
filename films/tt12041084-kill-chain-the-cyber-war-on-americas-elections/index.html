            <p class="film-desc">Расследование, посвященное избирательной инфраструктуре США как потенциальной мишени: сканеры бюллетеней, списки избирателей, сети передачи данных — всё это взаимосвязано и уязвимо. Среди свидетелей — хакеры, сумевшие взломать эти системы за считанные минуты на конференции DEF CON, и официальные лица, оспаривающие их выводы. Трезвый взгляд на механизмы «гибридной войны» и на то, почему «взлом выборов» означает не только «изменение результатов голосования», но и «подрыв доверия к итогам».</p>
            <p class="film-desc film-desc-alt">An investigation into America&#x27;s election infrastructure as a target: ballot scanners, voter rolls, transmission networks — all connected, all vulnerable. Witnesses include hackers who broke into the systems at DEF CON within minutes and officials who dispute their conclusions. A sober look at how &#x27;hybrid warfare&#x27; works — and why &#x27;hacked the election&#x27; means not only &#x27;changed the votes&#x27; but also &#x27;undermined trust in the result&#x27;.</p>
