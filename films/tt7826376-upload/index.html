 {"type": "movie", "titleEn": "Twelve Monkeys", "titleRu": "12 обезьян", "desc": {"ru": "На дворе 2035 год: вирус опустошил поверхность Земли, и остатки человечества живут под землей. Заключенного Джеймса Коула отправляют в прошлое, чтобы добыть образец исходного штамма, однако путешествия во времени разрушают память и рассудок, и в 1990 году его принимают за сумасшедшего. Чем ближе он подбирается к «Армии двенадцати обезьян», тем труднее ему отличить сон и пророчество от реальных воспоминаний. Культовый фильм Терри Гиллиама о временной петле и невозможности что-либо исправить.", "en": "It is 2035: a virus has scorched the surface, and the remnants of humanity live underground. Convict James Cole is sent to the past to collect samples of the original strain — but time travel erodes memory and sanity, and in 1990 he is taken for a madman. The closer he gets to the 'Army of the Twelve Monkeys', the less sure he is of what is dream, prophecy or memory. Terry Gilliam's cult classic about the loop of time and the impossibility of fixing anything."}, "genres": ["scifi", "cyberpunk"], "year": 1995, "imdbId": "tt0114746", "imdbRating": 8.0, "kpId": 502, "kpRating": 7.8, "fav": true, "poster": "static/posters/12monkeys_film_poster.webp"}], "posterW": 400, "posterH": 600};</script>
