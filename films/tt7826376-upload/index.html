            <p class="film-desc">Человечество научилось загружать сознание в цифровой рай — и, как любая услуга, это оказалось платным сервисом с системой микроплатежей. Погибший в аварии Нейтан попадает в «Лейквью» по бюджетному тарифу, но его «ангел» Нора — сотрудница службы поддержки, существующая в виртуальном мире в виде цифрового аватара, — начинает подозревать, что смерть клиента не была случайной. Добрая научно-фантастическая комедия о загробной жизни по подписке, о системных сбоях, платных опциях и человеческой природе в мире, где всё продается и покупается.</p>
            <p class="film-desc film-desc-alt">Humanity learned to upload consciousness into a digital heaven — and, like any service, it turned out to be pay-per-use down to the microtransaction. Killed in a crash, Nathan gets into &#x27;Lakeview&#x27; on a limited plan, but his low-data angel, Nora, begins to suspect the customer&#x27;s death was not accidental. A good-natured sci-fi comedy about afterlife on a subscription, about glitches, paywalls and humanity inside a service where everything is purchasable.</p>
