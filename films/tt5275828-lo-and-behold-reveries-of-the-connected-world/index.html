            <p class="film-desc">Вернер Херцог препарирует интернет в десяти главах: от первого сообщения в сети ARPANET, обрушившего университетскую сеть, до беспилотных автомобилей, угрозы солнечных вспышек и людей, страдающих аллергией на интернет. Формат фильма — беседы с учеными, инженерами и чудаками, ведущиеся с характерной для Херцога серьезностью. Это лучшая картина, в которой сеть предстает не просто как технология, а как стихийная сила природы: одновременно забавная, тревожная и философская.</p>
            <p class="film-desc film-desc-alt">Werner Herzog takes the internet apart in ten chapters: from the first ARPANET message that crashed a university network to self-driving cars, solar flares as a threat, and people suffering from internet allergy. The format — conversations with scientists, engineers and oddballs, delivered with Herzog&#x27;s trademark earnestness. The best film about the network not as technology but as a force of nature: funny, anxious and philosophical at once.</p>

d the US to Belize and turned his life into a borderland story with guns, eccentric claims and runs from the law. Assembled from personal archives and interviews with those around him, the documentary shows not a 'mad genius' but a man who built himself into a brand and became its hostage. A story of how a cybersecurity legend ended up as a plot that cannot be deleted."}, "genres": ["history"], "year": 2022, "imdbId": "tt21379574", "imdbRating": 5.9, "kpId": 5091663, "kpRating": null, "poster": "static/posters/runningwiththedevilthewildworldofjohnmcafee_doc_poster.webp"}], "posterW": 406, "posterH": 600};</script>
