            <h1 class="film-title">War for the Web</h1>
            <div class="film-meta">
              <span class="film-meta-item">2015</span>
              <span class="film-meta-item">Документальный</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/681796/" target="_blank" rel="noopener noreferrer">Кинопоиск: —</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt2390367/" target="_blank" rel="noopener noreferrer">IMDb: 7.0 ★</a>
        </div>
            <p class="film-desc">Документальный фильм о том, кому принадлежит интернет и кто устанавливает его правила: телекоммуникационным гигантам, государственным регуляторам, ICANN, волонтерам из IETF — и нам, пользователям. Съемки охватывают всё: от подводных кабелей и дата-центров до слушаний по вопросам сетевого нейтралитета. Это своего рода «карта сил», полезная для всех, кто хочет понять, почему интернет устроен именно так и какие решения принимаются вне поля нашего зрения.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A documentary about who owns the internet and who makes its rules: telecom giants, government regulators, ICANN, the IETF volunteers — and us, the users. Filming runs from undersea cables and data centers to net neutrality hearings. A useful &#x27;map of power&#x27; for anyone who wants to understand why the internet works the way it does — and which decisions are made outside our field of view.</p>
            </details>
          </div>
