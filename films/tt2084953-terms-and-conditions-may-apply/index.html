          <div class="film-info">
            <p class="meta-row">Документальный · 2013 · Документальный</p>
            <p class="film-desc">Документальный фильм о том, что мы подписываем, не читая: какой объем текста содержится в пользовательских соглашениях, как меняются их условия после принятия и какие данные при этом собираются. На примере истории компании Navizon, политики использования файлов cookie и комментариев исследователя Орина Керра фильм демонстрирует, что сегодня вопросы конфиденциальности сводятся к договорам, которые никто не читает. Это удачный баланс между позициями «это паранойя» и «мы ничего не можем с этим поделать».</p>
            <p class="film-desc film-desc-alt">A documentary about what we sign without reading: how much text sits in user agreements, how terms change after you accept them, and what data is collected meanwhile. Through the story of Navizon, &#x27;smart&#x27; cookie policies and scholar Orin Kerr, the film shows that privacy today is a matter of contracts nobody reads. A good middle ground between &#x27;that&#x27;s paranoia&#x27; and &#x27;there is nothing we can do&#x27;.</p>
