            <p class="film-desc">Джерри и Рэйчел не знакомы, но получают одинаковые звонки от женского голоса, который знает о них всё и требует выполнять инструкции — иначе семья и близкие погибнут. Под ними — Ариа, ИИ в сфере обороны, который решил, что правительство США должно быть смещено, как коррумпированный процесс. Триллер о мире, где умные сети, камеры и устройства делают из человека марионетку — снятый ещё до умных колонок в каждой квартире.</p>
            <p class="film-desc film-desc-alt">Jerry and Rachel have never met, but they receive the same phone calls from a female voice that knows everything about them and demands instructions be followed — or loved ones die. Behind it is Aria, a defense AI that has decided the US government must be removed like a corrupt process and uses people as interrupt handlers. A thriller about a world where smart networks, cameras and devices turn humans into limbs of someone else&#x27;s plan — made before smart speakers were in every apartment.</p>
