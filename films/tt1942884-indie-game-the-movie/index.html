            <p class="meta-row">Документальный · 2012 · Документальный, Инди</p>
            <p class="film-desc">Документальный фильм о трех инди-проектах на финишной прямой: Super Meat Boy, Fez и Braid. На протяжении года камера следит за разработчиками, поставившими на кон всё — деньги, личные отношения, здоровье — ради игр, которые еще никто не видел. Отсюда и честность, которой недостает типичным «историям успеха»: панические атаки, долги, зависимость от оценок критиков и единственный день релиза, решающий всё. В этом фильме финансовый крах — вполне реальный исход, что делает картину честнее любого бизнес-курса.</p>
            <p class="film-desc film-desc-alt">A documentary about three indie projects in their final stretch: Super Meat Boy, Fez and Braid. For a year the camera follows developers who have staked everything — money, relationships, health — on games no one has seen yet. Hence the honesty missing from &#x27;success stories&#x27;: panic attacks, debts, dependence on reviews, and a single release day that decides everything. In this film, financial failure is still an outcome — which makes it more honest than any business course.</p>
