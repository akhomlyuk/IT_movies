            <p class="film-desc">Документальный фильм о трех инди-проектах на финишной прямой: Super Meat Boy, Fez и Braid. На протяжении года камера следит за разработчиками, поставившими на кон всё — деньги, личные отношения, здоровье — ради игр, которые еще никто не видел. Отсюда и честность, которой недостает типичным «историям успеха»: панические атаки, долги, зависимость от оценок критиков и единственный день релиза, решающий всё. В этом фильме финансовый крах — вполне реальный исход, что делает картину честнее любого бизнес-курса.</p>
            <p class="film-desc film-desc-alt">A documentary about three indie projects in their final stretch: Super Meat Boy, Fez and Braid. For a year the camera follows developers who have staked everything — money, relationships, health — on games no one has seen yet. Hence the honesty missing from &#x27;success stories&#x27;: panic attacks, debts, dependence on reviews, and a single release day that decides everything. In this film, financial failure is still an outcome — which makes it more honest than any business course.</p>

 Stallman's idea to Linus Torvalds's Linux — and to the moment open source became the backbone of corporate infrastructure. Interviews with Torvalds, Eric Raymond, Bruce Perens and others show how 'hippies with a GPL license' won not through ideology but through code quality. Required viewing for everyone who uses Linux, Git and everything open — and wants to know where it all came from."}, "genres": ["indie"], "year": 2001, "imdbId": "tt0308808", "imdbRating": 7.2, "kpId": 13343, "kpRating": 7.2, "fav": true, "poster": "static/posters/revos_doc_poster.webp"}, {"type": "movie", "titleEn": "21", "titleRu": "Двадцать одно", "desc": {"ru": "Бен Кэмпбелл, лучший студент-математик в MIT, отчаянно нуждается в деньгах на оплату обучения в Гарварде. Профессор Микки Роза приглашает его в команду, которая обыгрывает казино Лас-Вегаса с помощью подсчета карт: у каждого игрока своя роль, а успех строится на холодном расчете, памяти и железной дисциплине. Чем крупнее выигрыши, тем сильнее Бен погружается в игру — и тем ближе к нему подбирается служба безопасности казино, прекрасно осведомленная о методах карточных игроков. Это история о том, как математика может победить случайность, и о цене такой победы.", "en": "Ben Campbell, the best math student at MIT, desperately needs money for Harvard tuition. Professor Micky Rosa recruits him into a team that beats Las Vegas casinos with card counting: every player has a role, and the winnings rest on cold arithmetic, memory and iron discipline. The bigger the payouts, the deeper Ben sinks into the game — and the closer casino security, which knows everything about counters, gets to him. A story about how math can beat chance, and what that victory costs."}, "genres": ["crime", "drama"], "year": 2008, "imdbId": "tt0478087", "imdbRating": 6.8, "kpId": 195847, "kpRating": 7.7}, {"type": "movie", "titleEn": "Ghost in the Shell", "titleRu": "Призрак в доспехах", "desc": {"ru": "В недалеком будущем грань между человеком и программой практически стирается. Майор — оперативник с полностью кибернетическим телом — охотится на хакера, который взламывает не компьютеры, а человеческий разум. Каждая новая зацепка заставляет ее усомниться в собственной личности: кто она такая, если почти все в ней можно заменить, а воспоминания — загрузить извне? Игровая экранизация легендарной манги Масамунэ Сиро, поднимающая вопросы о памяти, душе и праве распоряжаться собственным сознанием.", "en": "In the near future the line between a person and a program is almost gone. The Major, an operative with a fully cybernetic body, hunts a hacker who breaks into human minds instead of computers. Every clue shakes her own identity: who is she if nearly everything in her is replaceable and memories can be uploaded from outside? A live-action take on Masamune Shirow's legendary manga about memory, the soul and the right to one's own consciousness."}, "genres": ["ai", "cyberpunk"], "year": 2017, "imdbId": "tt1219827", "imdbRating": 6.3, "kpId": 843789, "kpRating": 6.4}, {"type": "movie", "titleEn": "H0us3", "titleRu": "Пароль: Хаус", "desc": {"ru": "Испанский хоррор о молодом хакере, для которого взлом систем — способ самоутвердиться. Очередная авантюра приводит его в странный дом, где виртуальная игра перестает быть игрой: опасность становится реальной, а правила начинает диктовать кто-то другой. Фильм обыгрывает иллюзию, знакомую каждому представителю «интернет-поколения» — убежденность в том, что по ту сторону экрана ничто не является «настоящим», — и задается вопросом: где именно заканчивается игра и начинается жизнь?", "en": "A Spanish horror about a young hacker for whom breaking into systems is a way to prove himself. One more stunt leads him to a strange house where the virtual game stops being a game: the danger turns physical and someone else is setting the rules. The film plays with the illusion familiar to every online generation — that behind the screen nothing is 'real' — and asks where exactly the game ends and life begins."}, "genres": ["scifi", "horror"], "year": 2018, "imdbId": "tt9055630", "imdbRating": 5.5, "kpId": 1212316, "kpRating": 6.1}], "posterW": 405, "posterH": 600};</script>
