            <p class="film-desc">2063 год. Инженер Джордж работает в уединенной лаборатории над прототипом робота и одновременно втайне завершает создание «Архива» — устройства, позволяющего общаться с цифровой копией сознания его покойной жены. Его разрывают противоречивые чувства: привязанность к машине и нежелание отпустить прошлое, а сам прототип, обретающий собственный разум, всё меньше напоминает бездушный механизм и всё больше — живое существо. Сдержанная научно-фантастическая драма о памяти, утрате и различии между копией сознания и реальным человеком.</p>
            <p class="film-desc film-desc-alt">The year is 2063: engineer George works in an isolated lab on a robot prototype while secretly finishing the &#x27;Archive&#x27; — a device that lets him talk to the digital imprint of his dead wife. Attachment to the machine and the refusal to let go pull in opposite directions, and the prototype with a mind of its own looks less like hardware and more like a living being. A restrained sci-fi about memory, grief and the difference between a copy of consciousness and a person.</p>
