            <p class="film-desc">Антиутопия, в которой время стало единственной валютой: люди перестают стареть в 25 лет, и за каждую последующую минуту приходится платить — будь то чашка кофе, поездка в автобусе или аренда жилья. Уилл Салас из гетто получает в наследство целый век от богача, уставшего от вечной жизни, — и начинается охота за состоянием, которое невозможно отобрать у мертвеца. Это фантастическая история о мире, где бедняки умирают молодыми, а богачи копят столетия, — метафора экономики, превращающей саму жизнь в ресурс.</p>
            <p class="film-desc film-desc-alt">A dystopia where time is the only currency: people stop aging at 25, and every minute after that is paid for — a coffee, a bus ride, rent. Will Salas from the ghetto inherits a century of time from a rich man tired of eternity, and the hunt begins: wealth that cannot be taken from a corpse. Sci-fi about a world where the poor die young and the rich have banked centuries — a metaphor for an economy that turns life itself into a resource.</p>
