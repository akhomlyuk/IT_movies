          <div class="film-info">
            <h1 class="film-title">Эра ИИ</h1>
            <p class="film-alt">The Age of A.I.</p>
            <div class="film-meta">
              <span class="film-meta-item">2019</span>
              <span class="film-meta-item">Документальный</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/1161421/" target="_blank" rel="noopener noreferrer">Кинопоиск: —</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt8421554/" target="_blank" rel="noopener noreferrer">IMDb: 7.8 ★</a>
        </div>
            <p class="film-desc">Сериал из восьми эпизодов, который ведет Роберт Дауни-младший, рассказывает о том, как искусственный интеллект уже меняет нашу жизнь: нейроинтерфейсы для парализованных людей, компьютерное зрение для незрячих, использование дронов в сельском хозяйстве, роботы-компаньоны и многое другое. Формат «одна история на серию» работает лучше, чем абстрактные рассуждения: технологии показаны через призму судеб людей, которые ими пользуются. Это популярный, но содержательный материал для всех, кто хочет разобраться в сути дискуссий вокруг искусственного интеллекта.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">An eight-episode series hosted by Robert Downey Jr. on how AI is already changing lives: neural interfaces for the paralyzed, computer vision for the blind, drone farming, robot companions and more. The one-story-per-episode format works better than abstractions: technology is shown through the people receiving it. A popular but substantive entry point for anyone who wants to understand what the AI debate is about.</p>
            </details>
          </div>
