            <h1 class="film-title">Версия 1.0</h1>
            <p class="film-alt">One Point O</p>
            <div class="film-meta">
              <span class="film-meta-item">2004</span>
              <span class="film-meta-item">Триллер, Фантастика</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/24773/" target="_blank" rel="noopener noreferrer">Кинопоиск: 6.4</a>

            <p class="film-desc">Саймон Джозеф живет в квартире-капсуле, пишет код для клиентов и никогда не выходит из дома без веской причины. Всё начинается с пустых банок из-под джина в холодильнике и загадочных обновлений, устанавливающихся самостоятельно, а заканчивается тем, что Саймон в рамках «добровольных» соглашений оформляет подписку, отдавая данные о собственном теле. Это нуарная научная фантастика о корпоративном контроле над потреблением и подписке как форме кабалы — произведение, созданное задолго до того, как подобная модель стала привычной практикой в ​​бизнесе.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Simon Joseph lives in a capsule apartment, codes for clients and never leaves home without a reason. It starts with empty gin cans in the fridge, continues with mysterious updates that install themselves — and ends with Simon subscribing away data of his own body in &#x27;voluntary&#x27; agreements. A noir sci-fi about corporate control of consumption and the subscription as a form of indenture, made long before that became an ordinary business model.</p>
            </details>
          </div>
