            <p class="film-desc">В результате кибератаки на американскую инфраструктуру выходят из строя светофоры, фондовая биржа, электросети — а в конечном счете и всё остальное. Детектив Джон Макклейн — человек «аналоговой» закалки в цифровом мире — должен доставить хакера, выступающего свидетелем, через охваченный хаосом город. Фильм нарочито утрирует уязвимости («fire sale» — каскадный сбой всех систем), но главная мысль серьёзна: цивилизация, построенная на электричестве и сети, падает за часы. Отличное развлекательное кино, затрагивающее при этом важную тему критически важной инфраструктуры.</p>
            <p class="film-desc film-desc-alt">A cyber attack on American infrastructure takes down traffic lights, the stock exchange, power grids — and eventually everything. Detective John McClane, an analog man in a digital world, must deliver a hacker witness across a burning city. The film deliberately exaggerates the vulnerabilities (a &#x27;fire sale&#x27; cascading every system at once), but the core idea is serious: a civilization built on electricity and networks falls within hours. Great popcorn with a real layer about critical infrastructure.</p>

  <script>window.FILM_PAGE = {"item": {"type": "movie", "titleEn": "Live Free or Die Hard", "titleRu": "Крепкий орешек 4.0", "desc": {"ru": "В результате кибератаки на американскую инфраструктуру выходят из строя светофоры, фондовая биржа, электросети — а в конечном счете и всё остальное. Детектив Джон Макклейн — человек «аналоговой» закалки в цифровом мире — должен доставить хакера, выступающего свидетелем, через охваченный хаосом город. Фильм нарочито утрирует уязвимости («fire sale» — каскадный сбой всех систем), но главная мысль серьёзна: цивилизация, построенная на электричестве и сети, падает за часы. Отличное развлекательное кино, затрагивающее при этом важную тему критически важной инфраструктуры.", "en": "A cyber attack on American infrastructure takes down traffic lights, the stock exchange, power grids — and eventually everything. Detective John McClane, an analog man in a digital world, must deliver a hacker witness across a burning city. The film deliberately exaggerates the vulnerabilities (a 'fire sale' cascading every system at once), but the core idea is serious: a civilization built on electricity and networks falls within hours. Great popcorn with a real layer about critical infrastructure."}, "genres": ["thriller", "action"], "year": 2007, "imdbId": "tt0337978", "imdbRating": 7.1, "kpId": 9544, "kpRating": 7.3, "poster": "static/posters/livefreeordiehard_film_poster.webp"}, "related": [{"type": "movie", "titleEn": "Eagle Eye", "titleRu": "На крючке", "desc": {"ru": "Джерри и Рэйчел не знакомы, но получают одинаковые звонки от женского голоса, который знает о них всё и требует выполнять инструкции — иначе семья и близкие погибнут. Под ними — Ариа, ИИ в сфере обороны, который решил, что правительство США должно быть смещено, как коррумпированный процесс. Триллер о мире, где умные сети, камеры и устройства делают из человека марионетку — снятый ещё до умных колонок в каждой квартире.", "en": "Jerry and Rachel have never met, but they receive the same phone calls from a female voice that knows everything about them and demands instructions be followed — or loved ones die. Behind it is Aria, a defense AI that has decided the US government must be removed like a corrupt process and uses people as interrupt handlers. A thriller about a world where smart networks, cameras and devices turn humans into limbs of someone else's plan — made before smart speakers were in every apartment."}, "genres": ["thriller", "action"], "year": 2008, "imdbId": "tt1059786", "imdbRating": 6.6, "kpId": 387477, "kpRating": 7.4, "poster": "static/posters/eagleeye_film_poster.webp"}, {"type": "movie", "titleEn": "Firewall", "titleRu": "Огненная стена", "desc": {"ru": "Джек Стэнфилд, начальник службы безопасности банка, управляет системой, считающейся неприступной. Преступники изучили его жизнь и нашли уязвимое место — его семью взяли в заложники, и теперь Джек должен перевести 100 миллионов долларов так, чтобы никто этого не заметил. Удачная сценарная деталь: герой побеждает не благодаря героическим подвигам, а используя свои профессиональные инструменты — сканер на базе iPod, записанный диск и знание протоколов. Это процедуральный триллер о том, что самый надежный брандмауэр выстраивается вокруг человека, а не сети.", "en": "Jack Stanfield, a bank's chief of security, runs a system considered impenetrable. The criminals have studied his life and picked the vulnerability in him: family held hostage, and Jack must move 100 million dollars so no one notices. A nice script detail — the hero wins not by heroism but with the tools of his profession: an iPod scanner, a burned disc, knowledge of protocols. A procedural thriller about the fact that the strongest firewall is built around a person, not a network."}, "genres": ["thriller", "action"], "year": 2006, "imdbId": "tt0408345", "imdbRating": 5.8, "kpId": 81607, "kpRating": 6.3, "poster": "static/posters/firewall_film_poster.webp"}, {"type": "movie", "titleEn": "Gamer", "titleRu": "Геймер", "desc": {"ru": "В мире игры Slayers миллионы людей управляют телами других людей, подобно игровым персонажам: заключенные становятся аватарами в обмен на возможное помилование. Создатель системы Кен Касл готовит следующий этап: игру без внешнего управления, где люди свободны, но при этом послушны, поскольку находятся в зависимости. Джерард Батлер пробивается к создателю сквозь шумный, дерзкий и залитый неоном мир. Это сатира на киберспорт, стриминг и экономику внимания — неприглядная и безумная, но честная в главном: зависимость от чужого взгляда — это и есть контроль.", "en": "In the world of the game Slayers, millions control other people's bodies like game characters: convicts become avatars in exchange for possible clemency. Ken Castle, the system's creator, readies the next step: Slayers without control, where people are free yet obedient, because addicted. Gerard Butler fights his way to the creator through a loud, brash, neon-soaked world. A satire on esports, streaming and the attention economy — ugly and unhinged, but honest where it matters: addiction to someone else's gaze is control."}, "genres": ["thriller", "action"], "year": 2009, "imdbId": "tt1034032", "imdbRating": 5.7, "kpId": 325393, "kpRating": 6.6, "poster": "static/posters/gamer_film_poster.webp"}, {"type": "movie", "titleEn": "Sneakers", "titleRu": "Тихушники", "desc": {"ru": "Мартин Брайс — благородный взломщик с темным прошлым, возглавляющий команду, которая проверяет банковские системы безопасности на уязвимости. К ним в руки попадает «черный ящик», способный взломать любой код, — и за устройством начинают охоту ЦРУ, мафия и старые знакомые. Это эталонный фильм о хакерах: здесь есть сплоченная команда, социальная инженерия, манипуляции с магнитными картами и та самая легендарная фраза о том, что миром правят не оружие, энергия или деньги, а крошечные фрагменты данных. Умный и душевный триллер о криптографии и доверии.", "en": "Martin Brice, a noble breaker with a past, now leads a team that audits banks' security for weak points. A 'black box' that decrypts every code falls into their hands — and the CIA, the mob and old comrades all come for it. The prototype of every 'pentester' movie: the crew, social engineering, magstripes, and the legendary line that the world is no longer run by weapons, energy or money — but by little bits of data. A smart, warm thriller about cryptography and trust."}, "genres": ["thriller", "action"], "year": 1992, "imdbId": "tt0105435", "imdbRating": 7.1, "kpId": 2035, "kpRating": 6.7, "poster": "static/posters/sneakers_film_poster.webp"}, {"type": "movie", "titleEn": "Virtuosity", "titleRu": "Виртуозность", "desc": {"ru": "Для подготовки полицейских был создан SID 6.7 — виртуальный преступник, «собранный» из психологических портретов реальных серийных убийц. Он неизменно побеждает в учебных симуляциях, поскольку ему нечего терять, — и вскоре обретает физическое тело из керамики в реальном мире. Бывший полицейский Паркер Барнс, чья семья погибла из-за ошибки искусственного интеллекта, — единственный, кто понимает логику этого «цифрового» преступника, и единственный, кому поручено его уничтожить. Боевик середины 90-х, в котором виртуальная реальность встречается с генной инженерией: Дензел Вашингтон охотится за «операционной системой» в облике Рассела Кроу.", "en": "To train police forces, SID 6.7 is built — a virtual criminal assembled from the personality profiles of serial killers. He wins the training scenarios because he has nothing to lose — and is promptly given a ceramic body in the real world. Ex-cop Parker Barnes, who lost his family to an AI error, is the only one who understands the 'digital' criminal's logic — and the only one authorized to kill him. A mid-90s actioner about VR meeting genetics, with Denzel Washington chasing Russell Crowe's operating system."}, "genres": ["thriller", "action"], "year": 1995, "imdbId": "tt0114857", "imdbRating": 5.5, "kpId": 5247, "kpRating": 6.1, "poster": "static/posters/virtuosity_film_poster.webp"}], "posterW": 417, "posterH": 600};</script>
