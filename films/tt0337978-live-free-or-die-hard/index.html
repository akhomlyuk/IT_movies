            <h1 class="film-title">Крепкий орешек 4.0</h1>
            <p class="film-alt">Live Free or Die Hard</p>
            <div class="film-meta">
              <span class="film-meta-item">2007</span>
              <span class="film-meta-item">Боевик, Триллер</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/9544/" target="_blank" rel="noopener noreferrer">Кинопоиск: 7.3 ★</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt0337978/" target="_blank" rel="noopener noreferrer">IMDb: 7.1 ★</a>
        </div>
            <p class="film-desc">В результате кибератаки на американскую инфраструктуру выходят из строя светофоры, фондовая биржа, электросети — а в конечном счете и всё остальное. Детектив Джон Макклейн — человек «аналоговой» закалки в цифровом мире — должен доставить хакера, выступающего свидетелем, через охваченный хаосом город. Фильм нарочито утрирует уязвимости («fire sale» — каскадный сбой всех систем), но главная мысль серьёзна: цивилизация, построенная на электричестве и сети, падает за часы. Отличное развлекательное кино, затрагивающее при этом важную тему критически важной инфраструктуры.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A cyber attack on American infrastructure takes down traffic lights, the stock exchange, power grids — and eventually everything. Detective John McClane, an analog man in a digital world, must deliver a hacker witness across a burning city. The film deliberately exaggerates the vulnerabilities (a &#x27;fire sale&#x27; cascading every system at once), but the core idea is serious: a civilization built on electricity and networks falls within hours. Great popcorn with a real layer about critical infrastructure.</p>
            </details>
          </div>
