            <p class="film-desc">Сиквел «Трона»: корпорация создает Ареса — совершенного искусственного солдата, перенесенного из цифрового мира в реальный. Задача проста: провести стресс-тестирование ИИ. Но чем дольше Арес существует среди людей, тем чаще он задается вопросами, не предусмотренными его исходным кодом: что такое предназначение, боль и свобода воли? Впечатляющий фильм о первом искусственном разуме, вышедшем за пределы симуляции, — и об этике тех, кто сделал это возможным.</p>
            <p class="film-desc film-desc-alt">A sequel to Tron: a corporation builds Ares, a perfect artificial soldier pulled out of the digital world into the real one. The task is simple: stress-test the AI. But the longer Ares exists among people, the more he asks questions his source code never contained: what are purpose, pain and free will? A striking film about the first artificial mind stepping out of the simulation — and the ethics of those who made it possible.</p>
