            <p class="film-desc">Тематический парк, где андроиды-«хозяева» раз за разом исполняют любые желания гостей, — пока внутри цикличной программы не пробуждается нечто, напоминающее свободу воли. Долорес, Мейв и другие марионетки начинают замечать собственные сценарии, и правила игры меняются: создатели запускают «нарратив», призванный выявить, кто в этом мире по-настоящему жив. Философская научная фантастика о природе сознания, замкнутом цикле и о том, как всё оказывается сложнее, чем представлял себе наивный творец.</p>
            <p class="film-desc film-desc-alt">A theme park where android &#x27;hosts&#x27; fulfil guests&#x27; every desire on a loop — until something resembling free will wakes up inside a memory loop. Dolores, Maeve and other puppets begin to notice their own scripts, and the game flips: the creators launch a &#x27;narrative&#x27; meant to reveal who in this world is genuinely alive. Philosophical sci-fi about consciousness, the dead loop and things turning out harder than the simple creator envisioned.</p>
