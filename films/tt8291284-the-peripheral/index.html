            <p class="film-desc">Экранизация романа Уильяма Гибсона. Флинн, живущая в недалеком будущем, дистанционно управляет роботизированным телом-аватаром («периферией») в виртуальной реальности, напоминающей игру, — пока не становится свидетельницей преступления, произошедшего не в игре, а в 2099 году. Выясняется, что эти аватары связывают разные временные пласты, а город будущего тайно решает, какой из наших миров сохранится, а какой будет «отключен». Это насыщенная научно-фантастическая история о временных линиях, которые можно разветвить, но невозможно удалить.</p>
            <p class="film-desc film-desc-alt">An adaptation of William Gibson&#x27;s novel. Flynne, who lives in the near future, remotely pilots a robotic &#x27;peripheral&#x27; body in what seems like a game — until she witnesses a crime that happened not in a game but in 2099. The avatars, it turns out, connect the ends of time, and a future city quietly decides which of our worlds gets kept and which gets &#x27;unplugged&#x27;. A dense sci-fi mystery about timelines you can fork but never delete.</p>

g a game: the danger turns physical and someone else is setting the rules. The film plays with the illusion familiar to every online generation — that behind the screen nothing is 'real' — and asks where exactly the game ends and life begins."}, "genres": ["scifi", "horror"], "year": 2018, "imdbId": "tt9055630", "imdbRating": 5.5, "kpId": 1212316, "kpRating": 6.1}, {"type": "movie", "titleEn": "The Creator", "titleRu": "Создатель", "desc": {"ru": "Постапокалиптическое будущее: после ядерного взрыва в Лос-Анджелесе Запад объявляет войну искусственному интеллекту. Бывший спецагент, потерявший жену, проникает на территорию машин, чтобы найти создателя их нового оружия, — и встречает ребенка, неотличимого от человека, которого машины создали для себя. Визуально впечатляющая научно-фантастическая лента о страхе перед ИИ, пропаганде и вопросе о том, кто на самом деле породил это «чудовище».", "en": "A post-apocalyptic future: after a nuclear blast in Los Angeles the West declares war on artificial intelligence. An ex-agent who lost his wife infiltrates the machines' territory to find the designer of their new weapon — and meets a child, indistinguishable from a human, that the machines built for themselves. Visually lush sci-fi about the fear of AI, propaganda and the question of who really created the 'monster'."}, "genres": ["ai", "scifi"], "year": 2023, "imdbId": "tt11858890", "imdbRating": 6.7, "kpId": 4499408, "kpRating": 6.7}, {"type": "movie", "titleEn": "Tron: Ares", "titleRu": "Трон: Арес", "desc": {"ru": "Сиквел «Трона»: корпорация создает Ареса — совершенного искусственного солдата, перенесенного из цифрового мира в реальный. Задача проста: провести стресс-тестирование ИИ. Но чем дольше Арес существует среди людей, тем чаще он задается вопросами, не предусмотренными его исходным кодом: что такое предназначение, боль и свобода воли? Впечатляющий фильм о первом искусственном разуме, вышедшем за пределы симуляции, — и об этике тех, кто сделал это возможным.", "en": "A sequel to Tron: a corporation builds Ares, a perfect artificial soldier pulled out of the digital world into the real one. The task is simple: stress-test the AI. But the longer Ares exists among people, the more he asks questions his source code never contained: what are purpose, pain and free will? A striking film about the first artificial mind stepping out of the simulation — and the ethics of those who made it possible."}, "genres": ["scifi", "drama"], "year": 2025, "imdbId": "tt6604188", "imdbRating": 6.1, "kpId": 634944, "kpRating": 6.2}, {"type": "movie", "titleEn": "Twelve Monkeys", "titleRu": "12 обезьян", "desc": {"ru": "На дворе 2035 год: вирус опустошил поверхность Земли, и остатки человечества живут под землей. Заключенного Джеймса Коула отправляют в прошлое, чтобы добыть образец исходного штамма, однако путешествия во времени разрушают память и рассудок, и в 1990 году его принимают за сумасшедшего. Чем ближе он подбирается к «Армии двенадцати обезьян», тем труднее ему отличить сон и пророчество от реальных воспоминаний. Культовый фильм Терри Гиллиама о временной петле и невозможности что-либо исправить.", "en": "It is 2035: a virus has scorched the surface, and the remnants of humanity live underground. Convict James Cole is sent to the past to collect samples of the original strain — but time travel erodes memory and sanity, and in 1990 he is taken for a madman. The closer he gets to the 'Army of the Twelve Monkeys', the less sure he is of what is dream, prophecy or memory. Terry Gilliam's cult classic about the loop of time and the impossibility of fixing anything."}, "genres": ["scifi", "cyberpunk"], "year": 1995, "imdbId": "tt0114746", "imdbRating": 8.0, "kpId": 502, "kpRating": 7.8, "fav": true, "poster": "static/posters/12monkeys_film_poster.webp"}], "posterW": null, "posterH": null};</script>
