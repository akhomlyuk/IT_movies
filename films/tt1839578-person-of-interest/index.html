            <p class="film-desc">Гениальный программист Гарольд Финч создает для государства «Машину» — систему, предсказывающую теракты на основе данных слежки. Есть нюанс: она фиксирует и обычные преступления, но правительство интересуют лишь масштабные катастрофы, поэтому информация о прочих угрозах остается без внимания. Финч нанимает бывшего спецагента Джона Риза, и вместе они начинают спасать людей, чьи номера система отнесла к категории «некритичных». Сериал, начинавшийся как процедурал, со временем перерос в одну из самых серьезных научно-фантастических историй об искусственном интеллекте, затрагивающую темы тотальной слежки, свободы воли и противостояния двух разумов.</p>
            <p class="film-desc film-desc-alt">Genius programmer Harold Finch builds the state &#x27;the Machine&#x27; — a system that predicts terrorist acts from surveillance data. The catch: it also sees ordinary crimes, but the government only cares about &#x27;catastrophes&#x27;, so the irrelevant numbers go nowhere. Finch hires former agent John Reese, and they start saving the &#x27;non-catastrophic&#x27; numbers. A series that began as a procedural and grew into one of the most serious sci-fi works about AI: surveillance, free will and two rival minds.</p>

  <script>window.FILM_PAGE = {"item": {"type": "series", "titleEn": "Person of Interest", "titleRu": "В поле зрения", "desc": {"ru": "Гениальный программист Гарольд Финч создает для государства «Машину» — систему, предсказывающую теракты на основе данных слежки. Есть нюанс: она фиксирует и обычные преступления, но правительство интересуют лишь масштабные катастрофы, поэтому информация о прочих угрозах остается без внимания. Финч нанимает бывшего спецагента Джона Риза, и вместе они начинают спасать людей, чьи номера система отнесла к категории «некритичных». Сериал, начинавшийся как процедурал, со временем перерос в одну из самых серьезных научно-фантастических историй об искусственном интеллекте, затрагивающую темы тотальной слежки, свободы воли и противостояния двух разумов.", "en": "Genius programmer Harold Finch builds the state 'the Machine' — a system that predicts terrorist acts from surveillance data. The catch: it also sees ordinary crimes, but the government only cares about 'catastrophes', so the irrelevant numbers go nowhere. Finch hires former agent John Reese, and they start saving the 'non-catastrophic' numbers. A series that began as a procedural and grew into one of the most serious sci-fi works about AI: surveillance, free will and two rival minds."}, "genres": ["ai", "drama"], "year": 2011, "imdbId": "tt1839578", "imdbRating": 8.5, "kpId": 582359, "kpRating": 8.0, "fav": true, "poster": "static/posters/personofinterest_series_poster.webp"}, "related": [{"type": "movie", "titleEn": "Archive", "titleRu": "Мой создатель", "desc": {"ru": "2063 год. Инженер Джордж работает в уединенной лаборатории над прототипом робота и одновременно втайне завершает создание «Архива» — устройства, позволяющего общаться с цифровой копией сознания его покойной жены. Его разрывают противоречивые чувства: привязанность к машине и нежелание отпустить прошлое, а сам прототип, обретающий собственный разум, всё меньше напоминает бездушный механизм и всё больше — живое существо. Сдержанная научно-фантастическая драма о памяти, утрате и различии между копией сознания и реальным человеком.", "en": "The year is 2063: engineer George works in an isolated lab on a robot prototype while secretly finishing the 'Archive' — a device that lets him talk to the digital imprint of his dead wife. Attachment to the machine and the refusal to let go pull in opposite directions, and the prototype with a mind of its own looks less like hardware and more like a living being. A restrained sci-fi about memory, grief and the difference between a copy of consciousness and a person."}, "genres": ["ai", "drama"], "year": 2020, "imdbId": "tt6882604", "imdbRating": 6.4, "kpId": 1055319, "kpRating": 6.7, "poster": "static/posters/archive_film_poster.webp"}, {"type": "movie", "titleEn": "21", "titleRu": "Двадцать одно", "desc": {"ru": "Бен Кэмпбелл, лучший студент-математик в MIT, отчаянно нуждается в деньгах на оплату обучения в Гарварде. Профессор Микки Роза приглашает его в команду, которая обыгрывает казино Лас-Вегаса с помощью подсчета карт: у каждого игрока своя роль, а успех строится на холодном расчете, памяти и железной дисциплине. Чем крупнее выигрыши, тем сильнее Бен погружается в игру — и тем ближе к нему подбирается служба безопасности казино, прекрасно осведомленная о методах карточных игроков. Это история о том, как математика может победить случайность, и о цене такой победы.", "en": "Ben Campbell, the best math student at MIT, desperately needs money for Harvard tuition. Professor Micky Rosa recruits him into a team that beats Las Vegas casinos with card counting: every player has a role, and the winnings rest on cold arithmetic, memory and iron discipline. The bigger the payouts, the deeper Ben sinks into the game — and the closer casino security, which knows everything about counters, gets to him. A story about how math can beat chance, and what that victory costs."}, "genres": ["crime", "drama"], "year": 2008, "imdbId": "tt0478087", "imdbRating": 6.8, "kpId": 195847, "kpRating": 7.7, "poster": "static/posters/21_film_poster.webp"}, {"type": "movie", "titleEn": "Ghost in the Shell", "titleRu": "Призрак в доспехах", "desc": {"ru": "В недалеком будущем грань между человеком и программой практически стирается. Майор — оперативник с полностью кибернетическим телом — охотится на хакера, который взламывает не компьютеры, а человеческий разум. Каждая новая зацепка заставляет ее усомниться в собственной личности: кто она такая, если почти все в ней можно заменить, а воспоминания — загрузить извне? Игровая экранизация легендарной манги Масамунэ Сиро, поднимающая вопросы о памяти, душе и праве распоряжаться собственным сознанием.", "en": "In the near future the line between a person and a program is almost gone. The Major, an operative with a fully cybernetic body, hunts a hacker who breaks into human minds instead of computers. Every clue shakes her own identity: who is she if nearly everything in her is replaceable and memories can be uploaded from outside? A live-action take on Masamune Shirow's legendary manga about memory, the soul and the right to one's own consciousness."}, "genres": ["ai", "cyberpunk"], "year": 2017, "imdbId": "tt1219827", "imdbRating": 6.3, "kpId": 843789, "kpRating": 6.4, "poster": "static/posters/ghostintheshell_film_poster.webp"}, {"type": "movie", "titleEn": "The Creator", "titleRu": "Создатель", "desc": {"ru": "Постапокалиптическое будущее: после ядерного взрыва в Лос-Анджелесе Запад объявляет войну искусственному интеллекту. Бывший спецагент, потерявший жену, проникает на территорию машин, чтобы найти создателя их нового оружия, — и встречает ребенка, неотличимого от человека, которого машины создали для себя. Визуально впечатляющая научно-фантастическая лента о страхе перед ИИ, пропаганде и вопросе о том, кто на самом деле породил это «чудовище».", "en": "A post-apocalyptic future: after a nuclear blast in Los Angeles the West declares war on artificial intelligence. An ex-agent who lost his wife infiltrates the machines' territory to find the designer of their new weapon — and meets a child, indistinguishable from a human, that the machines built for themselves. Visually lush sci-fi about the fear of AI, propaganda and the question of who really created the 'monster'."}, "genres": ["ai", "scifi"], "year": 2023, "imdbId": "tt11858890", "imdbRating": 6.7, "kpId": 4499408, "kpRating": 6.7, "poster": "static/posters/thecreator_film_poster.webp"}, {"type": "movie", "titleEn": "Tron: Ares", "titleRu": "Трон: Арес", "desc": {"ru": "Сиквел «Трона»: корпорация создает Ареса — совершенного искусственного солдата, перенесенного из цифрового мира в реальный. Задача проста: провести стресс-тестирование ИИ. Но чем дольше Арес существует среди людей, тем чаще он задается вопросами, не предусмотренными его исходным кодом: что такое предназначение, боль и свобода воли? Впечатляющий фильм о первом искусственном разуме, вышедшем за пределы симуляции, — и об этике тех, кто сделал это возможным.", "en": "A sequel to Tron: a corporation builds Ares, a perfect artificial soldier pulled out of the digital world into the real one. The task is simple: stress-test the AI. But the longer Ares exists among people, the more he asks questions his source code never contained: what are purpose, pain and free will? A striking film about the first artificial mind stepping out of the simulation — and the ethics of those who made it possible."}, "genres": ["scifi", "drama"], "year": 2025, "imdbId": "tt6604188", "imdbRating": 6.1, "kpId": 634944, "kpRating": 6.2, "poster": "static/posters/tronares_film_poster.webp"}], "posterW": 422, "posterH": 600};</script>
