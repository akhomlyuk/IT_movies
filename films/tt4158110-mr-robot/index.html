            <p class="film-desc">Эллиоту Алдерсону — инженеру по кибербезопасности днем ​​и хакеру-мстителю ночью — анархистская группировка fsociety предлагает сделку: уничтожить крупнейший в мире банк, обнулив все долги. Сериал Сэма Эсмейла строится на точности: реальный инструментарий, достоверный вид терминалов, верное понимание социологии сетей и главная истина — взлом системы начинается со взлома самого себя. Четыре сезона, в которых каждое утверждение «неужели это действительно произошло» одновременно подтверждается и опровергается.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Elliot Alderson — a cybersecurity engineer by day and vigilante hacker by night — is offered a deal by the anarchist group fsociety: destroy the world&#x27;s biggest bank by zeroing out all debt. Sam Esmail&#x27;s series is built on precision: a real toolstack, honest terminals, accurate sociology of networks, and the main truth — that hacking a system begins with hacking yourself. Four seasons where every &#x27;did that really happen&#x27; is both confirmed and refuted.</p>
            </details>
