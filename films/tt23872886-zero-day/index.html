            <p class="film-desc">Бывший президент США Джордж Маллен возглавляет расследование серии кибератак, парализовавших движение поездов и самолетов и обрушивших фондовый рынок, — и, возможно, это лишь первая волна. Чем ближе он подбирается к источнику угрозы, тем труднее провести грань между врагом и собственной политической борьбой. Это остросюжетный политический триллер о том, как кризис превращается в инструмент власти, а уязвимость инфраструктуры становится постоянной и неразрешимой проблемой.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Former US President George Mullen leads the investigation into a series of cyber attacks that derailed trains, planes and the stock market — and may be only the first wave. The closer he gets to the source, the less clear it is where the enemy ends and his own politics begin. A sharp political thriller about how a crisis becomes an instrument of power, and infrastructure vulnerability becomes permanent and unsolvable.</p>
