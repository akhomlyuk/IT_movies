            <p class="film-desc">Существовала городская легенда о том, что компания Atari закопала в пустыне Нью-Мексико тысячи картриджей с провальной игрой E.T. — символом краха индустрии видеоигр 1983 года. Этот документальный фильм рассказывает о раскопках в Аламогордо и попутно повествует о том, как компания, принесшая видеоигры в дома пользователей, потерпела крах всего за два года. Это короткая, жизнерадостная и неожиданно трогательная лента о неудаче как части истории технологий — и о том, как миф становится реальностью.</p>
            <p class="film-desc film-desc-alt">Urban legend said Atari buried thousands of cartridges of the failed game E.T. in the New Mexico desert — the symbol of the 1983 industry crash. The documentary follows the excavation in Alamogordo and, along the way, tells how the company that brought games home collapsed in two years. A short, cheerful, unexpectedly touching film about failure as part of tech history — and about how a myth becomes true.</p>

  <script>window.FILM_PAGE = {"item": {"type": "documentary", "titleEn": "Atari: Game Over", "titleRu": "Atari: конец игры", "desc": {"ru": "Существовала городская легенда о том, что компания Atari закопала в пустыне Нью-Мексико тысячи картриджей с провальной игрой E.T. — символом краха индустрии видеоигр 1983 года. Этот документальный фильм рассказывает о раскопках в Аламогордо и попутно повествует о том, как компания, принесшая видеоигры в дома пользователей, потерпела крах всего за два года. Это короткая, жизнерадостная и неожиданно трогательная лента о неудаче как части истории технологий — и о том, как миф становится реальностью.", "en": "Urban legend said Atari buried thousands of cartridges of the failed game E.T. in the New Mexico desert — the symbol of the 1983 industry crash. The documentary follows the excavation in Alamogordo and, along the way, tells how the company that brought games home collapsed in two years. A short, cheerful, unexpectedly touching film about failure as part of tech history — and about how a myth becomes true."}, "genres": ["documentary", "history"], "year": 2014, "imdbId": "tt3715406", "imdbRating": 6.7, "kpId": 893791, "kpRating": 6.8, "kpVotes": 192, "poster": "static/posters/atari_doc_poster.webp"}, "related": [{"type": "documentary", "titleEn": "Video Games: The Movie", "titleRu": "Видеоигры: Кино", "desc": {"ru": "Обзорный документальный фильм об истории и культуре видеоигр: от Pong и залов игровых автоматов 70-х до киберспорта и игр как вида искусства. Вместо единого сюжета — мозаика тем: геймдизайн, нарратив, игровая зависимость, дилемма «эскапизм или творчество», а также мнения разработчиков, актеров и фанатов. Идеальная отправная точка для тех, кто хочет получить системное представление об индустрии, — но слишком общий материал для тех, кто уже глубоко в ней разбирается.", "en": "An overview documentary on the history and culture of video games: from Pong and 70s arcades to esports and games as an art form. Instead of one storyline — a mosaic of themes: game design, narrative, addiction, 'escapism vs creativity', voices of developers, actors and fans. Ideal as a 'zero point' for those who want a systematic view of the industry — too broad for those already inside it."}, "genres": ["documentary", "history"], "year": 2014, "imdbId": "tt3214002", "imdbRating": 6.1, "kpId": 801567, "kpRating": 7.2, "kpVotes": 533, "poster": "static/posters/video_games_doc_poster.webp"}, {"type": "movie", "titleEn": "Pirates of Silicon Valley", "titleRu": "Пираты Силиконовой долины", "desc": {"ru": "Телефильм, рассказывающий историю зарождения персонального компьютера: от гаража Джобса и Возняка до момента, когда Microsoft перехватила идею графического интерфейса. Джобс здесь предстает как визионер и тиран, Гейтс — как расчетливый переговорщик, а вся индустрия — как гонка, в которой побеждает не тот, кто изобрел, а тот, кто первым сумел продать. Один из лучших исторических фильмов об IT: ясный, живой, лишенный слепого преклонения перед героями. Идеальная отправная точка для знакомства с историей Кремниевой долины.", "en": "A made-for-TV chronicle of the personal computer's birth: from the garage of Jobs and Wozniak to Microsoft intercepting the graphical interface idea. Jobs here is a visionary and a tyrant, Gates a calculating negotiator, and the whole industry a race where the winner is not the one who invented but the one who sold first. One of the best historical films about IT: clear, lively, without hero worship. A perfect entry point into Silicon Valley history."}, "genres": ["history", "drama"], "year": 1999, "imdbId": "tt0168122", "imdbRating": 7.2, "kpId": 95636, "kpRating": 7.5, "kpVotes": 17102, "poster": "static/posters/piratesofsiliconvalley_film_poster.webp"}, {"type": "documentary", "titleEn": "BBS: The Documentary", "titleRu": "BBS: The Documentary", "desc": {"ru": "Трехчасовая эпопея Джейсона Скотта о BBS (системах электронных досок объявлений) — сетях, существовавших до появления интернета, когда люди связывались друг с другом через модемные соединения в 80-х годах. Именно здесь зародились онлайн-сообщества, «холивары», первые вирусы и первые модераторы. Этот документальный фильм построен на интервью с людьми, которые создавали этот мир — от авторов программного обеспечения до системных операторов (сисопов). Фильм обязателен к просмотру для всех, кто рассуждает о современных социальных сетях: всё это уже было раньше — просто происходило медленнее, на скорости 2400 бод.", "en": "Jason Scott's three-hour epic about Bulletin Board Systems — the networks before the internet, when modem calls connected people in the 80s. Online communities, flame wars, the first viruses and the first moderators all appeared here. A documentary built on interviews with the people who built it all, from software authors to sysops. Required viewing for anyone talking about social media today: it all happened before, just slower, at 2400 baud."}, "genres": ["history"], "year": 2005, "imdbId": "tt0460402", "imdbRating": 8.4, "imdbVotes": 361, "kpId": 787567, "kpRating": null, "poster": "static/posters/bbs_doc_poster.webp"}, {"type": "documentary", "titleEn": "The AI Doc: Or How I Became an Apocaloptimist", "titleRu": "Док об ИИ: Или как я стал апокалиптимистом", "desc": {"ru": "Режиссер Дэниел Роэр готовится стать отцом и решает разобраться, в каком мире предстоит расти его ребенку. В ходе серии откровенных бесед с ключевыми фигурами индустрии искусственного интеллекта он исследует эту сферу: от всеобщего воодушевления и революционных перемен в медицине до опасений по поводу утраты контроля и потери рабочих мест. Формат «личного путешествия» позволяет фильму избежать нравоучительного тона и дает возможность поразмышлять вслух — с той же смесью тревоги и надежды, которую испытывает любой родитель ребенка эпохи цифровых технологий.", "en": "Director Daniel Roher is about to become a father and decides to understand the world his child will grow up in. Through a series of candid conversations with leading voices of the AI industry, he maps the field: from enthusiasm and medical revolution to fears about control and job loss. The 'personal journey' format lets the film avoid lecturing and think out loud — with the same mix of anxiety and hope any parent of the digital generation feels."}, "genres": ["documentary"], "year": 2026, "imdbId": "tt39150120", "imdbRating": 6.8, "imdbVotes": 235, "kpId": 11813093, "kpRating": null, "poster": "static/posters/theaidoc_doc_poster.webp"}, {"type": "documentary", "titleEn": "The Inventor: Out for Blood in Silicon Valley", "titleRu": "Изобретатель: Жажда крови в Силиконовой долине", "desc": {"ru": "Элизабет Холмс обещала революцию: всего одна капля крови вместо десятков анализов и компания Theranos стоимостью девять миллиардов долларов. Алекс Гибни реконструирует историю краха, опираясь на интервью, записи совещаний и свидетельства сотрудников: он показывает, как вера в миссию заглушала сомнения, как обложки журналов подменяли собой клинические испытания и как пациенты становились жертвами обмана. Это лучший документальный фильм о мифологии стартапов — обязательный к просмотру для всех, кто верит громким обещаниям, звучащим со сцены.", "en": "Elizabeth Holmes promised a revolution: one drop of blood instead of dozens of tests, a company called Theranos worth nine billion dollars. Alex Gibney assembles the fall through interviews, boardroom tapes and employee testimony: how belief in the mission suppressed doubt, how magazine covers replaced clinical trials, how patients became the victims. The best documentary about startup mythology — required viewing for anyone who believes loud promises on stage."}, "genres": ["documentary", "biography"], "year": 2019, "imdbId": "tt8488126", "imdbRating": 7.2, "kpId": 1160654, "kpRating": 7.2, "kpVotes": 8349, "poster": "static/posters/theinventor_doc_poster.webp"}], "posterW": 404, "posterH": 600};</script>
