            <h1 class="film-title">АльфаГо</h1>
            <p class="film-alt">AlphaGo</p>
            <div class="film-meta">
              <span class="film-meta-item">2017</span>
              <span class="film-meta-item">Документальный</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/1049453/" target="_blank" rel="noopener noreferrer">Кинопоиск: 8.1 ★</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt6700846/" target="_blank" rel="noopener noreferrer">IMDb: 7.8 ★</a>
        </div>
            <p class="film-desc">Хроника матча AlphaGo против Ли Седоля — сильнейшего игрока в го своего десятилетия. Никто не ожидал победы машины: го считалось игрой, требующей интуиции и неподвластной простому перебору вариантов. Фильм запечатлел не только сами партии, но и лица людей: неверие, отчаяние и — в четвертой игре — тот самый «37-й ход», после которого стало ясно: машина играет не как человек, а как нечто совершенно иное. Документальная лента о моменте, когда теория стала историей.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">The chronicle of AlphaGo&#x27;s match against Lee Sedol, the best Go player of his decade. No one expected the machine to win: Go was considered an &#x27;intuitive&#x27; game beyond bruteforce. The film captures not just the games but the faces: disbelief, despair, and — in game four — &#x27;move 37&#x27;, after which people understood the machine was not playing like a human but like something else entirely. A documentary about the moment theory turned into history.</p>
            </details>
          </div>
