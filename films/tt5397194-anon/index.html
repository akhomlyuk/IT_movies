            <p class="film-desc">Будущее, в котором упразднено понятие частной жизни: каждый миг существования фиксируется «глазами», полиция восстанавливает события по воспоминаниям свидетелей, а доказательства собираются задним числом. Детектив Сэл Фриленд расследует серию убийств, которые никто не видит, — преступления совершает та, кто умеет стирать себя из чужих записей. Это антиутопия, снятая в жанре полицейского процедурала и задающая неудобный вопрос: если всё вокруг записывается, что же остается от человека — и возможна ли вообще вина, если нет памяти? Эндрю Никкол, режиссер «Гаттаки», здесь в своей стихии.</p>
            <p class="film-desc film-desc-alt">A future where privacy is abolished: every moment of life is recorded through the eyes, police replay events from witnesses&#x27; memories, and evidence is gathered retroactively. Detective Sal Frieland investigates a series of murders no one can see, committed by someone who knows how to delete herself from other people&#x27;s records. A dystopia shot as a procedural, asking an uncomfortable question: if everything is recorded, what is left of a person — and is guilt even possible without memory? Andrew Niccol, director of Gattaca, in his element.</p>
