        <div class="ratings">

            <p class="film-desc">Молодой программист получает шанс на новую жизнь в берлинском подразделении IT-компании — но по пути знакомится с группой хакеров, для которых «серые схемы» — не преступление, а образ мышления. Между легальной карьерой и фривольным криминалом он балансирует всё дольше, пока оба мира не сходятся в одной точке. Немецкий сериал о цене таланта в индустрии, где навык взлома ценится и в гараже, и в совете директоров.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">A young programmer gets a shot at a new life at a Berlin IT company — but on the way falls in with a crew of hackers for whom &#x27;gray schemes&#x27; are not a crime but a way of thinking. Between the legal career and the casual crime he keeps balancing, until both worlds meet in one point. A German series about the price of talent in an industry where the skill to break things is valued both in the garage and in the boardroom.</p>
            </details>
          </div>
