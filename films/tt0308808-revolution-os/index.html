            <h1 class="film-title">Революционная ОС</h1>
            <p class="film-alt">Revolution OS</p>
            <div class="film-meta">
              <span class="film-meta-item">2001</span>
              <span class="film-meta-item">Документальный, Инди</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/13343/" target="_blank" rel="noopener noreferrer">Кинопоиск: 7.2 ★</a>

            <p class="film-desc">История движения за свободное программное обеспечение: от идеи Ричарда Столлмана до Linux Линуса Торвальдса — и до того момента, когда открытый исходный код стал основой корпоративной инфраструктуры. Интервью с Торвальдсом, Эриком Рэймондом, Брюсом Перенсом и другими показывают, как «хиппи с лицензией GPL» победили не благодаря идеологии, а благодаря качеству кода. Обязательно к просмотру для всех, кто пользуется Linux, Git и открытыми технологиями — и хочет знать, как всё это начиналось.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">The history of the free software movement, from Richard Stallman&#x27;s idea to Linus Torvalds&#x27;s Linux — and to the moment open source became the backbone of corporate infrastructure. Interviews with Torvalds, Eric Raymond, Bruce Perens and others show how &#x27;hippies with a GPL license&#x27; won not through ideology but through code quality. Required viewing for everyone who uses Linux, Git and everything open — and wants to know where it all came from.</p>
            </details>
          </div>
