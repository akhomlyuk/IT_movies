            <p class="film-desc">Агент ФБР Дженнифер Марш, специализирующаяся на киберпреступлениях, обнаруживает сайт, где в прямом эфире транслируется убийство, — причем темп происходящего ускоряется с каждым новым зрителем. Трафик, клики и любопытство превращаются в оружие: убийцу невозможно поймать, пока толпа продолжает смотреть. Формула проста и безжалостна: каждый из нас — тот самый зритель. Это триллер о механике жестокости в интернете, созданный задолго до того, как трансляции преступлений перестали быть фантастикой.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">FBI agent Jennifer Marsh, who works cyber crime, finds a site where a murder is streamed live — and speeds up with every new viewer. Traffic, clicks and curiosity become the weapon: the killer cannot be caught while the crowd keeps watching. The formula is simple and merciless: each of us is that viewer. A thriller about the mechanics of online cruelty — made well before crime streams stopped being science fiction.</p>
