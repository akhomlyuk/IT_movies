          <div class="film-info">
            <h1 class="film-title">BBS: The Documentary</h1>
            <div class="film-meta">
              <span class="film-meta-item">2005</span>
              <span class="film-meta-item">Документальный, История</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/787567/" target="_blank" rel="noopener noreferrer">Кинопоиск: —</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt0460402/" target="_blank" rel="noopener noreferrer">IMDb: 8.4 ★</a>
        </div>
            <p class="film-desc">Трехчасовая эпопея Джейсона Скотта о BBS (системах электронных досок объявлений) — сетях, существовавших до появления интернета, когда люди связывались друг с другом через модемные соединения в 80-х годах. Именно здесь зародились онлайн-сообщества, «холивары», первые вирусы и первые модераторы. Этот документальный фильм построен на интервью с людьми, которые создавали этот мир — от авторов программного обеспечения до системных операторов (сисопов). Фильм обязателен к просмотру для всех, кто рассуждает о современных социальных сетях: всё это уже было раньше — просто происходило медленнее, на скорости 2400 бод.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Jason Scott&#x27;s three-hour epic about Bulletin Board Systems — the networks before the internet, when modem calls connected people in the 80s. Online communities, flame wars, the first viruses and the first moderators all appeared here. A documentary built on interviews with the people who built it all, from software authors to sysops. Required viewing for anyone talking about social media today: it all happened before, just slower, at 2400 baud.</p>
            </details>
          </div>
