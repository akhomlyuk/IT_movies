            <p class="film-alt">Travelers</p>
            <div class="film-meta">

        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/998777/" target="_blank" rel="noopener noreferrer">Кинопоиск: 7.3 ★</a>

            <p class="film-desc">Агенты из далекого будущего «перемещаются» в тела людей в момент их смерти, чтобы незаметно влиться в их семьи, работу и привычки — и предотвратить катастрофы, о которых человечество пока даже не подозревает. Строгий устав запрещает им раскрывать себя, однако судьба, эмоции и случайности постоянно грозят сорвать миссию. Это канадская научно-фантастическая история о противостоянии свободы воли и железных приказов Директора, о людях, которые в этой схеме — лишь носители кода, но чьи полные тревог жизни определяют будущее.</p>
            <details class="film-desc-alt-wrap">
              <summary>Описание на английском</summary>
              <p class="film-desc film-desc-alt">Operatives from the distant future &#x27;travel&#x27; into the bodies of people at the moment of their death: to quietly merge into their families, jobs and habits — and prevent the disasters humanity does not yet see. The legend forbids exposing themselves, while fate, emotions and chance constantly risk wrecking the mission. A Canadian sci-fi about free will versus the Director&#x27;s iron orders, and about people who are just carriers of code in the scheme — yet whose restless lives decide the future.</p>
            </details>
