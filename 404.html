      function apply(lang) {
        var t = I18N[lang];
        document.documentElement.lang = lang;
        document.title = t.title;
        var meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute("content", t.desc);
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (t[key] !== undefined) el.innerHTML = t[key];
        });
        var langBtn = document.querySelector(".lang");
        if (langBtn) {
          langBtn.textContent = "🌐 " + lang.toUpperCase();
          langBtn.setAttribute("aria-label", t.swapLang);
        }
        var chTelegram = document.querySelector(".ch-link--tg");
        var chMax = document.querySelector(".ch-link--max");
        if (chTelegram) {
          chTelegram.setAttribute("aria-label", t.telegramChannel);
          chTelegram.setAttribute("title", t.telegramChannel);
          var tgText = chTelegram.querySelector("span");
          if (tgText) { tgText.textContent = t.telegramLabel; }
        }
        if (chMax) {
          chMax.setAttribute("aria-label", t.maxChannel);
          chMax.setAttribute("title", t.maxChannel);
          var mxText = chMax.querySelector("span");
          if (mxText) { mxText.textContent = t.maxLabel; }
        }
        var themeBtn = document.querySelector(".theme-toggle");
        if (themeBtn) {
          themeBtn.textContent = theme === "dark" ? "🌙" : "☀️";
          themeBtn.setAttribute("aria-label", theme === "dark" ? t.themeToLight : t.themeToDark);
        }
      }
      var lang = window.__404Lang === "ru" ? "ru" : "en";
      var theme = document.documentElement.classList.contains("dark") ? "dark" : "light";
      apply(lang);
      var langBtn = document.querySelector(".lang");
      if (langBtn) {
        langBtn.addEventListener("click", function () {
          lang = lang === "ru" ? "en" : "ru";
          try { localStorage.setItem("it-movies-lang", lang); } catch (e) {}
          apply(lang);
        });
      }
      var themeBtn = document.querySelector(".theme-toggle");
      if (themeBtn) {
        themeBtn.addEventListener("click", function () {
          theme = theme === "dark" ? "light" : "dark";
          try { localStorage.setItem("it-movies-theme", theme); } catch (e) {}
          var snap = document.createElement("style");
          snap.textContent = "*,*::before,*::after{transition:none !important}";
          document.head.appendChild(snap);
          void document.body.offsetHeight;
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.classList.toggle("light", theme === "light");
          var csMeta = document.querySelector('meta[name="color-scheme"]');
          if (csMeta) csMeta.setAttribute("content", theme);
          apply(lang);
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              snap.remove();
            });
          });
        });
      }
    })();
