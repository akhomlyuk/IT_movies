<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Movies - Список фильмов и сериалов о компьютерах, технологиях и искусственном интеллекте</title>
  <meta name="description" content="Подборка фильмов и сериалов о компьютерах, технологиях и искусственном интеллекте">
  <meta property="og:title" content="IT Movies">
  <meta property="og:description" content="A curated list of films and series about computers, technology and AI">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:image" content="https://akhomlyuk.github.io/IT_movies/static/ogimage.webp">
  <meta property="og:url" content="https://akhomlyuk.github.io/IT_movies/">
  <link rel="canonical" href="https://akhomlyuk.github.io/IT_movies/">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://akhomlyuk.github.io/IT_movies/static/ogimage.webp">
  <link rel="preconnect" href="https://mc.yandex.ru" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/webp" href="static/logo.webp">
  <!-- Yandex.Metrika counter -->
  <script type="text/javascript">
    (function(m,e,t,r,i,k,a){
        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
        m[i].l=1*new Date();
        for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=112571181', 'ym');

    ym(112571181, 'init', {ssr:true, clickmap:true, referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/112571181" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <!-- /Yandex.Metrika counter -->
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <div class="logo">
          <img src="static/logo.webp" alt="IT Movies Logo" fetchpriority="high" width="100" height="100">
        </div>
        <div class="brand-text">
          <h1>{{ t.title }}</h1>
          <p>{{ t.subtitle }}</p>
          <p class="invite" v-html="t.invite"></p>
        </div>
      </div>
      <div class="toolbar">
        <div class="lang" role="group" :aria-label="lang === 'ru' ? 'Язык / Language' : 'Language / Язык'">
          <button type="button" :class="{ active: lang === 'ru' }" :aria-pressed="lang === 'ru'" @click="setLang('ru')">RU</button>
          <button type="button" :class="{ active: lang === 'en' }" :aria-pressed="lang === 'en'" @click="setLang('en')">EN</button>
        </div>
        <div class="theme-toggle" role="group" :aria-label="t.theme">
          <button type="button" :class="{ active: theme === 'dark' }" :aria-pressed="theme === 'dark'" :aria-label="t.themeDark" @click="setTheme('dark')">🌙</button>
          <button type="button" :class="{ active: theme === 'light' }" :aria-pressed="theme === 'light'" :aria-label="t.themeLight" @click="setTheme('light')">☀️</button>
        </div>
        <div class="filter-row">
          <button type="button" class="fav-filter" :class="{ active: onlyFav }" :aria-pressed="onlyFav" :aria-label="t.favFilter" :title="t.favFilterTitle" @click="onlyFav = !onlyFav">
            <img src="static/favorite_32.png" alt="" width="32" height="32">
          </button>
          <input id="srch" class="search" v-model="query" type="search" :placeholder="t.search" :aria-label="t.search">
        </div>
      </div>
    </header>

    <nav class="nav">
      <a href="#movies">{{ t.movies }}</a> <span>{{ counts.movies }}</span>
      <a href="#series">{{ t.series }}</a> <span>{{ counts.series }}</span>
      <a href="#documentaries">{{ t.documentaries }}</a> <span>{{ counts.documentaries }}</span>
    </nav>

    <main>
    <catalog-table id="movies" type-key="movie" :title="t.movies" :items="movies" :t="t" :lang="lang" :sort="sorts.movie" @sort="sortBy"></catalog-table>
    <catalog-table id="series" type-key="series" :title="t.series" :items="series" :t="t" :lang="lang" :sort="sorts.series" @sort="sortBy"></catalog-table>
    <catalog-table id="documentaries" type-key="documentary" :title="t.documentaries" :items="documentaries" :t="t" :lang="lang" :sort="sorts.documentary" @sort="sortBy"></catalog-table>
    </main>
    <footer>
      <span>{{ t.codedWith }}</span><span class="heart"> ♥ </span><a href="https://t.me/wh_lab" target="_blank" rel="noopener">Exited3n</a>
      <span v-if="loadTime !== null"> ⚡️ {{ t.loadLabel }}: {{ loadTime }}ms</span>
      <span class="counts-all"> 🎬 {{ t.total }}: {{ counts.all }}</span>
    </footer>
    <button class="scroll-top" :aria-label="t.scrollTop" @click="scrollToTop" v-show="showScrollTop">↑</button>
  </div>

  <template id="tpl-catalog">
    <section :id="id">
      <h2>{{ title }}</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th :class="thClass('title')" :aria-sort="ariaSort('title')" tabindex="0" @click="$emit('sort', typeKey, 'title')" @keydown.enter="$emit('sort', typeKey, 'title')">{{ t.name }} <span class="arrow">{{ arrow('title') }}</span></th>
              <th :class="thClass('genre')" :aria-sort="ariaSort('genre')" tabindex="0" @click="$emit('sort', typeKey, 'genre')" @keydown.enter="$emit('sort', typeKey, 'genre')">{{ t.genre }} <span class="arrow">{{ arrow('genre') }}</span></th>
              <th :class="thClass('year')" :aria-sort="ariaSort('year')" tabindex="0" @click="$emit('sort', typeKey, 'year')" @keydown.enter="$emit('sort', typeKey, 'year')">{{ t.year }} <span class="arrow">{{ arrow('year') }}</span></th>
              <th :class="thClass('kp')" :aria-sort="ariaSort('kp')" tabindex="0" @click="$emit('sort', typeKey, 'kp')" @keydown.enter="$emit('sort', typeKey, 'kp')"><span class="th-label"><img class="col-icon" src="static/favicon_kp.png" alt="" width="14" height="14"><span class="th-text">{{ t.kp }}</span></span> <span class="arrow">{{ arrow('kp') }}</span></th>
              <th :class="thClass('imdb')" :aria-sort="ariaSort('imdb')" tabindex="0" @click="$emit('sort', typeKey, 'imdb')" @keydown.enter="$emit('sort', typeKey, 'imdb')"><span class="th-label"><img class="col-icon" src="static/favicon_imdb.png" alt="" width="14" height="14"><span class="th-text">{{ t.imdb }}</span></span> <span class="arrow">{{ arrow('imdb') }}</span></th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="item in items" :key="item.imdbId || item.kpId">
              <td class="title-cell">
                <span class="poster-wrap" v-if="withPosters && item.poster">
                  <img class="poster-icon" src="static/poster_icon.png" alt="" width="24" height="24" loading="lazy" decoding="async" @click.stop="openPoster(item)">
                </span>
                <span class="fav-icon" :title="t.recommend" v-if="item.fav"><img :src="favIcon" :alt="t.recommend" width="24" height="24"></span>
                <a v-if="item.imdbId" :href="imdbUrl(item)" target="_blank" rel="noopener">{{ displayTitle(item) }}</a>
                <a v-else-if="item.kpId" :href="kpUrl(item)" target="_blank" rel="noopener">{{ displayTitle(item) }}</a>
                <span v-else>{{ displayTitle(item) }}</span>
                <span class="alt-title" v-if="altTitle(item)">{{ altTitle(item) }}</span>
              </td>
              <td class="genre">{{ genreLabel(item) }}</td>
              <td class="year">{{ item.year }}</td>
              <td class="num">
                <a class="kp" :href="kpUrl(item)" target="_blank" rel="noopener"><span :class="{ 'no-data': !hasRating(item.kpRating) }">{{ formatRating(item.kpRating, t) }}</span><span class="star" v-if="isHighRating(item.kpRating)" aria-hidden="true">★</span></a>
              </td>
              <td class="num">
                <a class="imdb" :href="imdbUrl(item)" target="_blank" rel="noopener"><span :class="{ 'no-data': !hasRating(item.imdbRating) }">{{ formatRating(item.imdbRating, t) }}</span><span class="star" v-if="isHighRating(item.imdbRating)" aria-hidden="true">★</span></a>
              </td>
            </tr>
            <tr v-if="!items.length">
              <td colspan="5" class="empty">{{ t.empty }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <teleport to="body">
        <div class="poster-modal" v-if="selectedPoster" role="dialog" aria-modal="true" :aria-label="displayTitle(selectedPoster)" @click.self="closePoster">
          <div class="poster-modal-inner">
            <img :src="selectedPoster.poster" :alt="displayTitle(selectedPoster)" loading="lazy" decoding="async">
            <button class="poster-close" :aria-label="t.close" @click="closePoster"><img src="static/close_icon.png" alt="" width="24" height="24"></button>
          </div>
        </div>
      </teleport>
    </section>
  </template>

  <script src="js/vue.global.prod.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
