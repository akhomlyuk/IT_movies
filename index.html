<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Movies - Список фильмов и сериалов о компьютерах, технологиях и искусственном интеллекте</title>
  <meta name="description" content="Подборка фильмов и сериалов о компьютерах, технологиях и искусственном интеллекте">
  <meta property="og:title" content="IT Movies">
  <meta property="og:description" content="A curated list of films and series about computers, technology and AI">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:image" content="https://akhomlyuk.github.io/IT_movies/static/logo.webp">
  <meta property="og:url" content="https://akhomlyuk.github.io/IT_movies/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://akhomlyuk.github.io/IT_movies/static/logo.webp">
  <link rel="preconnect" href="https://mc.yandex.ru" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/webp" href="static/logo.webp">
  <!-- Yandex.Metrika counter -->
  <script type="text/javascript">
    (function(m,e,t,r,i,k,a){
        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
        m[i].l=1*new Date();
        for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=112571181', 'ym');

    ym(112571181, 'init', {ssr:true, clickmap:true, referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/112571181" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <!-- /Yandex.Metrika counter -->
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <div class="logo">
          <img src="static/logo.webp" alt="IT Movies Logo" fetchpriority="high" width="100" height="100">
        </div>
        <div class="brand-text">
          <h1>{{ t.title }}</h1>
          <p>{{ t.subtitle }}</p>
          <p class="invite" v-html="t.invite"></p>
        </div>
      </div>
      <div class="toolbar">
        <div class="lang" role="group" :aria-label="lang === 'ru' ? 'Язык / Language' : 'Language / Язык'">
          <button type="button" :class="{ active: lang === 'ru' }" :aria-pressed="lang === 'ru'" @click="setLang('ru')">RU</button>
          <button type="button" :class="{ active: lang === 'en' }" :aria-pressed="lang === 'en'" @click="setLang('en')">EN</button>
        </div>
        <div class="theme-toggle" role="group" :aria-label="t.theme">
          <button type="button" :class="{ active: theme === 'dark' }" :aria-pressed="theme === 'dark'" :aria-label="t.themeDark" @click="setTheme('dark')">🌙</button>
          <button type="button" :class="{ active: theme === 'light' }" :aria-pressed="theme === 'light'" :aria-label="t.themeLight" @click="setTheme('light')">☀️</button>
        </div>
        <input id="srch" class="search" v-model="query" type="search" :placeholder="t.search" :aria-label="t.search">
      </div>
    </header>

    <nav class="nav">
      <a href="#movies">{{ t.movies }}</a> <span>{{ counts.movies }}</span>
      <a href="#series">{{ t.series }}</a> <span>{{ counts.series }}</span>
      <a href="#documentaries">{{ t.documentaries }}</a> <span>{{ counts.documentaries }}</span>
    </nav>

    <main>
    <catalog-table id="movies" type-key="movie" :title="t.movies" :items="movies" :t="t" :lang="lang" :sort="sorts.movie" :with-posters="isDesktop" @sort="sortBy"></catalog-table>
    <catalog-table id="series" type-key="series" :title="t.series" :items="series" :t="t" :lang="lang" :sort="sorts.series" :with-posters="isDesktop" @sort="sortBy"></catalog-table>
    <catalog-table id="documentaries" type-key="documentary" :title="t.documentaries" :items="documentaries" :t="t" :lang="lang" :sort="sorts.documentary" :with-posters="isDesktop" @sort="sortBy"></catalog-table>
    </main>
    <footer>
      {{ t.codedWith }}<span class="heart"> ♥ </span><a href="https://t.me/wh_lab" target="_blank" rel="noopener">Exited3n</a>
      <span v-if="renderTime"> ⚡️ {{ t.renderLabel }}: {{ renderTime }}ms</span><span> 🎬 {{ t.total }}: {{ counts.all }}</span>
    </footer>
    <button class="scroll-top" :aria-label="t.scrollTop" @click="scrollToTop" v-show="showScrollTop">↑</button>
  </div>

  <script src="js/vue.global.prod.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
