<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Movies - Список фильмов и сериалов о компьютерах, технологиях и искусственном интеллекте</title>
  <meta name="description" content="A list of movies and series about computers, technology and artificial intelligence">
  <meta property="og:title" content="IT Movies">
  <meta property="og:description" content="A list of movies and series about computers, technology, ai">
  <meta property="og:image" content="static/logo.png">
  <meta property="og:url" content="https://akhomlyuk.github.io/IT_movies/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://mc.yandex.ru" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="static/logo.png">
  <!-- Yandex.Metrika counter -->
  <script type="text/javascript">
    (function(m,e,t,r,i,k,a){
        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
        m[i].l=1*new Date();
        for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=112571181', 'ym');

    ym(112571181, 'init', {ssr:true, clickmap:true, referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/112571181" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <!-- /Yandex.Metrika counter -->
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <div class="logo">
          <img src="static/logo.png" alt="IT Movies Logo" fetchpriority="high" width="100" height="100">
        </div>
        <div class="brand-text">
          <h1>{{ t.title }}</h1>
          <p>{{ t.subtitle }}</p>
          <p class="invite" v-html="t.invite"></p>
        </div>
      </div>
      <div class="toolbar">
        <div class="lang" role="group">
          <button type="button" :class="{ active: lang === 'ru' }" @click="setLang('ru')">RU</button>
          <button type="button" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
        </div>
        <div class="theme-toggle" role="group">
          <button type="button" :class="{ active: theme === 'dark' }" @click="setTheme('dark')">🌙</button>
          <button type="button" :class="{ active: theme === 'light' }" @click="setTheme('light')">☀️</button>
        </div>
        <input id="srch" class="search" v-model="query" type="search" :placeholder="t.search">
      </div>
    </header>

    <nav class="nav">
      <a href="#movies">{{ t.movies }}</a> <span>{{ counts.movies }}</span>
      <a href="#series">{{ t.series }}</a> <span>{{ counts.series }}</span>
      <a href="#documentaries">{{ t.documentaries }}</a> <span>{{ counts.documentaries }}</span>
    </nav>
    <main>
    <catalog-table id="movies" type-key="movie" :title="t.movies" :items="movies" :t="t" :lang="lang" :sort="sorts.movie" @sort="sortBy"></catalog-table>
    <catalog-table id="series" type-key="series" :title="t.series" :items="series" :t="t" :lang="lang" :sort="sorts.series" @sort="sortBy"></catalog-table>
    <catalog-table id="documentaries" type-key="documentary" :title="t.documentaries" :items="documentaries" :t="t" :lang="lang" :sort="sorts.documentary" @sort="sortBy"></catalog-table>
    </main>
    <footer>
      Coded with <span class="heart">♥</span> by <a href="https://t.me/wh_lab" target="_blank" rel="noopener">Exited3n</a>
    </footer>
    <button class="scroll-top" @click="scrollToTop" v-show="showScrollTop">↑</button>
  </div>

  <script src="https://unpkg.com/vue@3.5.42/dist/vue.global.prod.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
