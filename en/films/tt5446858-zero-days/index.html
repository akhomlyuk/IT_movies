            <p class="film-desc">Alex Gibney investigates Stuxnet — the worm that wrecked the centrifuges of Iran&#x27;s nuclear program and became history&#x27;s first cyber weapon to destroy a physical object. Through intelligence sources the film reconstructs the operation: authorship, tests on replica centrifuges, and the escalation program that followed. The core conclusion is about an arms race with no treaty, no arbitration and no rules — only exploits.</p>
            <details class="film-desc-alt-wrap">
              <summary>Russian synopsis</summary>
              <p class="film-desc film-desc-alt">Алекс Гибни исследует историю Stuxnet — компьютерного червя, который вывел из строя центрифуги иранской ядерной программы и стал первым в истории кибероружием, уничтожившим физический объект. Опираясь на данные разведки, фильм реконструирует ход операции: от установления авторов и испытаний на копиях центрифуг до последовавшей за этим эскалации. Главный вывод картины сводится к тому, что речь идет о гонке вооружений, не регулируемой никакими договорами, арбитражем или правилами, — в ней существуют лишь уязвимости и способы их эксплуатации.</p>
            </details>
