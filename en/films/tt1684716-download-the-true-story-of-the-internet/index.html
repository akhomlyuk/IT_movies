            <h1 class="film-title">Download: The True Story of the Internet</h1>
            <p class="film-alt">Загрузка: Подлинная история Интернета</p>
            <div class="film-meta">
              <span class="film-meta-item">2008</span>
              <span class="film-meta-item">Documentary, History</span>
            </div>
        <div class="ratings">
          <a class="kp rating-chip rating-chip--kp" href="https://www.kinopoisk.ru/film/568047/" target="_blank" rel="noopener noreferrer">Kinopoisk: 7.5 ★</a>
          <a class="imdb rating-chip rating-chip--imdb" href="https://www.imdb.com/title/tt1684716/" target="_blank" rel="noopener noreferrer">IMDb: 7.7 ★</a>
        </div>
            <p class="film-desc">A four-part Discovery series on how private experiments became a global network: BBS and Usenet, Tim Berners-Lee and browsers, the dotcom bubble and online business. A chronicle with the people who actually did it, from Netscape&#x27;s founders to eBay&#x27;s. It becomes clear why the internet looks the way it does: every familiar thing is a trace of someone&#x27;s war over standards. A great &#x27;internet history in one evening&#x27; option.</p>
            <details class="film-desc-alt-wrap">
              <summary>Russian synopsis</summary>
              <p class="film-desc film-desc-alt">Четырехсерийный документальный цикл канала Discovery о том, как частные эксперименты превратились в глобальную сеть: от BBS и Usenet до Тима Бернерса-Ли и первых браузеров, от «пузыря доткомов» до становления онлайн-бизнеса. Это хроника событий, рассказанная их непосредственными участниками — от основателей Netscape до создателей eBay. Становится понятно, почему интернет выглядит именно так: за каждым привычным элементом скрывается чья-то борьба за стандарты. Отличный вариант, чтобы изучить историю интернета за один вечер.</p>
            </details>
          </div>
